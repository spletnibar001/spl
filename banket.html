<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Банкеты - SPLETNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0D;--card:#151518;--card2:#1D1D21;--line:#26262B;--line2:#333338;--text:#F2F2F2;--muted:#9A9AA3;--soft:#D8D8DD;
  --red:#E3262B;--red2:#FF6B6E;--redbg:#1A0F10;--green:#2FD27A;--green2:#1E6B44;--greenbg:#0F1A14;--amber:#E8B84C;--amberbg:#1d180c;--blue:#7FCBF3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--green)}
.h{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:1px}
.muted{color:var(--muted)} .soft{color:var(--soft)} .small{font-size:13px} .xs{font-size:12px} .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red2)}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,13,.97);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.logo{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:40px;padding:0 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.tab.on{border:2px solid var(--green)}
.sp{flex:1}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:13px;font-weight:500;white-space:nowrap}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn.on{border:2px solid var(--green)}
.btn.prim{background:var(--red);border:0;color:#fff;font-weight:600}
.btn.grn{border-color:var(--green);color:var(--green);background:transparent}
.btn.ghost{background:transparent}
.btn.dang{color:var(--red2)}
.wrap{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card>.h{font-size:15px;color:var(--red2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chip.on{border:2px solid var(--green)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
label.f.full{grid-column:1/-1}
.inp{height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);padding:0 12px;outline:none;width:100%;color:var(--text)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
.inp:focus{border-color:#55555c}
.inp.err{border-color:var(--red)}
select.inp{appearance:none}
.cnt{display:flex;align-items:center;gap:8px}
.mp{margin-top:12px;border:1px solid var(--line2);border-radius:12px;padding:12px}
.mp-hint{border:1px solid #5a4a1c;background:var(--amberbg);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--amber);display:flex;align-items:center;flex-wrap:wrap;gap:4px}.mp-hint b{color:var(--text)}
.mp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.mp-b{font-size:11px;padding:1px 6px;border-radius:8px;margin-left:4px}.mp-b.lo{background:var(--redbg);color:var(--red2)}.mp-b.ok{background:var(--greenbg);color:var(--green)}
.mp-need{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:13px;flex-wrap:wrap}.mp-bar{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.mp-bar i{display:block;height:100%}
.mp-it{display:grid;grid-template-columns:1fr auto 150px;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line)}.mp-x{border-style:dashed}
.cnt b{font-family:Oswald,sans-serif;font-size:26px;min-width:52px;text-align:center}
.q{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:18px;line-height:1}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pl{padding:0;border-radius:14px;background:var(--card2);border:1px solid var(--line);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pl.on{border:2px solid var(--green)}
.pl.no{opacity:.4;cursor:not-allowed}
.pl .im{height:84px;background:#222226 center/cover;display:flex;align-items:center;justify-content:center;font-family:Oswald;color:#55555c;letter-spacing:1px;text-transform:uppercase;font-size:12px}
.pl .bd{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.pl b{font-weight:600}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid #1F1F23;vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t tr.grp td{background:#18181c;font-weight:600;font-size:12px;color:var(--soft)}
table.t input.inp{height:32px;padding:0 8px}
table.t input.qty{width:64px;text-align:center}
table.t input.money{width:110px;text-align:right}
.unit{display:inline-block;width:46px;text-align:left}
.sum-per{font-family:Oswald,sans-serif;font-size:34px;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.kv.big{font-size:16px;font-weight:600;border-top:1px solid var(--line2);padding-top:8px;margin-top:4px}
.box-g{border:1px solid var(--green2);background:var(--greenbg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.box-a{border:1px solid #5a4a1c;background:var(--amberbg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.box-r{border:1px solid #6b2427;background:var(--redbg);border-radius:12px;padding:12px 14px;font-size:13px}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;border:1px solid}
.st.new{color:var(--blue);border-color:#2a5d78}
.st.work{color:var(--amber);border-color:#5a4a1c}
.st.confirmed{color:var(--amber);border-color:#5a4a1c}
.st.paid{color:var(--green);border-color:var(--green2)}
.st.cashier{color:var(--amber);border-color:#5a4a1c}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line2);background:var(--card2);font-size:13px}.chip.on{border:2px solid var(--green);color:var(--green);font-weight:600}
.kq{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.kq.on{border:2px solid var(--amber)}
.st.done{color:var(--muted);border-color:var(--line2)}
.st.lost{color:var(--red2);border-color:#6b2427}
.list{display:flex;flex-direction:column;gap:8px}
.bq{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 150px 120px;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.bq:hover{border-color:#44444a}
.bq .d{font-family:Oswald;font-size:18px}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.drop{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;border:1px solid var(--line2);border-radius:12px;background:var(--card2);padding:6px}
.drop button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:8px 10px;border-radius:8px;background:transparent;border:0}
.drop button:hover{background:#26262b}
.thumb{width:44px;height:44px;border-radius:8px;background:#26262b center/cover;flex:0 0 auto}
.up{display:flex;gap:10px;align-items:center}
.up .pv{width:120px;height:72px;border-radius:10px;background:#222226 center/cover;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);overflow:hidden}
.up .vp{position:relative;width:120px;height:120px;border-radius:10px;overflow:hidden;background:#000;flex:none}
.up .vp .vbg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(10px) brightness(.55)}
.up .vp .vfg{position:relative;width:100%;height:100%;object-fit:contain}
svg.sch{width:100%;max-height:calc(100vh - 250px);height:auto;display:block;margin:0 auto;border-radius:12px;background:#0F0F12;touch-action:none;user-select:none}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{padding:8px;border-radius:12px;background:var(--card2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:4px}
.tpl.on{border:2px solid var(--green)}
.tpl svg{height:40px;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202024;border:1px solid var(--green2);padding:12px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .card{width:min(420px,92vw)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:Oswald;font-size:22px;font-weight:500}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--red)}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);text-align:center}
#print{display:none}
/* документ расчёта: один стиль для печати и для PDF-файла */
.doc{color:#111;background:#fff;font:11pt/1.45 Inter,Arial,sans-serif}
.doc h1{font:600 22pt Oswald,Arial,sans-serif;letter-spacing:3px;margin:0;color:#111}
.doc .sub{color:#555;font-size:10pt}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}
.doc .meta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
.doc .meta div{border:1px solid #ccc;border-radius:6px;padding:6px 8px}
.doc .meta b{display:block;font-size:11.5pt}
.doc .meta span{font-size:8.5pt;color:#666;text-transform:uppercase;letter-spacing:.5px}
.doc table{width:100%;border-collapse:collapse;margin:0 0 10px}
.doc th{text-align:left;font-size:8.5pt;text-transform:uppercase;color:#666;border-bottom:1px solid #999;padding:4px 6px}
.doc td{padding:4px 6px;border-bottom:1px solid #e3e3e3}
.doc td.r,.doc th.r{text-align:right;white-space:nowrap}
.doc tr.grp td{font-weight:600;background:#f3f3f3}
.doc .tot{display:flex;justify-content:flex-end}
.doc .tot table{width:auto;min-width:320px}
.doc .tot tr.big td{font-size:14pt;font-weight:700;border-top:2px solid #111;border-bottom:0}
.doc .box{border:1px solid #ccc;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:10pt}
.doc .box.main{border:2px solid #111;font-size:11.5pt}
.doc .foot{margin-top:14px;font-size:9pt;color:#666}
.doc tr{page-break-inside:avoid}
.doc .scheme{border:1px solid #ccc;border-radius:6px;padding:6px 8px 8px;margin:0 0 12px;page-break-inside:avoid}
.doc .scheme .sch-t{display:flex;justify-content:space-between;font-size:9.5pt;margin-bottom:4px}.doc .scheme .sch-t span{color:#666}
.doc .scheme img{display:block;margin:0 auto;max-width:100%;height:auto}
.doc tr.gift td{background:#fbf6e8}.doc .gb{display:inline-block;font-size:8pt;font-weight:700;border:1px solid #b8923d;color:#8a6a1e;border-radius:8px;padding:0 6px;margin-left:4px}
.doc .gsub{color:#777;font-size:8.5pt}.doc s{color:#999}
.bq.sel{border:2px solid var(--green)}
.promo .bar i{background:var(--amber)}
.promo{display:flex;gap:10px;align-items:center;border:1px solid #4a3f22;background:linear-gradient(135deg,#1f1a10,var(--card) 70%);border-radius:12px;padding:8px}
.promo.added{border:2px solid var(--green);background:rgba(47,210,122,.05)}
.pth{width:56px;height:64px;flex:none;border-radius:9px;border:1px solid var(--line2);background:#222226 center/cover;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line2);border-radius:10px;padding:2px 8px;color:var(--muted)}.tag.on{border-color:var(--green);color:var(--green)}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.doc *{box-sizing:border-box}
.ready{border:1px solid var(--green);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(31,191,122,.06)}
.ready .btn{height:46px;font-size:14px}
.box-p{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--card2)}
.doc .sh-b{margin-top:14px;page-break-inside:auto}
.doc .sh-h{border-top:2px solid #111;padding:6px 0 4px;margin-top:12px;display:flex;flex-direction:column;gap:2px}
.doc .sh-h b{font-size:12.5pt}.doc .sh-h span{font-size:9.5pt;color:#555}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important}
  header,.wrap,.toast,.modal{display:none!important}
  #print{display:block}
}
/* ---- эргономика 08.11 ---- */
:root{--c-new:var(--blue);--c-work:#9fb4ff;--c-confirmed:var(--amber);--c-cashier:var(--amber);--c-paid:var(--green);--c-done:#6b6b73;--c-lost:var(--red2)}
.st.work{color:#9fb4ff;border-color:#33406b}
.bq{border-left:4px solid var(--stc,var(--line))}
.bq.s-new{--stc:var(--c-new)}.bq.s-work{--stc:var(--c-work)}.bq.s-confirmed{--stc:var(--c-confirmed)}.bq.s-cashier{--stc:var(--c-cashier)}.bq.s-paid{--stc:var(--c-paid)}.bq.s-done{--stc:var(--c-done)}.bq.s-lost{--stc:var(--c-lost)}
.bq .d{font-size:22px;line-height:1}.bq .wd{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.bq .pl-t{font-size:13px;color:var(--soft);font-weight:500}
.grp-h{display:flex;align-items:baseline;gap:10px;margin:14px 2px 2px;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:14px;color:var(--soft)}
.grp-h span{font-family:Inter,sans-serif;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
/* шаги */
.steps{position:sticky;top:61px;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px;margin:-6px 0 2px;background:rgba(11,11,13,.96);border:1px solid var(--line);border-radius:14px}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:13px;font-weight:500;white-space:nowrap}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line2);color:var(--muted)}
.step.ok{border-color:var(--green2)}.step.ok i{border-color:var(--green);color:var(--green)}
.step.need{border-color:#5a4a1c}.step.need i{border-color:var(--amber);color:var(--amber)}
.step.opt i{border-style:dashed}
section.card{scroll-margin-top:130px}
/* что дальше */
.next{display:flex;gap:10px;align-items:center;border:1px solid #5a4a1c;background:var(--amberbg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500;text-align:left;width:100%}
.next.ok{border-color:var(--green2);background:var(--greenbg)}
.next b{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);white-space:nowrap}.next.ok b{color:var(--green)}
/* читаемость расчёта */
.sum-per{font-size:44px}
.kv{color:var(--soft)}.kv .num,.kv b{color:var(--text)}
.kv.big{font-size:17px;color:var(--text)}.kv.big .num{font-family:Oswald,sans-serif;font-size:26px;font-weight:500}
.kv .num,.kv b{white-space:nowrap}
.kv .num.bad{color:#ff6b6b}.kv .num.ok{color:var(--green)}
.kv.dep{font-size:15px;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}.kv.dep b{font-family:Oswald,sans-serif;font-size:20px;font-weight:500}
.why{font-size:12px;color:var(--muted);line-height:1.4;margin-top:-2px}
/* сводка норм */
.normsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.normsum div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card2);display:flex;flex-direction:column;gap:2px}
.normsum b{font-size:15px}.normsum span{font-size:11.5px;color:var(--muted)}
.normsum .lo{border-color:#5a4a1c}.normsum .lo b{color:var(--amber)}.normsum .okk b{color:var(--green)}.normsum .hi b{color:var(--blue)}
/* подсказки */
.hint{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--soft);background:#16181d;border:1px solid #262a33;border-radius:10px;padding:8px 10px}
.hint .lnk{white-space:nowrap}
/* счётчик в таблице */
.pcb{background:none;border:0;border-bottom:1px dashed var(--line2);color:inherit;font:inherit;padding:0;cursor:pointer;text-align:right}.pcb:hover{border-bottom-color:var(--green);color:var(--green)}
.pcb.warn{color:var(--amber);border-bottom-color:#5a4a1c}
.qx{display:inline-flex;align-items:center;gap:4px}.qx .q{width:32px;height:32px;font-size:16px}.qx .inp.qty{width:52px}
/* сохранено / отменить */
.saved{font-size:12px;color:var(--muted)}.saved.dirty{color:var(--amber)}
/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wh{font-size:11px;color:var(--muted);text-transform:uppercase;text-align:center;padding:4px 0}
.cday{min-height:104px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left}
.cday.out{opacity:.35}.cday.we{background:#17151a}.cday.today{border:2px solid var(--green)}
.cday .n{font-size:12px;color:var(--soft);display:flex;justify-content:space-between}
.cev{font-size:11px;line-height:1.25;border-radius:6px;padding:3px 5px;border-left:3px solid var(--stc,var(--line2));background:#202026;text-align:left;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cev.s-new{--stc:var(--c-new)}.cev.s-work{--stc:var(--c-work)}.cev.s-confirmed{--stc:var(--c-confirmed)}.cev.s-cashier{--stc:var(--c-cashier)}.cev.s-paid{--stc:var(--c-paid)}.cev.s-done{--stc:var(--c-done)}
.cadd{font-size:11px;color:var(--muted);background:none;border:1px dashed var(--line2);border-radius:6px;padding:2px;margin-top:auto}

const FILES = {}; let idb = null;
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open("spl_banket_files", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function filesInit(){
  try { idb = await idbOpen(); await new Promise(res => { const rq = idb.transaction("f").objectStore("f").openCursor();
    rq.onsuccess = () => { const c = rq.result; if (c){ FILES[c.key] = URL.createObjectURL(c.value); c.continue(); } else res(); }; rq.onerror = () => res(); }); } catch(e){}
}
async function putFile(file){
  if (CLOUD) return cloudUpload(file);
  if (!idb) throw new Error("хранилище файлов недоступно");
  if (file.size > 200 * 1024 * 1024) throw new Error("файл больше 200 МБ");
  const id = "f_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await new Promise((res, rej) => { const tx = idb.transaction("f", "readwrite"); tx.objectStore("f").put(file, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  FILES[id] = URL.createObjectURL(file); return id;
}

async function sha(s){ try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("spl-banket:" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); } catch(e){ let h = 7; for (const ch of "spl:"+s) h = (h*31 + ch.charCodeAt(0)) | 0; return "x" + h; } }
const unlocked = () => CLOUD ? IS_MGR : Date.now() < UNLOCK;
function needPin(after){
  if (unlocked()){ UNLOCK = Date.now() + 15*60000; return true; }
  if (CLOUD){ toast("Только для управляющего"); return false; }
  const first = !D.settings.pinHash;
  $("modal").innerHTML = `<div class="modal"><div class="card"><div class="h" style="font-size:16px">${first ? "Задайте PIN управляющего" : "PIN управляющего"}</div>
    <div class="small muted">${first ? "PIN открывает отчёты и настройки. 4-8 цифр." : "Отчёты и настройки доступны только управляющему."}</div>
    <input class="inp" id="pin1" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
    ${first ? `<input class="inp" id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="Повторите PIN" autocomplete="off">` : ""}
    <div class="small bad" id="pinmsg"></div>
    <div class="row"><button class="btn" data-act="modal-close">Отмена</button><span class="sp"></span><button class="btn prim" id="pinok">Войти</button></div></div></div>`;
  $("pin1").focus();
  const go = async () => {
    const p1 = $("pin1").value.trim();
    if (!/^\d{4,8}$/.test(p1)){ $("pinmsg").textContent = "Нужно 4-8 цифр"; return; }
    if (first){ if (p1 !== $("pin2").value.trim()){ $("pinmsg").textContent = "PIN не совпадает"; return; } D.settings.pinHash = await sha(p1); save(); }
    else if (await sha(p1) !== D.settings.pinHash){ $("pinmsg").textContent = "Неверный PIN"; $("pin1").value = ""; return; }
    UNLOCK = Date.now() + 15*60000; $("modal").innerHTML = ""; after && after();
  };
  $("pinok").onclick = go; $("modal").querySelectorAll("input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
  return false;
}

/* ---- АКЦИИ ---- */
const PTYPE = { pay:"Доплата за подарок", guests:"Порог: гостей", sum:"Порог: сумма" };
function promoGift(p){ const it = p.giftRef ? item(p.giftRef) : null;
  const price = p.giftPrice !== "" && p.giftPrice != null && +p.giftPrice ? +p.giftPrice : (it ? it.price : 0);
  const cost = p.giftCost !== "" && p.giftCost != null ? +p.giftCost : (it ? it.cost : null);
  return { name: p.giftName || (it ? it.n : "Подарок"), price, cost, photo: p.photo || (it ? it.photo : "") }; }

  if (p.from && d && d < p.from) return false; if (p.to && d && d > p.to) return false;
  if (p.days === "wd" && d && isWeekend(d)) return false; if (p.days === "we" && d && !isWeekend(d)) return false; return true; }

    if (p.type === "pay") return { p, on: !!(b.promos||{})[p.id], left: 0 };

}
function promoUsed(id){ return D.banquets.filter(b => b.status !== "lost" && calc(b).gifts.some(x => x.p.id === id)).length; }

  const g = Math.max(1, +b.guests || 1), k = Math.max(1, Math.ceil(g / (+D.settings.packBase || 10)));
  const pk = b.packId ? pack(b.packId) : null;

  const packLines = [];
  if (pk){ packTotal = (+pk.price||0) * g;
    pk.items.forEach(x => { const it = item(x.ref); if (!it) return; const q = (+x.qty||0) * k; packLines.push({ it, q });
      if (it.cost == null) unknown++; else packCost += it.cost * q; }); }
  const extra = []; let extraTotal = 0, extraCost = 0;
  Object.entries(b.extra||{}).forEach(([ref, q]) => { const it = item(ref); if (!it || !(+q)) return; q = +q; extra.push({ it, q });
    extraTotal += it.price * q; if (it.cost == null) unknown++; else extraCost += it.cost * q; });
  let ooTotal = 0, ooCost = 0;
  (b.oneoff||[]).forEach(o => { const q = +o.qty || 0; ooTotal += (+o.price||0) * q; if (o.cost === "" || o.cost == null) unknown++; else ooCost += (+o.cost) * q; });
  const adds = []; let addTotal = 0, addCost = 0, addAsk = 0;
  Object.entries(b.add||{}).forEach(([id, q]) => { const a = addon(id); if (!a || !(+q)) return; q = +q; adds.push({ a, q });
    if (!(+a.price)) addAsk++; addTotal += (+a.price||0) * q; if (+a.price){ if (a.cost == null || a.cost === "") unknown++; else addCost += (+a.cost) * q; } });
  const base = packTotal + extraTotal + ooTotal + addTotal;

/* ---------------- ЗАНЯТОСТЬ ---------------- */
function removedSet(date, pid){ return new Set((((D.removed||{})[date])||{})[pid] || []); }
function occupied(date, exceptId){
  const m = {}; if (!date) return m;
  D.banquets.forEach(o => { if (o.id === exceptId || o.date !== date || o.status === "lost") return;
    const p = place(o.placeId); if (!p) return; const lab = "Банкет №" + o.no + (o.name ? " · " + o.name : "");
    const mark = (pid, ids) => ids.forEach(id => m[pid + "|" + id] = lab);
    if (p.kind === "hall") mark(p.id, o.tables || []);
    else if (p.kind === "cabin") m[p.id + "|*"] = lab;
    else (p.parts||[]).forEach(pid => { const pp = place(pid); if (!pp) return; if (pp.kind === "hall") mark(pid, pp.tables.map(t => t.id)); else m[pid + "|*"] = lab; });
  });

}
function placeBusy(pid, date, exceptId){
  const p = place(pid), occ = occupied(date, exceptId);
  if (!p) return "";
  if (p.kind === "cabin") return occ[pid + "|*"] || "";
  if (p.kind === "combo") { for (const x of p.parts||[]){ const pp = place(x); if (!pp) continue; if (pp.kind === "cabin" && occ[x+"|*"]) return occ[x+"|*"]; if (pp.kind === "hall" && pp.tables.some(t => occ[x+"|"+t.id])) return "занята часть площадки"; } return ""; }
  const free = p.tables.filter(t => !occ[pid+"|"+t.id] && !removedSet(date, pid).has(t.id));

}

/* шаги и «что дальше» */
function stepsOf(b, c){
  const p = place(b.placeId), [mn, mx] = seatRange(b), ph = String(b.phone||"").replace(/\D/g,"").length >= 9;
  const g = b.name.trim() && ph && b.date, gnote = !b.name.trim() ? "имя" : !ph ? "телефон" : !b.date ? "дата" : "";
  const pl = p && (p.kind !== "hall" || (b.tables||[]).length) && b.guests >= mn && b.guests <= mx;
  const pnote = !p ? "не выбрано" : p.kind === "hall" && !(b.tables||[]).length ? "столы" : !(b.guests >= mn && b.guests <= mx) ? "вместимость" : "";
  const mn_ = c.pk || c.extra.length || (b.oneoff||[]).length;
  const ex = c.adds.length || c.gifts.length;
  const done = ["confirmed","cashier","paid","done"].includes(b.status);
  return [{ id:"sec-guest", l:"Гость и дата", st: g ? "ok" : "need", note: gnote }, { id:"sec-place", l:"Место и столы", st: pl ? "ok" : "need", note: pnote },
    { id:"sec-menu", l:"Меню", st: mn_ ? "ok" : "need", note: mn_ ? "" : "не собрано" }, { id:"sec-extra", l:"Услуги и акции", st: ex ? "ok" : "opt", note: ex ? "" : "по желанию" },
    { id:"sec-calc", l:"Расчёт", st: done ? "ok" : "need", note: done ? STATUS[b.status].toLowerCase() : "не подтверждён" }];
}
function nextStep(b, c){
  const p = place(b.placeId), [mn, mx] = seatRange(b);
  const T = (text, go, ok) => ({ text, go, ok });
  if (b.status === "lost") return T("Отказ. Можно сменить статус, если гость вернулся", "sec-calc");
  if (!b.name.trim()) return T("Укажите имя гостя", "sec-guest");
  if (String(b.phone||"").replace(/\D/g,"").length < 9) return T("Укажите телефон гостя", "sec-guest");
  if (!b.date) return T("Выберите дату", "sec-guest");
  if (!p) return T("Выберите место", "sec-place");
  if (p.kind === "hall" && !(b.tables||[]).length) return T("Выберите столы на схеме или «Весь зал»", "sec-place");
  if (b.guests < mn || b.guests > mx) return T("Гостей " + b.guests + ", а место рассчитано на " + mn + "-" + mx, "sec-place");
  if (!(c.pk || c.extra.length || (b.oneoff||[]).length)) return T("Соберите меню: выберите пакет или добавьте позиции", "sec-menu");
  if (b.status === "new" || b.status === "work") return T("Проверьте расчёт и нажмите «Подтвердить и выставить депозит»", "sec-calc");
  if (b.status === "confirmed"){
    if (!b.sentAt) return T("Отправьте PDF гостю", "sec-calc");
    const left = b.prepayUntil ? new Date(b.prepayUntil).getTime() - Date.now() : 0;
    if (left <= 0) return T("Срок депозита вышел - позвоните гостю", "sec-calc");
    const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000);
    return T("Ждём депозит - осталось " + (h ? h + " ч " : "") + m + " мин", "sec-calc");
  }
  if (b.status === "cashier") return T("Ждём подтверждения кассира", "sec-calc");
  if (b.status === "paid") return T("Депозит внесён - банкет подтверждён", "sec-calc", true);
  return T("Банкет прошёл", "sec-calc", true);
}
/* сводка по нормам: хватает ли еды и алкоголя */
const SNACK_G = ["Холодные закуски","Салаты","Горячие закуски","Роллы"], HOT_G = ["Горячие блюда","Стейки на углях","Колбаски"], STRONG_G = ["Водка","Виски","Коньяк и бренди","Текила","Джин","Ром"];
function normSummary(b, c){
  const lines = c.packLines.concat(c.extra); if (!lines.length) return "";
  const N = D.settings.norms, g = c.g, plates = Math.ceil(g / (N.plateFor||6));
  let snack = 0, hot = 0, strong = 0;
  lines.forEach(({ it, q }) => { const m = it.menu ? ITEMS[it.ref.slice(2)] : null, grp = m ? m.grp : "";
    if (m ? SNACK_G.includes(grp) : it.cat === "sal") snack += q; else if (m ? HOT_G.includes(grp) : it.cat === "hot") hot += q;
    if (m && STRONG_G.includes(grp) && it.unit === "л") strong += q; });
  const needSnack = plates * ((+N.sal||0) + (+N.cold||0) + (+N.hotSnack||0)), needHot = g, needStrong = Math.round(g * (+N.strong||0) * 10) / 10;
  const cell = (label, have, need, unit) => { const r = need ? have / need : 1, cls = r < .8 ? "lo" : r > 1.6 ? "hi" : "okk";
    return `<div class="${cls}"><span>${label}</span><b>${fmt1(have)} ${unit} <span class="xs muted" style="font-weight:400">из ~${fmt1(need)}</span></b><span>${r < .8 ? "мало для " + g + " гостей" : r > 1.6 ? "с запасом" : "по норме"}</span></div>`; };
  return `<div class="normsum">${cell("Салаты и закуски, порций", snack, needSnack, "")}${cell("Горячее, порций", hot, needHot, "")}${cell("Крепкий алкоголь", strong, needStrong, "л")}</div>`;
}
const fmt1 = n => (Math.round(n * 10) / 10).toString().replace(".", ",");

      <td class="r num">${sc ? pcBtn(it.ref, fmt(it.price)) : fmt(it.price)}</td><td class="r num">${fmt(it.price*q)}</td>${costCell(it.cost == null ? null : it.cost*q, it.price*q, it.ref)}<td class="r"><button class="btn sm ghost dang" data-act="rmx" data-ref="${esc(it.ref)}" aria-label="Убрать">Убрать</button></td></tr>`));
    (b.oneoff||[]).forEach(o => { const q = +o.qty||0, sum = (+o.price||0)*q; const cost = o.cost === "" || o.cost == null ? null : (+o.cost)*q;
      rows.push(`<tr><td><input class="inp" data-s="oo:${o.id}" data-k="n" value="${esc(o.n)}" placeholder="Название"></td>

      <td class="r"><input class="inp money" type="number" min="0" data-s="oo:${o.id}" data-k="price" value="${o.price||0}"></td><td class="r num">${fmt(sum)}</td>

  }

function addDrop(){

function scopeObj(s){
  const i = s.indexOf(":"), a = i < 0 ? s : s.slice(0, i), r = i < 0 ? "" : s.slice(i + 1);
  switch (a){
    case "b": return cur(); case "s": return D.settings; case "norms": return D.settings.norms; case "cost": return D.costs;
    case "pl": return place(r); case "pk": return pack(r); case "ad": return addon(r); case "ci": return D.citems.find(x => x.id === r);
    case "bt": return (D.btpls||[]).find(x => x.id === r);
    case "gift": return D.settings.gifts[+r]; case "pr": return (D.promos||[]).find(x => x.id === r); case "occ": return D.settings.occasions[+r];
    case "oo": return (cur().oneoff||[]).find(x => x.id === r);
    case "tm": return (cur().timing||[])[+r];
    case "ntf": D.settings.notify = D.settings.notify || {}; return D.settings.notify;
    case "t": { const [pid, tid] = r.split("|"); return place(pid).tables.find(x => x.id === tid); }
    case "z": { const [pid, zi] = r.split("|"); return place(pid).zones[+zi]; }
    case "pki": { const [pid, ii] = r.split("|"); return pack(pid).items[+ii]; }
    case "mph": D.mphotos = D.mphotos || {}; return { set photo(v){ D.mphotos[r] = v; }, get photo(){ return D.mphotos[r]; } };
  }
}
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.up){ const f = el.files && el.files[0]; if (!f) return;
    try { const id = await putFile(f); const o = scopeObj(el.dataset.up); o[el.dataset.k] = id; save(); toast("Файл загружен"); render(); } catch(err){ toast("Не загрузилось: " + err.message); } return; }
  if (el.id === "csvcost") return importCsv(el.files[0]);
  if (el.id === "importf") return importJson(el.files[0]);
  if (el.id === "schdate"){ UI.sch.date = el.value; return render(); }
  const s = el.dataset.s; if (!s) return;
  const k = el.dataset.k, ty = el.dataset.ty;
  if (s === "bx"){ const b = cur(); const q = Math.max(0, Math.round(+el.value || 0)); if (q) b.extra[k] = q; else delete b.extra[k]; hist(b, "Изменено количество"); save(); return render(); }
  if (s === "cost"){ const v = el.value.trim(); if (v === "") delete D.costs[k]; else D.costs[k] = Math.max(0, +v || 0); save(); return render(); }
  const o = scopeObj(s); if (!o) return;
  let v = el.value;
  if (ty === "n") v = Math.max(0, +v || 0); else if (ty === "nn") v = v.trim() === "" ? null : Math.max(0, +v || 0); else if (ty === "b") v = el.checked; else if (ty === "list") v = v.split(",").map(x => x.trim()).filter(Boolean); else if (ty === "nlist") v = [...new Set(v.split(",").map(x => Math.round(+x.replace(/[^0-9.]/g,""))).filter(x => x > 0 && x < 100))].sort((a,b) => a - b);
  else if (s.startsWith("oo:") && (k === "qty" || k === "price")) v = Math.max(0, +v || 0); else if (s.startsWith("oo:") && k === "cost") v = v.trim() === "" ? null : Math.max(0, +v || 0);
  else if (typeof v === "string") v = v.slice(0, 2000);
  if (s === "b" && k === "status") return setStatus(cur(), v);
  o[k] = v;
  if (s.startsWith("t:") && (k === "w" || k === "h")) o[k] = Math.max(40, Math.round(v / GRID) * GRID);
  if (s.startsWith("tm:") && k === "t") cur().timing.sort((a,b) => tmKey(a.t, cur().time) - tmKey(b.t, cur().time));
  if (s === "b" || s.startsWith("oo:")){ cur().updated = new Date().toISOString(); if (k === "date"){ cur().tables = []; cur().layout = null; hist(cur(), "Дата: " + dLab(v)); } }
  save(); render();
});

function setStatus(b, s){
  if (s === b.status) return;
  if (s === "paid" || s === "cashier"){ toast(s === "paid" ? "Депозит отмечает кассир" : "Нажмите «Гость оплатил - передать в кассу»"); render(); return; }
  if (b.status === "cashier" && s !== "lost"){ toast("Банкет ждёт кассу - сначала «Вернуть в ожидание»"); render(); return; }
  if (b.status === "paid" && b.dep && b.dep.amount && (s === "confirmed" || s === "new" || s === "work")){ if (!confirm("Депозит уже принят кассой. Всё равно сменить статус?")) { render(); return; } }
  if (s === "confirmed"){ if (!validate(b)) return; stampDeadline(b); }
  if (s === "lost"){ render(); ACT.lose(); return; }
  if (s === "done" && b.status === "paid"){ render(); closeModal(); return; }
  hist(b, "Статус: " + STATUS[s]); b.status = s; save(); render();
}

}

/* ---------------- ИМПОРТ ---------------- */
async function importCsv(f){
  if (!f) return; const txt = await f.text(); const lines = txt.split(/\r?\n/).filter(Boolean);
  const norm = s => s.toLowerCase().replace(/ё/g,"е").replace(/["«»']/g,"").replace(/\s+/g," ").trim();
  const byN = {}; Object.values(ITEMS).forEach(m => byN[norm(m.n)] = m.id);
  const cByN = {}; D.citems.forEach(c => cByN[norm(c.n)] = c);
  let ok = 0, miss = [];
  lines.forEach(l => { const parts = l.split(/[;\t]|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x => x.replace(/^"|"$/g, "").trim()); if (parts.length < 2) return;
    const name = norm(parts[0]); const num = parts.slice(1).map(x => +x.replace(/\s/g,"").replace(",", ".")).find(x => Number.isFinite(x) && x > 0); if (!num) return;
    if (byN[name]){ D.costs[byN[name]] = Math.round(num); ok++; } else if (cByN[name]){ cByN[name].cost = Math.round(num); ok++; } else miss.push(parts[0]); });
  save(); render(); toast("Себестоимость: заполнено " + ok + (miss.length ? ", не найдено в меню " + miss.length : ""));
  if (miss.length) console.log("Не найдено:", miss);
}
async function importJson(f){
  if (!f) return; try { const x = JSON.parse(await f.text()); if (!x || x.v !== 1 || !Array.isArray(x.places)) throw new Error("не тот файл");
    if (!confirm("Заменить все данные этого браузера данными из файла?")) return; const pin = D.settings.pinHash; D = x; if (!D.settings.pinHash) D.settings.pinHash = pin; save(); render(); toast("Данные загружены"); }
  catch(e){ toast("Не загрузилось: " + e.message); }
}

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  try { const s = await cloudApi("pc_settings?select=data&id=eq.1"); if (s && s[0]) CL_SET = Object.assign(CL_SET, s[0].data || {}); } catch(e){}
  ["pointerdown","keydown","mousemove","wheel","touchstart"].forEach(e => document.addEventListener(e, cloudIdle, { capture:true, passive:true }));
  cloudIdle();
  try { await cloudPull(true); } catch(e){ $("main").innerHTML = `<div class="card bad" style="margin-top:20px">Не удалось загрузить банкеты: ${esc(e.message)}</div>`; return; }
  CL_READY = true; render();
  setInterval(() => { if (!CL_BUSY) cloudRefresh(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cloudRefresh(); });
}
/* кнопки, которые в базе работают иначе */
if (CLOUD){
  ACT.handover = async () => { const b = cur(); if (!b || b.status !== "confirmed") return;
    if (!b.dbid){ toast("Банкет ещё сохраняется - повторите через секунду"); return; }
    await cloudPush();
    try { const r = await cloudRpc("bq_deposit_handover", { p_id:b.dbid, p_by:(ME && ME.name) || "хост" }); if (r && r.ok === false){ toast(r.error); return; } }
    catch(e){ toast("Не передано: " + e.message); return; }
    await cloudPull(false); render(); toast("Передано в кассу - ждём подтверждения кассира"); };
  ACT.unhand = async () => { const b = cur(); if (!b || b.status !== "cashier") return; if (!confirm("Вернуть банкет в «Ждём депозит»? Срок оплаты продолжится.")) return;
    try { const r = await cloudRpc("bq_deposit_unhand", { p_id:b.dbid }); if (r && r.ok === false){ toast(r.error); return; } } catch(e){ toast(e.message); return; }
    await cloudPull(false); render(); };
  ACT.kassademo = () => toast("Депозит подтверждает касса в своей программе");
  ACT.reset = () => toast("В рабочей версии сброс отключён");
  ACT.backbr = () => { location.href = "index.html#tablet&pc"; };
}

/* ---------------- ЗАПУСК ---------------- */
setInterval(() => { if (UNLOCK && !unlocked()){ UNLOCK = 0; if (["reports","settings"].includes(UI.tab)) UI.tab = "list"; render(); toast("Доступ управляющего закрыт по времени"); } }, 30000);
if (!CLOUD){
  window.addEventListener("storage", e => { if (e.key === KEY){ D = load(); render(); } });   // заявка гостя из соседней вкладки
  filesInit().then(render);
  render();
} else cloudStart();
</script>
</body>
