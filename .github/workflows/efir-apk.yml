name: EFIR APK

on:
  push:
    branches: [ efir-tv ]

permissions:
  contents: write

concurrency:
  group: efir-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Check APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk efir.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "## APK"
            echo '```'
            "$BT/aapt2" dump badging efir.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity|leanback-launchable-activity|uses-permission|uses-feature)" || true
            echo "size: $(stat -c %s efir.apk) bytes"
            "$BT/apksigner" verify --print-certs efir.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            echo '```'
            echo "## Tests"
            echo '```'
            grep -h -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testReleaseUnitTest/*.xml || true
            echo '```'
          } > apk-info.md
          cat apk-info.md
          cat apk-info.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          {
            echo "Версия $VERSION. Скачать: efir.apk ниже, установить на телевизор поверх прежней версии."
            echo
            echo "<details><summary>Проверка сборки</summary>"
            echo
            cat apk-info.md
            echo
            echo "</details>"
          } > notes.md
          gh release delete efir-tv --yes --cleanup-tag || true
          gh release create efir-tv efir.apk \
            --target "$GITHUB_SHA" \
            --title "ЭФИР для Android TV $VERSION" \
            --notes-file notes.md \
            --latest=false
