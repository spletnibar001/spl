
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPLETNI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2025; --line:#2a2f37;
  --text:#eef1f4; --muted:#9aa3ad; --emerald:#1fbf7a; --gold:#c9a14a;
  --hot:#e2655c; --new:#4a9be2; --veg:#5cbf7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ВЕРХНЯЯ ПАНЕЛЬ */
#topbar{position:sticky;top:0;z-index:50;background:rgba(13,15,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
#topbar .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#topbar .brand svg{width:22px;height:22px;flex-shrink:0}
#topbar .brand b{font-size:16px;font-weight:800;letter-spacing:.14em}
.lang-tabs{display:flex;gap:3px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-tabs button{border:none;background:transparent;color:var(--muted);padding:5px 9px;font-size:12px;font-weight:700}
.lang-tabs button.active{background:var(--emerald);color:#08130d}

/* КОНТЕНТ */
#app{max-width:560px;margin:0 auto;padding:0 0 84px}
.section{display:none;padding:14px}
.section.active{display:block}

/* ГЛАВНАЯ */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.hero img{width:100%;height:200px;object-fit:cover;opacity:.85}
.hero .hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,18,.1),rgba(13,15,18,.9))}
.hero .hero-mark{position:absolute;left:0;right:0;bottom:14px;text-align:center}
.hero .hero-mark svg{width:42px;height:42px;margin-bottom:2px}
.hero .hero-mark .name{font-size:26px;font-weight:800;letter-spacing:.2em}
.hero .hero-mark .tag{font-size:11px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}

.venue-prompt{text-align:center;font-size:15px;font-weight:700;color:var(--gold);margin:4px 0 12px;letter-spacing:.02em}
.venue-switch{display:flex;gap:8px;margin-bottom:18px}
.venue-switch button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:14px;padding:16px 8px;font-size:14px;font-weight:800;letter-spacing:.01em;position:relative;line-height:1.25}
.venue-switch button.active{border-color:var(--emerald);background:var(--panel2)}
.venue-switch button .vs-sub{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:left;
  color:var(--text);display:flex;flex-direction:column;gap:6px;min-height:92px;justify-content:center}
.tile:active{background:var(--panel2)}
.tile .t-ic{width:24px;height:24px;color:var(--emerald)}
.tile .t-name{font-size:15px;font-weight:700}
.tile .t-sub{font-size:11px;color:var(--muted)}
.tiles.tiles-3{grid-template-columns:1fr 1fr 1fr}
.tiles.tiles-3 .tile{padding:14px 10px;text-align:center}
.tiles.tiles-3 .tile .t-ic{margin:0 auto}
.tiles.tiles-3 .tile .t-name{font-size:13px;margin-top:6px}
.tiles.tiles-3 .tile .t-sub{font-size:10px}
.dc-intro{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:16px}
.dc-list{display:flex;flex-direction:column;gap:10px}
.dc-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);
  background:var(--panel);border-radius:12px;font-size:13px;line-height:1.4}
.dc-row .dc-ic{flex-shrink:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;border:1px solid}
.dc-row.dc-ok .dc-ic{color:var(--emerald);border-color:var(--emerald);background:rgba(31,191,122,.12)}
.dc-row.dc-no .dc-ic{color:var(--hot);border-color:var(--hot);background:rgba(226,101,92,.12)}
.about-card{margin-top:16px;padding:15px 16px;border:1px solid var(--line);background:var(--panel);
  border-radius:14px;font-size:13px;line-height:1.6;color:var(--text)}
.reviews-btn{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;
  border:1px solid var(--gold);background:linear-gradient(135deg,rgba(201,161,74,.16),rgba(201,161,74,.06));
  border-radius:14px;text-decoration:none;color:var(--text)}
.reviews-btn:active{background:rgba(201,161,74,.22)}
.reviews-btn .rv-star{width:24px;height:24px;color:var(--gold);flex-shrink:0;display:flex}
.reviews-btn .rv-star svg{width:24px;height:24px}
.reviews-btn .rv-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.reviews-btn .rv-main{font-size:15px;font-weight:700}
.reviews-btn .rv-sub{font-size:12px;color:var(--gold);font-weight:600}
.reviews-btn .rv-arr{color:var(--gold);font-size:18px;font-weight:700}
.hc-card{margin-top:12px;padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.hc-card .hc-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:12px}
.hc-addr{display:flex;align-items:flex-start;gap:10px;text-decoration:none;color:var(--text);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hc-addr .hc-ic{width:20px;height:20px;color:var(--emerald);flex-shrink:0;margin-top:2px}
.hc-addr .hc-ic svg{width:20px;height:20px}
.hc-addr .hc-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.hc-addr .hc-val{display:block;font-size:13px;line-height:1.4}
.hc-sites{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hc-sites .hc-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
.hc-site-row{display:flex;flex-direction:column;gap:8px}
.hc-site{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
.hc-site svg{width:17px;height:17px;color:var(--emerald);flex-shrink:0}
.hc-venue{margin-bottom:12px}
.hc-venue .hc-vname{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.hc-actions{display:flex;gap:8px}
.hc-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;font-family:inherit}
.hc-btn svg{width:18px;height:18px}
.hc-btn.call{background:var(--panel2);border:1px solid var(--line);color:var(--text);flex:1}
.hc-btn.tg{background:rgba(42,140,224,.16);border:1px solid #2a8ce0;color:#5bb0f0;flex-shrink:0;padding:10px 16px}
.hc-btn.tg svg{width:20px;height:20px}

/* ЗАГОЛОВОК РАЗДЕЛА */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head .back{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  width:36px;height:36px;font-size:16px;flex-shrink:0}
.sec-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}

/* МЕНЮ */
.menu-tabs{display:flex;gap:6px;margin-bottom:14px}
.menu-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:9px;font-size:13px;font-weight:700}
.menu-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.cat{margin-bottom:18px}
.cat-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.cat-title .cat-bar{width:4px;height:15px;border-radius:3px;flex-shrink:0}
.mi{display:flex;justify-content:space-between;gap:12px;padding:7px 0;align-items:baseline}
.mi .mi-n{font-size:14px}
.mi .mi-badges{display:inline-flex;gap:4px;margin-left:2px;vertical-align:middle}
.mi .bdg{font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;white-space:nowrap;letter-spacing:.02em}
.bdg.chef{color:var(--gold);border:1px solid var(--gold)}
.bdg.hot{color:var(--hot);border:1px solid var(--hot)}
.bdg.new{color:var(--new);border:1px solid var(--new)}
.bdg.veg{color:var(--veg);border:1px solid var(--veg)}
.mi .mi-p{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.mi .mi-p.dash{color:var(--line)}
.menu-note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.menu-service{text-align:center;margin:0 0 16px;padding:10px 14px;border-radius:10px;
  background:rgba(31,191,122,.14);border:1px solid var(--emerald);color:var(--emerald);
  font-size:16px;font-weight:800;letter-spacing:.02em}
.menu-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-size:11px;color:var(--muted)}
.menu-legend .lg{display:inline-flex;align-items:center;gap:4px}

/* КАК ДОБРАТЬСЯ / КОНТАКТЫ */
.info-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:12px}
.info-card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.info-card p{margin:0 0 4px;color:var(--muted);font-size:14px}
.btn-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);border-radius:11px;padding:13px;font-size:14px;font-weight:700;
  text-decoration:none}
.btn.primary{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.btn svg{width:18px;height:18px}
.hours-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.hours-row:first-of-type{border-top:none}
.hours-row .h-d{color:var(--muted)}

/* ЗАГЛУШКА */
.stub{text-align:center;color:var(--muted);padding:50px 20px}
.stub svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* ВИТРИНА ЗАЛОВ */
.zone-venue-tabs{display:flex;gap:8px;margin-bottom:16px}
.zone-venue-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.zone-venue-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.zone-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;margin-bottom:16px}
.zone-gallery{position:relative;width:100%;aspect-ratio:3/2;background:var(--panel2);overflow:hidden}
.zone-gallery .zg-track{display:flex;height:100%;transition:transform .3s ease;will-change:transform}
.zone-gallery .zg-slide{min-width:100%;height:100%;position:relative}
.zone-gallery .zg-slide img{width:100%;height:100%;object-fit:cover}
.zone-gallery .zg-nophoto{display:flex;align-items:center;justify-content:center;flex-direction:column;
  height:100%;color:var(--muted);gap:8px}
.zone-gallery .zg-nophoto svg{width:42px;height:42px;opacity:.35}
.zone-gallery .zg-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border:none;border-radius:50%;background:rgba(13,15,18,.6);color:#fff;font-size:18px;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:2}
.zone-gallery .zg-prev{left:8px}.zone-gallery .zg-next{right:8px}
.zone-gallery .zg-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.zone-gallery .zg-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.zone-gallery .zg-dot.on{background:#fff}
.zone-gallery .zg-count{position:absolute;top:8px;right:10px;background:rgba(13,15,18,.6);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px);z-index:2}
.zone-body{padding:14px}
.zone-body h3{margin:0 0 4px;font-size:18px;font-weight:800}
.zone-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.zone-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.zone-tag b{color:var(--text);font-weight:700}
.zone-tag .zt-ic{width:13px;height:13px}
.zone-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.zone-book-btn{width:100%;border:1px solid var(--emerald);background:var(--emerald);color:#08130d;
  border-radius:11px;padding:13px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
.zone-book-btn svg{width:17px;height:17px}
.zone-note{font-size:11px;color:var(--gold);margin-top:-4px;margin-bottom:10px;font-weight:600}

/* НИЖНЯЯ НАВИГАЦИЯ */
#navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(13,15,18,.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto}
#navbar button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
#navbar button.active{color:var(--emerald)}
#navbar button svg{width:21px;height:21px}

/* БРОНИРОВАНИЕ */
.bk-loading{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.bk-note{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.bk-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 8px}
.bk-seg{display:flex;gap:8px}
.bk-seg button{flex:1;padding:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:10px;font-size:14px;font-weight:700;font-family:inherit}
.bk-seg button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-dates{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.bk-dates button{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap}
.bk-dates button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-zones{display:flex;flex-wrap:wrap;gap:8px}
.bk-zones button{padding:9px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:9px;font-size:13px;font-weight:600;font-family:inherit}
.bk-zones button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-input{width:100%;padding:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:10px;font-size:15px;font-family:inherit}
textarea.bk-input{resize:vertical;min-height:48px}
.bk-msg{color:var(--hot);font-size:13px;min-height:18px;margin-top:10px}
.bk-submit{width:100%;margin-top:8px;padding:14px;border:none;background:var(--emerald);color:#08130d;
  border-radius:12px;font-size:15px;font-weight:800;font-family:inherit}
.bk-submit:disabled{opacity:.6}
.bk-done{text-align:center;padding:24px 10px}
.bk-done-ic{width:64px;height:64px;border-radius:50%;background:rgba(31,191,122,.16);color:var(--emerald);
  font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.bk-done-t{font-size:19px;font-weight:800;margin-bottom:8px}
.bk-done-sub{font-size:14px;color:var(--muted);line-height:1.5}
.bk-mine{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.bk-mine-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:8px}
.bk-mine-row{font-size:14px;line-height:1.5}
.bk-mine-status{font-size:15px;font-weight:800;margin-top:10px}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <!-- замочная скважина -->
    <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
      <circle cx="50" cy="38" r="20"/>
      <path d="M42 50 L58 50 L64 82 L36 82 Z"/>
    </svg>
    <b>SPLETNI</b>
  </div>
  <div class="lang-tabs" id="lang-tabs">
    <button data-l="ru" class="active">RU</button>
    <button data-l="uz">UZ</button>
    <button data-l="en">EN</button>
  </div>
</div>

<div id="app">
  <!-- ГЛАВНАЯ -->
  <div class="section active" id="sec-home"></div>
  <!-- ЗАЛЫ -->
  <div class="section" id="sec-zones"></div>
  <!-- МЕНЮ -->
  <div class="section" id="sec-menu"></div>
  <!-- БРОНИРОВАНИЕ -->
  <div class="section" id="sec-book"></div>
  <div class="section" id="sec-dress"></div>
  <!-- КАК ДОБРАТЬСЯ -->
  <div class="section" id="sec-location"></div>
  <!-- КОНТАКТЫ -->
  <div class="section" id="sec-contacts"></div>
</div>

<div id="navbar"></div>

<script>
// ============================================================
// SPLETNI — БАРНОЕ МЕНЮ (для гостевого приложения)
// Трёхъязычная структура: ru / uz (латиница) / en.
// Переводятся только КАТЕГОРИИ и ОПИСАТЕЛЬНЫЕ позиции.
// Бренды, коктейли, шутеры — в оригинале (одинаково на всех языках).
// Цены в сумах. Формат позиции:
//   { n:{ru,uz,en}, p:"цена" }   — если название переводится
//   { n:"Hennessy V.S.", p:"120 000" } — если бренд (строкой, без перевода)
// ============================================================

const BAR_MENU = [
  {
    cat: { ru: "Водка 40мл", uz: "Aroq 40ml", en: "Vodka 40ml" },
    items: [
      { n: "Stolichnaya", p: "50 000" },
      { n: "Русский Стандарт Original", p: "50 000" },
      { n: "Romanov", p: "50 000" },
      { n: "Бульбашъ", p: "50 000" },
      { n: "Finlandia Vodka", p: "50 000" },
      { n: "Absolut", p: "55 000" },
      { n: "Beluga Noble", p: "85 000" },
      { n: "Grey Goose", p: "95 000" },
      { n: "Reyka", p: "80 000" },
      { n: "Чистые Росы Organic", p: "70 000" },
      { n: "Онегин", p: "80 000" },
    ],
  },
  {
    cat: { ru: "Виски 40мл", uz: "Viski 40ml", en: "Whisky 40ml" },
    items: [
      { n: "Glenmorangie 12 Y.O.", p: "130 000" },
      { n: "Glenfiddich 12 Y.O.", p: "170 000" },
      { n: "Glenfiddich 15 Y.O.", p: "200 000" },
      { n: "Singleton 12 Y.O.", p: "120 000" },
      { n: "The Glenlivet 12 Y.O.", p: "145 000" },
      { n: "Bruichladdich Classic Laddie", p: "200 000" },
      { n: "The Macallan 12 Y.O.", p: "215 000" },
      { n: "Monkey Shoulder", p: "115 000" },
      { n: "Ballantine's", p: "75 000" },
      { n: "Dewar's White Label", p: "90 000" },
      { n: "Chivas Regal 12 Y.O.", p: "100 000" },
      { n: "Chivas Regal 18 Y.O.", p: "215 000" },
      { n: "Royal Salute 21 Y.O.", p: "385 000" },
      { n: "Tullamore D.E.W.", p: "85 000" },
      { n: "Jameson", p: "85 000" },
      { n: "Jameson Black Barrel", p: "125 000" },

// авторизация гостя через Edge Function guest-auth (проверка подписи Telegram)
async function guestAuth(){
  if(GUEST) return true;
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg && tg.initData;
  if(!initData){ return false; }   // открыто не из Telegram
  try{
    const r = await fetch(GUEST_AUTH_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+SB_ANON, "apikey":SB_ANON },
      body: JSON.stringify({ initData })
    });
    const d = await r.json();
    if(!r.ok || !d.token){ return false; }
    GUEST = { tg_id: d.tg_id, name: d.name };
    SB = window.supabase.createClient(SB_URL, SB_ANON, {
      global:{ headers:{ Authorization: "Bearer "+d.token } },
      auth:{ persistSession:false }
    });
    return true;
  }catch(e){ return false; }
}

  }).join("");

// ============ БРОНИРОВАНИЕ (заявка) ============
// форматирование даты YYYY-MM-DD
function bkfIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// список ближайших дат для выбора (сегодня + 13 дней)
function bkfDates(){
  const out=[]; const now=new Date();
  for(let i=0;i<14;i++){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i); out.push(d); }
  return out;
}
function bkfDateLabel(d, idx){
  if(idx===0) return t('bk_today');
  if(idx===1) return t('bk_tomorrow');
  const wd=({ru:["вс","пн","вт","ср","чт","пт","сб"],uz:["yak","dush","sesh","chor","pay","jum","shan"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]})[LANG][d.getDay()];
  return wd+" "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
}

// загрузка справочников (заведения + зоны + столы) из базы
async function bkfLoadRef(){
  if(BK_REF) return BK_REF;
  const [v,z,tb] = await Promise.all([
    SB.from("venues").select("*").order("id"),
    SB.from("zones").select("*").order("sort"),
    SB.from("tables").select("*").order("id"),
  ]);
  BK_REF = { venues:v.data||[], zones:z.data||[], tables:tb.data||[] };
  return BK_REF;
}

// зоны выбранного заведения
function bkfZonesFor(venueKey){
  if(!BK_REF) return [];
  const venue = BK_REF.venues.find(x=>x.key===venueKey);
  if(!venue) return [];
  return BK_REF.zones.filter(z=>z.venue_id===venue.id);
}

async function renderBook(force){
  const el = document.getElementById("sec-book");
  // лёгкая отрисовка оболочки; тяжёлая загрузка — только когда гость реально открыл раздел
  el.innerHTML = `<div class="sec-head"><button class="back" data-go="home">←</button><h2>${t('book_t')}</h2></div>
    <div class="info-card" id="bk-body"><div class="bk-loading">${t('bk_auth_wait')}</div></div>`;
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(!force) return;   // только оболочка (при общем renderAll)

  // авторизация гостя (один раз)
  const ok = await guestAuth();
  const body = document.getElementById("bk-body");
  if(!body) return;
  if(!ok){
    body.innerHTML = `<div class="bk-loading">${t('bk_auth_err')}</div>`;
    return;
  }
  await bkfLoadRef();

  // есть ли уже активная заявка от этого гостя?
  let active=null;
  try{
    const {data} = await SB.from("bookings").select("id,status,business_date,note,guest_name")
      .eq("created_by", Number(GUEST.tg_id))
      .in("status",["request","booked"])
      .order("id",{ascending:false}).limit(1);
    if(data && data.length) active = data[0];
  }catch(_){}

  if(active){
    const stTxt = active.status==="booked" ? t('bk_st_booked') : t('bk_st_request');
    const stCol = active.status==="booked" ? "var(--emerald)" : "var(--gold)";
    body.innerHTML = `
      <div class="bk-mine">
        <div class="bk-mine-h">${t('bk_my_req')}</div>
        <div class="bk-mine-row"><span>${active.note||""}</span></div>
        <div class="bk-mine-row" style="color:var(--muted)">${active.business_date||""}</div>
        <div class="bk-mine-status" style="color:${stCol}">${stTxt}</div>
      </div>
      <div class="bk-note">${t('bk_have_active')}</div>`;
    return;
  }

  // форма заявки
  if(!BK_STATE.date) BK_STATE.date = bkfIso(new Date());
  bkfDrawForm();
}

function bkfDrawForm(){
  const body = document.getElementById("bk-body");
  if(!body) return;
  const dates = bkfDates();
  const zones = bkfZonesFor(BK_STATE.venue);
  // если выбранная зона не из текущего заведения — сбросить
  if(BK_STATE.zoneId && !zones.find(z=>z.id===BK_STATE.zoneId)) BK_STATE.zoneId=null;

  const venueBtns = `
    <div class="bk-seg">
      <button data-bv="karaoke" class="${BK_STATE.venue==='karaoke'?'on':''}">${t('karaoke')}</button>
      <button data-bv="club" class="${BK_STATE.venue==='club'?'on':''}">${t('club')}</button>
    </div>`;

  const dateBtns = `<div class="bk-dates">` + dates.map((d,i)=>{
    const iso=bkfIso(d);
    return `<button data-bd="${iso}" class="${BK_STATE.date===iso?'on':''}">${bkfDateLabel(d,i)}</button>`;
  }).join("") + `</div>`;

  const zoneBtns = `<div class="bk-zones">` + zones.map(z=>
    `<button data-bz="${z.id}" class="${BK_STATE.zoneId===z.id?'on':''}">${z.title}</button>`
  ).join("") + `</div>`;

  const guestOpts = [1,2,3,4,5,6,8,10,12,15,20].map(n=>
    `<option value="${n}" ${BK_STATE.guests==n?'selected':''}>${n}${n>=20?'+':''}</option>`).join("");

  body.innerHTML = `
    <div class="bk-note">${t('bk_intro')}</div>

    <label class="bk-lbl">${t('bk_venue')}</label>
    ${venueBtns}

    <label class="bk-lbl">${t('bk_date')}</label>
    ${dateBtns}

    <label class="bk-lbl">${t('bk_zone')}</label>
    ${zoneBtns}

    <label class="bk-lbl">${t('bk_guests')}</label>
    <select id="bk-guests" class="bk-input"><option value="">—</option>${guestOpts}</select>

    <label class="bk-lbl">${t('bk_phone')}</label>
    <input id="bk-phone" class="bk-input" type="tel" inputmode="tel" placeholder="+998 __ ___ __ __" value="${BK_STATE.phone||''}">

    <label class="bk-lbl">${t('bk_comment')}</label>
    <textarea id="bk-comment" class="bk-input" rows="2" placeholder="${t('bk_comment_ph')}">${BK_STATE.comment||''}</textarea>

    <div class="bk-msg" id="bk-msg"></div>
    <button class="bk-submit" id="bk-submit">${t('bk_submit')}</button>`;

  body.querySelectorAll("[data-bv]").forEach(b=>b.onclick=()=>{ BK_STATE.venue=b.dataset.bv; bkfSaveInputs(); bkfDrawForm(); });
  body.querySelectorAll("[data-bd]").forEach(b=>b.onclick=()=>{ BK_STATE.date=b.dataset.bd; bkfSaveInputs(); bkfDrawForm(); });
  body.querySelectorAll("[data-bz]").forEach(b=>b.onclick=()=>{ BK_STATE.zoneId=Number(b.dataset.bz); bkfSaveInputs(); bkfDrawForm(); });
  document.getElementById("bk-submit").onclick = bkfSubmit;
}

// сохранить введённые поля (чтобы не терялись при перерисовке)
function bkfSaveInputs(){
  const g=document.getElementById("bk-guests"); if(g) BK_STATE.guests=g.value||null;
  const p=document.getElementById("bk-phone"); if(p) BK_STATE.phone=p.value;
  const c=document.getElementById("bk-comment"); if(c) BK_STATE.comment=c.value;
}

function bkfMsg(text){ const m=document.getElementById("bk-msg"); if(m) m.textContent=text||""; }

async function bkfSubmit(){
  bkfSaveInputs();
  if(!BK_STATE.zoneId){ bkfMsg(t('bk_pick_zone')); return; }
  const phone = (BK_STATE.phone||"").trim();
  const digits = phone.replace(/[^\d]/g,"");
  if(digits.length<9){ bkfMsg(t('bk_need_phone')); return; }

  const btn=document.getElementById("bk-submit");
  btn.disabled=true; btn.textContent=t('bk_sending');

  try{
    const zone = BK_REF.zones.find(z=>z.id===BK_STATE.zoneId);
    const venue = BK_REF.venues.find(v=>v.id===zone.venue_id);
    // представительный стол выбранной зоны (персонал переназначит при подтверждении)
    const tbl = BK_REF.tables.find(x=>x.zone_id===zone.id);
    if(!tbl){ bkfMsg("Зона недоступна, выберите другую"); btn.disabled=false; btn.textContent=t('bk_submit'); return; }

    const guests = BK_STATE.guests?Number(BK_STATE.guests):null;
    const noteParts = [
      "🌐 Заявка с сайта",
      "Зона: "+zone.title,
      guests?("Гостей: "+guests):null,
      BK_STATE.comment?("Коммент: "+BK_STATE.comment.trim()):null
    ].filter(Boolean);

    const row = {
      table_id: tbl.id,
      business_date: BK_STATE.date,
      status: "request",
      guest_name: GUEST.name,
      guests_count: guests,
      phone: phone,
      note: noteParts.join(" · "),
      deposit_amount: 0,
      is_paid: false,
      created_by: Number(GUEST.tg_id),
      created_by_name: GUEST.name
    };
    const { error } = await SB.from("bookings").insert(row);
    if(error){ bkfMsg(error.message); btn.disabled=false; btn.textContent=t('bk_submit'); return; }

    // экран «заявка отправлена»
    const body=document.getElementById("bk-body");
    body.innerHTML = `
      <div class="bk-done">
        <div class="bk-done-ic">✓</div>
        <div class="bk-done-t">${t('bk_done_t')}</div>
        <div class="bk-done-sub">${t('bk_done_sub')}</div>
        <button class="bk-submit" data-go="home" style="margin-top:18px">${t('bk_done_btn')}</button>
      </div>`;
    body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("success"); }catch(_){}
    // сбросить форму
    BK_STATE.zoneId=null; BK_STATE.comment=""; 
  }catch(e){
    bkfMsg(String(e.message||e)); btn.disabled=false; btn.textContent=t('bk_submit');
  }
}

// ============ ВИТРИНА ЗАЛОВ ============
let ZONE_VENUE = "karaoke";          // какой набор зон показываем
const zgState = {};                  // индекс текущего слайда галереи по zoneId

function zoneImgPath(f){ return "img/" + f; }   // фото лежат в подпапке img/

function renderZones(){
  const el = document.getElementById("sec-zones");
  const Z = ZONE_DEP_NOTE;
  const zones = ZONE_VENUE === "karaoke" ? KARAOKE_ZONES : CLUB_ZONES;

  const cards = zones.map(z => {
    // галерея
    let gallery;
    if (z.imgs && z.imgs.length) {
      if (zgState[z.id] == null) zgState[z.id] = 0;
      const slides = z.imgs.map(f => `<div class="zg-slide"><img src="${zoneImgPath(f)}" alt="" loading="lazy"></div>`).join("");
      const dots = z.imgs.length > 1
        ? `<div class="zg-dots">${z.imgs.map((_,i)=>`<span class="zg-dot ${i===0?'on':''}" data-zd="${z.id}:${i}"></span>`).join("")}</div>` : "";
      const arrows = z.imgs.length > 1
        ? `<button class="zg-arrow zg-prev" data-zg="${z.id}:-1">‹</button><button class="zg-arrow zg-next" data-zg="${z.id}:1">›</button>` : "";
      const count = z.imgs.length > 1 ? `<div class="zg-count" id="zgc-${z.id}">1 / ${z.imgs.length}</div>` : "";
      gallery = `<div class="zone-gallery" id="zg-${z.id}">
        <div class="zg-track" id="zgt-${z.id}">${slides}</div>${arrows}${dots}${count}</div>`;
    } else {
      gallery = `<div class="zone-gallery"><div class="zg-nophoto">${KEYHOLE}<span>${Z.photos_soon[LANG]}</span></div></div>`;
    }

    // метки: вместимость + депозит «по запросу»
    const tags = [];
    if (z.cap && z.cap[LANG]) {
      tags.push(`<span class="zone-tag"><svg class="zt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 6a3 3 0 0 1 0 6M21 20c0-2.5-2-4-4-4.5"/></svg><b>${z.cap[LANG]}</b></span>`);
    }
    tags.push(`<span class="zone-tag">${Z.deposit[LANG]}: <b>${Z.request[LANG]}</b></span>`);

    const note = z.note ? `<div class="zone-note">${z.note[LANG]}</div>` : "";

    return `<div class="zone-card">
      ${gallery}
      <div class="zone-body">
        <h3>${z.name[LANG]}</h3>
        <div class="zone-meta">${tags.join("")}</div>
        ${note}
        <div class="zone-desc">${z.desc[LANG]}</div>
        <button class="zone-book-btn" data-zbook="${z.id}">${IC.book}${Z.book[LANG]}</button>
      </div>
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="sec-head"><button class="back" data-go="home">←</button><h2>${ZONE_VENUE==='karaoke'?t('karaoke'):t('club')} · ${t('zones_t')}</h2></div>
    ${cards}`;

  // навигация разделов
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  // стрелки галереи
  el.querySelectorAll("[data-zg]").forEach(b=>b.onclick=()=>{
    const [id,dir] = b.dataset.zg.split(":");
    zgMove(id, parseInt(dir,10));
  });
  // точки галереи
  el.querySelectorAll("[data-zd]").forEach(d=>d.onclick=()=>{
    const [id,i] = d.dataset.zd.split(":");
    zgGo(id, parseInt(i,10));
  });
  // кнопка брони → пока ведёт в раздел брони (этап 3)
  el.querySelectorAll("[data-zbook]").forEach(b=>b.onclick=()=>{ go("book"); });
}

function zgCount(id){
  const zones = [...KARAOKE_ZONES, ...CLUB_ZONES];
  const z = zones.find(x=>x.id===id);
  return z && z.imgs ? z.imgs.length : 0;
}
function zgGo(id, i){
  const n = zgCount(id); if (n<=1) return;
  zgState[id] = (i + n) % n;
  const track = document.getElementById("zgt-"+id);
  if (track) track.style.transform = `translateX(-${zgState[id]*100}%)`;
  const c = document.getElementById("zgc-"+id);
  if (c) c.textContent = `${zgState[id]+1} / ${n}`;
  document.querySelectorAll(`[data-zd^="${id}:"]`).forEach((d,idx)=>d.classList.toggle("on", idx===zgState[id]));
}
function zgMove(id, dir){ zgGo(id, (zgState[id]||0) + dir); }

// ============ НАВИГАЦИЯ ============
const NAV = [
  {id:"home", key:"nav_home", ic:"home"},
  {id:"zones", key:"nav_zones", ic:"zones"},
  {id:"menu", key:"nav_menu", ic:"menu"},
  {id:"dress", key:"nav_dress", ic:"dress"},
  {id:"location", key:"nav_where", ic:"where"},
];
let CUR = "home";
function renderNav(){
  const nb = document.getElementById("navbar");
  nb.innerHTML = NAV.map(n=>`<button data-go="${n.id}" class="${CUR===n.id?'active':''}">${IC[n.ic]}<span>${t(n.key)}</span></button>`).join("");
  nb.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){
  CUR = id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  const map = {home:"sec-home",zones:"sec-zones",menu:"sec-menu",book:"sec-book",dress:"sec-dress",location:"sec-location",contacts:"sec-contacts"};
  document.getElementById(map[id]).classList.add("active");
  renderNav();
  window.scrollTo(0,0);
  if(id==="book") renderBook(true);   // полная загрузка раздела бронирования
}

// ============ ПЕРЕРИСОВКА ВСЕГО (при смене языка/заведения) ============
function renderAll(){
  renderHome();
  renderMenu();
  renderLocation();
  renderContacts();
  renderZones();
  renderBook();
  renderDress();
  renderNav();
}

// язык
document.getElementById("lang-tabs").querySelectorAll("button").forEach(b=>{

try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg){ tg.ready(); tg.expand(); } }catch(_){}

renderAll();
