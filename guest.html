
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPLETNI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2025; --line:#2a2f37;
  --text:#eef1f4; --muted:#9aa3ad; --emerald:#1fbf7a; --gold:#c9a14a;
  --hot:#e2655c; --new:#4a9be2; --veg:#5cbf7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ВЕРХНЯЯ ПАНЕЛЬ */
#topbar{position:sticky;top:0;z-index:50;background:rgba(13,15,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:8px}
#topbar .tb-row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
#topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
#topbar .brand svg{width:22px;height:22px;flex-shrink:0}
#topbar .brand b{font-size:16px;font-weight:800;letter-spacing:.14em}
.lang-tabs{display:flex;gap:3px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:100%}
.lang-tabs button{flex:1;border:none;background:transparent;color:var(--muted);padding:6px 4px;font-size:12px;font-weight:700}
.lang-tabs button.active{background:var(--emerald);color:#08130d}
#tb-mybk{position:relative;flex-shrink:0;border:1px solid var(--emerald);
  background:rgba(35,209,139,.14);color:var(--emerald);
  height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 9px}
#tb-mybk svg{width:18px;height:18px}
#tb-mybk .tb-lbl{font-size:12px;font-weight:700}
#tb-mybk.live{border-color:var(--emerald);color:var(--emerald)}
#tb-mybk .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--gold);border:2px solid #0d0f12;display:none}
#tb-mybk.has-dot .dot{display:block}
#tb-mybk.dot-ok .dot{background:var(--emerald)}
#tb-mybk.dot-no .dot{background:#e06464}
.hb-wrap{position:relative;display:flex;align-items:stretch;gap:0;margin:0 0 4px;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;background:rgba(255,255,255,.03)}
.hb-wrap.ok{border-color:rgba(35,209,139,.45);background:rgba(35,209,139,.08)}
.hb-wrap.req{border-color:rgba(232,201,122,.45);background:rgba(232,201,122,.07)}
.hb-wrap.no{border-color:rgba(224,100,100,.45);background:rgba(224,100,100,.07)}
.hb-banner{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left;
  padding:13px 38px 13px 14px;color:var(--text);cursor:pointer;background:transparent;border:none}
.hb-banner .hb-ic{width:34px;height:34px;flex-shrink:0;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-size:17px;font-weight:800}
.hb-wrap.ok .hb-ic{background:rgba(35,209,139,.18);color:var(--emerald)}
.hb-wrap.req .hb-ic{background:rgba(232,201,122,.18);color:var(--gold)}
.hb-wrap.no .hb-ic{background:rgba(224,100,100,.18);color:#e06464}
.hb-banner .hb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hb-banner .hb-h{font-size:14px;font-weight:700}
.hb-banner .hb-sub{font-size:12px;color:var(--muted)}
.hb-close{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  border:none;background:rgba(255,255,255,.1);color:var(--text);font-size:15px;font-weight:700;
  line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.hb-close:hover{background:rgba(255,255,255,.2)}
.hb-close:active{transform:scale(.9)}

/* КОНТЕНТ */
#app{max-width:560px;margin:0 auto;padding:0 0 84px}
.section{display:none;padding:14px}
.section.active{display:block}

/* ГЛАВНАЯ */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.hero img{width:100%;height:200px;object-fit:cover;opacity:.85}
.hero .hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,18,.1),rgba(13,15,18,.9))}
.hero .hero-mark{position:absolute;left:0;right:0;bottom:14px;text-align:center}
.hero .hero-mark svg{width:42px;height:42px;margin-bottom:2px}
.hero .hero-mark .name{font-size:26px;font-weight:800;letter-spacing:.2em}
.hero .hero-mark .tag{font-size:11px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}

.venue-prompt{text-align:center;font-size:15px;font-weight:700;color:var(--gold);margin:4px 0 12px;letter-spacing:.02em}
.venue-switch{display:flex;gap:8px;margin-bottom:18px}
.venue-switch button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:14px;padding:16px 8px;font-size:14px;font-weight:800;letter-spacing:.01em;position:relative;line-height:1.25}
.venue-switch button.active{border-color:var(--emerald);background:var(--panel2)}
.venue-switch button .vs-sub{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:left;
  color:var(--text);display:flex;flex-direction:column;gap:6px;min-height:92px;justify-content:center}
.tile:active{background:var(--panel2)}
.tile .t-ic{width:24px;height:24px;color:var(--emerald)}
.tile .t-name{font-size:15px;font-weight:700}
.tile .t-sub{font-size:11px;color:var(--muted)}
.tiles.tiles-3{grid-template-columns:1fr 1fr 1fr}
.tiles.tiles-3 .tile{padding:14px 10px;text-align:center}
.tiles.tiles-3 .tile .t-ic{margin:0 auto}
.tiles.tiles-3 .tile .t-name{font-size:13px;margin-top:6px}
.tiles.tiles-3 .tile .t-sub{font-size:10px}
/* карточка статуса брони на главной */
.bkhome{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--text);
  border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer}
.bkhome:active{opacity:.85}
.bkhome.req{border-color:rgba(201,161,74,.55);background:rgba(201,161,74,.10)}
.bkhome.ok{border-color:rgba(31,191,122,.55);background:rgba(31,191,122,.10)}
.bkhome.no{border-color:rgba(226,101,92,.55);background:rgba(226,101,92,.10)}
.bkhome-ic{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:20px;font-weight:800}
.bkhome.req .bkhome-ic{background:rgba(201,161,74,.2);color:var(--gold)}
.bkhome.ok .bkhome-ic{background:rgba(31,191,122,.2);color:var(--emerald)}
.bkhome.no .bkhome-ic{background:rgba(226,101,92,.2);color:#e2655c}
.bkhome-txt{flex:1;min-width:0}
.bkhome-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.bkhome-st{font-size:16px;font-weight:800;margin-top:2px}
.bkhome.req .bkhome-st{color:var(--gold)}
.bkhome.ok .bkhome-st{color:var(--emerald)}
.bkhome.no .bkhome-st{color:#e2655c}
.bkhome-sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkhome-arr{color:var(--muted);font-size:20px;flex-shrink:0}
.dc-intro{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:16px}
.dc-list{display:flex;flex-direction:column;gap:10px}
.dc-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);
  background:var(--panel);border-radius:12px;font-size:13px;line-height:1.4}
.dc-row .dc-ic{flex-shrink:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;border:1px solid}
.dc-row.dc-ok .dc-ic{color:var(--emerald);border-color:var(--emerald);background:rgba(31,191,122,.12)}
.dc-row.dc-no .dc-ic{color:var(--hot);border-color:var(--hot);background:rgba(226,101,92,.12)}
.about-card{margin-top:16px;padding:15px 16px;border:1px solid var(--line);background:var(--panel);
  border-radius:14px;font-size:13px;line-height:1.6;color:var(--text)}
.reviews-btn{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;
  border:1px solid var(--gold);background:linear-gradient(135deg,rgba(201,161,74,.16),rgba(201,161,74,.06));
  border-radius:14px;text-decoration:none;color:var(--text)}
.reviews-btn:active{background:rgba(201,161,74,.22)}
.reviews-btn .rv-star{width:24px;height:24px;color:var(--gold);flex-shrink:0;display:flex}
.reviews-btn .rv-star svg{width:24px;height:24px}
.reviews-btn .rv-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.reviews-btn .rv-main{font-size:15px;font-weight:700}
.reviews-btn .rv-sub{font-size:12px;color:var(--gold);font-weight:600}
.reviews-btn .rv-arr{color:var(--gold);font-size:18px;font-weight:700}
.hc-card{margin-top:12px;padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.hc-card .hc-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:12px}
.hc-addr{display:flex;align-items:flex-start;gap:10px;text-decoration:none;color:var(--text);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hc-addr .hc-ic{width:20px;height:20px;color:var(--emerald);flex-shrink:0;margin-top:2px}
.hc-addr .hc-ic svg{width:20px;height:20px}
.hc-addr .hc-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.hc-addr .hc-val{display:block;font-size:13px;line-height:1.4}
.hc-sites{padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hc-sites .hc-lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
.hc-site-row{display:flex;flex-direction:column;gap:8px}
.hc-site{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
.hc-site svg{width:17px;height:17px;color:var(--emerald);flex-shrink:0}
.hc-venue{margin-bottom:12px}
.hc-venue .hc-vname{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.hc-actions{display:flex;gap:8px}
.hc-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;font-family:inherit}
.hc-btn svg{width:18px;height:18px}
.hc-btn.call{background:var(--panel2);border:1px solid var(--line);color:var(--text);flex:1}
.hc-btn.tg{background:rgba(42,140,224,.16);border:1px solid #2a8ce0;color:#5bb0f0;flex-shrink:0;padding:10px 16px}
.hc-btn.tg svg{width:20px;height:20px}

/* ЗАГОЛОВОК РАЗДЕЛА */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head .back{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  width:36px;height:36px;font-size:16px;flex-shrink:0}
.sec-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}

/* МЕНЮ */
.menu-tabs{display:flex;gap:6px;margin-bottom:14px}
.menu-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:9px;font-size:13px;font-weight:700}
.menu-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.cat{margin-bottom:18px}
.cat-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.cat-title .cat-bar{width:4px;height:15px;border-radius:3px;flex-shrink:0}
.mi{display:flex;justify-content:space-between;gap:12px;padding:7px 0;align-items:baseline}
.mi .mi-n{font-size:14px}
.mi .mi-badges{display:inline-flex;gap:4px;margin-left:2px;vertical-align:middle}
.mi .bdg{font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;white-space:nowrap;letter-spacing:.02em}
.bdg.chef{color:var(--gold);border:1px solid var(--gold)}
.bdg.hot{color:var(--hot);border:1px solid var(--hot)}
.bdg.new{color:var(--new);border:1px solid var(--new)}
.bdg.veg{color:var(--veg);border:1px solid var(--veg)}
.mi .mi-p{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.mi .mi-p.dash{color:var(--line)}
.menu-note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.menu-service{text-align:center;margin:0 0 16px;padding:10px 14px;border-radius:10px;
  background:rgba(31,191,122,.14);border:1px solid var(--emerald);color:var(--emerald);
  font-size:16px;font-weight:800;letter-spacing:.02em}
.menu-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-size:11px;color:var(--muted)}
.menu-legend .lg{display:inline-flex;align-items:center;gap:4px}

/* КАК ДОБРАТЬСЯ / КОНТАКТЫ */
.info-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:12px}
.info-card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.info-card p{margin:0 0 4px;color:var(--muted);font-size:14px}
.btn-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ct-row{display:flex;gap:8px;margin-top:8px}
.ct-row .btn{flex:1}
.ct-row .ct-tg{flex:0 0 auto;width:54px;padding:0;display:flex;align-items:center;justify-content:center;color:#2aabee}
.ct-row .ct-tg svg{width:22px;height:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);border-radius:11px;padding:13px;font-size:14px;font-weight:700;
  text-decoration:none}
.btn.primary{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.btn svg{width:18px;height:18px}
.hours-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.hours-row:first-of-type{border-top:none}
.hours-row .h-d{color:var(--muted)}

/* ЗАГЛУШКА */
.stub{text-align:center;color:var(--muted);padding:50px 20px}
.stub svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* ВИТРИНА ЗАЛОВ */
.zone-venue-tabs{display:flex;gap:8px;margin-bottom:16px}
.zone-venue-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.zone-venue-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.zone-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;margin-bottom:16px}
.zone-gallery{position:relative;width:100%;aspect-ratio:3/2;background:var(--panel2);overflow:hidden}
.zone-gallery .zg-track{display:flex;height:100%;transition:transform .3s ease;will-change:transform}
.zone-gallery .zg-slide{min-width:100%;height:100%;position:relative}
.zone-gallery .zg-slide img{width:100%;height:100%;object-fit:cover}
.zone-gallery .zg-nophoto{display:flex;align-items:center;justify-content:center;flex-direction:column;
  height:100%;color:var(--muted);gap:8px}
.zone-gallery .zg-nophoto svg{width:42px;height:42px;opacity:.35}
.zone-gallery .zg-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border:none;border-radius:50%;background:rgba(13,15,18,.6);color:#fff;font-size:18px;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:2}
.zone-gallery .zg-prev{left:8px}.zone-gallery .zg-next{right:8px}
.zone-gallery .zg-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.zone-gallery .zg-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.zone-gallery .zg-dot.on{background:#fff}
.zone-gallery .zg-count{position:absolute;top:8px;right:10px;background:rgba(13,15,18,.6);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px);z-index:2}
.zone-body{padding:14px}
.zone-body h3{margin:0 0 4px;font-size:18px;font-weight:800}
.zone-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.zone-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.zone-tag b{color:var(--text);font-weight:700}
.zone-tag .zt-ic{width:13px;height:13px}
.zone-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.zone-book-btn{width:100%;border:1px solid var(--emerald);background:var(--emerald);color:#08130d;
  border-radius:11px;padding:13px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
.zone-book-btn svg{width:17px;height:17px}
.zone-note{font-size:11px;color:var(--gold);margin-top:-4px;margin-bottom:10px;font-weight:600}

/* НИЖНЯЯ НАВИГАЦИЯ */
#navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(13,15,18,.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto}
#navbar button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
#navbar button.active{color:var(--emerald)}
#navbar button svg{width:21px;height:21px}

/* БРОНИРОВАНИЕ */
.bk-loading{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.bk-note{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.bk-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:16px 0 8px}
.bk-seg{display:flex;gap:8px}
.bk-seg button{flex:1;padding:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:10px;font-size:14px;font-weight:700;font-family:inherit}
.bk-seg button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-venue-fixed{padding:11px 14px;border:1px solid var(--emerald);background:rgba(35,209,139,.12);
  color:var(--emerald);border-radius:10px;font-weight:700;text-align:center}
.bk-dates{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.bk-dates button{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);border-radius:9px;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap}
.bk-dates button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-zones{display:flex;flex-wrap:wrap;gap:8px}
.bk-zones button{padding:9px 14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:9px;font-size:13px;font-weight:600;font-family:inherit}
.bk-zones button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.bk-times{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.bk-times button{padding:9px 4px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:9px;font-size:13px;font-weight:600;font-family:inherit}
.bk-times button.on{background:var(--emerald);color:#08130d;border-color:var(--emerald)}

  bk_declined_sub: {ru:"К сожалению, мы не можем подтвердить эту бронь. Свяжитесь с нами по телефону или оставьте новую заявку на другую дату.", uz:"Afsuski, bu bronni tasdiqlay olmaymiz. Biz bilan telefon orqali bog'laning yoki boshqa sanaga yangi ariza qoldiring.", en:"Unfortunately we can't confirm this booking. Please call us or submit a new request for another date.", kz:"Өкінішке орай, бұл бронды растай алмаймыз. Бізге телефон арқылы хабарласыңыз немесе басқа күнге жаңа өтінім қалдырыңыз.", kg:"Тилекке каршы, бул бронду ырастай албайбыз. Биз менен телефон аркылуу байланышыңыз же башка күнгө жаңы өтүнмө калтырыңыз.", tj:"Мутаассифона, мо ин бронро тасдиқ карда наметавонем. Бо мо тариқи телефон тамос гиред ё дархости нав барои санаи дигар гузоред.", cn:"很抱歉，我们无法确认此预订。请致电我们或为其他日期提交新申请。"},

  bk_bizday: {ru:"Ночное время (после полуночи до 05:00) относится к выбранной дате — это та же ночь. Например, 02:00 в ночь с пятницы на субботу выбирайте как «пятница».", uz:"Tungi vaqt (yarim tundan keyin 05:00 gacha) tanlangan kunga tegishli — bu o'sha tun. Masalan, juma kechasi 02:00 uchun «juma»ni tanlang.", en:"Late-night hours (after midnight until 05:00) belong to the selected date — it's the same night. E.g. for 02:00 on Friday night, pick \"Friday\".", kz:"Түнгі уақыт (түн ортасынан кейін 05:00-ге дейін) таңдалған күнге жатады — бұл сол түн. Мысалы, жұма түні 02:00 үшін «жұманы» таңдаңыз.", kg:"Түнкү убакыт (түн ортосунан кийин 05:00гө чейин) тандалган күнгө таандык — бул ошол түн. Мисалы, жума түнү 02:00 үчүн «жуманы» тандаңыз.", tj:"Вақти шабона (баъд аз нисфи шаб то 05:00) ба санаи интихобшуда тааллуқ дорад — ин ҳамон шаб аст. Масалан, барои 02:00-и шаби ҷумъа «ҷумъа»-ро интихоб кунед.", cn:"凌晨时段（午夜后至凌晨05:00）算作所选日期——属于同一晚。例如周五夜里02:00，请选择「周五」。"},
  about_text: {ru:"SPLETNI — первый музыкальный мультикомплекс Ташкента: четыре формата отдыха в одном месте. Караоке-рестобар с ВИП-кабинками и, пожалуй, лучшим звуком в городе, ночной клуб с DJ-сетами, уютная лаунж-терраса и летняя чилл-аут зона. Профессиональная акустика, авторские коктейли и кухня — для шумных компаний и спокойных вечеров.", uz:"SPLETNI — Toshkentdagi birinchi musiqiy multikompleks: bitta joyda to'rtta dam olish formati. VIP-kabinali va shahardagi eng yaxshi ovozli karaoke-restobar, DJ-setli tungi klub, shinam laund-terrasa va yozgi chill-out zona. Professional akustika, mualliflik kokteyllari va oshxona — shovqinli kompaniyalar va tinch oqshomlar uchun.", en:"SPLETNI is Tashkent's first music multicomplex — four formats of leisure in one place. A karaoke restobar with VIP rooms and arguably the best sound in the city, a nightclub with DJ sets, a cosy lounge terrace and a summer chill-out zone. Professional acoustics, signature cocktails and kitchen — for lively parties and quiet evenings.", kz:"SPLETNI — Ташкенттегі бірінші музыкалық мультикешен: бір орында демалыстың төрт форматы. ВИП-кабиналары бар әрі қаладағы ең үздік дыбысты караоке-рестобар, DJ-сетті түнгі клуб, жайлы лаунж-терраса және жазғы чилл-аут аймағы.", kg:"SPLETNI — Ташкенттеги биринчи музыкалык мультикомплекс: бир жерде эс алуунун төрт форматы. ВИП-кабиналуу жана шаардагы эң мыкты үндүү караоке-рестобар, DJ-сетти түнкү клуб, жайлуу лаунж-терраса жана жайкы чилл-аут аймагы.", tj:"SPLETNI — маҷмааи якуми мусиқии Тошканд: чор формати фароғат дар як ҷой. Караоке-ресторан бо кабинаҳои ВИП ва беҳтарин садо дар шаҳр, клуби шабона бо DJ, террасаи бароҳат ва минтақаи чилл-аути тобистона.", cn:"SPLETNI 是塔什干首个音乐综合空间：一处汇集四种休闲形式。设有VIP包间、拥有全城顶级音响的卡拉OK餐吧、DJ夜店、舒适休息露台以及夏季悠闲区。"},

// авторизация гостя через Edge Function guest-auth (проверка подписи Telegram)
async function guestAuth(){
  if(GUEST) return true;
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg && tg.initData;
  if(!window.supabase){ BK_AUTH_ERR = "Библиотека Supabase не загрузилась (проверьте интернет/CDN)"; return false; }
  if(!initData){ BK_AUTH_ERR = "Нет данных Telegram (initData пуст). Откройте через кнопку бота, не по прямой ссылке."; return false; }
  try{
    const r = await fetch(GUEST_AUTH_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+SB_ANON, "apikey":SB_ANON },
      body: JSON.stringify({ initData })
    });
    let d=null; try{ d = await r.json(); }catch(_){ d=null; }
    if(!r.ok || !d || !d.token){
      BK_AUTH_ERR = "Сервер авторизации: " + (d && d.error ? d.error : ("код "+r.status));
      return false;
    }
    GUEST = { tg_id: d.tg_id, name: d.name };
    SB = window.supabase.createClient(SB_URL, SB_ANON, {
      global:{ headers:{ Authorization: "Bearer "+d.token } },
      auth:{ persistSession:false }
    });
    return true;
  }catch(e){ BK_AUTH_ERR = "Сеть/запрос: " + String(e.message||e); return false; }
}

function renderMenu(){

    return `<div class="cat"><div class="cat-title" style="color:${col}"><span class="cat-bar" style="background:${col}"></span>${pick(sec.cat)}</div>${rows}</div>`;
  }).join("");

// ============ БРОНИРОВАНИЕ (заявка) ============
// форматирование даты YYYY-MM-DD
function bkfIso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// текущий бизнес-день: до 05:00 утра — это ещё «вчерашняя» ночь
function bkfBizToday(){
  const n=new Date();
  if(n.getHours()<5){ const y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1); return bkfIso(y); }
  return bkfIso(n);
}
// бронь прошла, если её бизнес-дата строго раньше текущего бизнес-дня
function bkfIsPast(b){
  if(!b || !b.business_date) return false;
  return String(b.business_date) < bkfBizToday();
}
// список ближайших дат для выбора (сегодня + 13 дней)
function bkfDates(){
  const out=[];
  // отсчёт от бизнес-дня: ночью (до 05:00) «сегодня» — это ещё предыдущий календарный день
  const n=new Date();
  const base=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(n.getHours()<5) base.setDate(base.getDate()-1);
  for(let i=0;i<14;i++){ const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i); out.push(d); }
  return out;
}
function bkfDateLabel(d, idx){
  if(idx===0) return t('bk_today');
  if(idx===1) return t('bk_tomorrow');
  const _wdMap={ru:["вс","пн","вт","ср","чт","пт","сб"],uz:["yak","dush","sesh","chor","pay","jum","shan"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
  const wd=(_wdMap[LANG]||_wdMap.ru)[d.getDay()];
  return wd+" "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
}

// формат суммы: 1500000 -> "1 500 000 сум"
function bkfMoney(n){
  const v = Number(n)||0;
  return v.toLocaleString("ru-RU").replace(/,/g," ") + " сум";
}
// дата ISO (yyyy-mm-dd) -> читаемая "дд.мм.гггг"
function bkfFmtDate(iso){
  if(!iso) return "";
  const p=String(iso).split("-"); if(p.length<3) return iso;
  return p[2]+"."+p[1]+"."+p[0];
}
// время прихода из arrive_at (timestamptz) -> "ЧЧ:ММ"
function bkfFmtTime(ts){
  if(!ts) return "";
  try{ return new Date(ts).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }catch(_){ return ""; }
}
// по table_id вернуть {table, zone, venue} из справочников BK_REF
function bkfResolveTable(tableId){
  if(!BK_REF || tableId==null) return {};
  const table = BK_REF.tables.find(x=>x.id===tableId);
  if(!table) return {};
  const zone = BK_REF.zones.find(z=>z.id===table.zone_id);
  const venue = zone ? BK_REF.venues.find(v=>v.id===zone.venue_id) : null;
  return {table, zone, venue};
}
// человекочитаемое название места: "Кабинка №7 · VIP" / "Стол 5 · Большой зал"
function bkfPlaceLabel(tableId){
  const {table, zone} = bkfResolveTable(tableId);
  if(!table) return "";
  const tn = table.name || table.code || ("№"+table.id);
  const zn = zone ? (zone.title||"") : "";
  return zn ? (tn+" · "+zn) : tn;
}

// загрузка справочников (заведения + зоны + столы) из базы
async function bkfLoadRef(){
  if(BK_REF) return BK_REF;
  const [v,z,tb] = await Promise.all([
    SB.from("venues").select("*").order("id"),
    SB.from("zones").select("*").order("sort"),
    SB.from("tables").select("*").order("id"),
  ]);
  BK_REF = { venues:v.data||[], zones:z.data||[], tables:tb.data||[] };
  return BK_REF;
}

// зоны выбранного заведения
function bkfZonesFor(venueKey){
  if(!BK_REF) return [];
  const venue = BK_REF.venues.find(x=>x.key===venueKey);
  if(!venue) return [];
  return BK_REF.zones.filter(z=>z.venue_id===venue.id);
}

async function renderBook(force){
  const el = document.getElementById("sec-book");
  // лёгкая отрисовка оболочки; тяжёлая загрузка — только когда гость реально открыл раздел
  el.innerHTML = `<div class="sec-head"><button class="back" data-go="home">←</button><h2>${t('book_t')}</h2></div>
    <div class="info-card" id="bk-body"><div class="bk-loading">${t('bk_auth_wait')}</div></div>`;
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  if(!force) return;   // только оболочка (при общем renderAll)
  BKF_FORM_OPEN = false;   // заново открыли раздел — статус снова можно показывать

  // авторизация гостя (один раз)
  const ok = await guestAuth();
  const body = document.getElementById("bk-body");
  if(!body) return;
  if(!ok){
    body.innerHTML = `<div class="bk-loading">${t('bk_auth_err')}</div>`;
    return;
  }
  await bkfLoadRef();

  // самая релевантная заявка этого гостя (booked > request > cancelled)
  let last=null;
  try{
    const {data} = await SB.from("bookings")
      .select("id,status,business_date,arrive_at,table_id,deposit_amount,guests_count,note,guest_name,cancel_reason")
      .eq("created_by", Number(GUEST.tg_id))
      .in("status",["request","booked","cancelled"])
      .order("id",{ascending:false}).limit(20);
    last = mybkPickRelevant(data||[]);
  }catch(_){}

  // прошедшую бронь (её ночь уже закончилась) не показываем — сразу форма
  if(last && bkfIsPast(last)) last = null;

  // гость пришёл из карточки зоны с явным намерением бронировать — открываем форму,
  // не показывая экран отклонённой заявки (но активную бронь всё равно уважаем)
  const gotoForm = BK_GOTO_FORM;
  BK_GOTO_FORM = false;
  if(gotoForm && !(last && (last.status==="request" || last.status==="booked"))){
    bkfShowForm();
    return;
  }

  // активные (request/booked) — показываем статус и блокируем форму
  if(last && (last.status==="request" || last.status==="booked")){
    const note = last.status==="request" ? `<div class="bk-note">${t('bk_have_active')}</div>` : "";
    body.innerHTML = bkfStatusCard(last) + note;
    const co=document.getElementById("bk-cancel-own");
    if(co) co.onclick=()=>bkfCancelOwnPrompt(last.id);
    bkfSubscribe(last.id);   // realtime: мгновенно обновим при подтверждении/отказе
    return;
  }

  // последняя заявка отклонена — показываем причину и даём подать новую
  // (если гость уже закрыл это сообщение крестиком — сразу форма)
  if(last && last.status==="cancelled" && !MYBK_DISMISSED.has(mybkKey(last))){
    body.innerHTML = bkfStatusCard(last) +
      `<button class="bk-submit" id="bk-newreq" style="margin-top:4px">${t('bk_new_req')}</button>`;
    const nb=document.getElementById("bk-newreq");
    if(nb) nb.onclick=()=>{ BK_LAST_CANCELLED_SEEN=last.id; bkfShowForm(); };
    // крестик — гость закрывает сообщение об отказе, больше оно не появляется
    const rc=document.getElementById("bk-res-close");
    if(rc) rc.onclick=()=>{ mybkDismiss(mybkKey(last)); bkfShowForm(); };
    bkfSubscribe(last.id);
    return;
  }

  bkfShowForm();
}

function bkfCancelOwnPrompt(bookingId){
  const body = document.getElementById("bk-body");
  if(!body) return;
  bkfStopPoll();
  try{ if(BK_SUB){ SB.removeChannel(BK_SUB); BK_SUB=null; } }catch(_){}
  BKF_FORM_OPEN = true;   // не даём фоновому обновлению перерисовать экран
  body.innerHTML = `
    <div class="bk-note">${t('bk_cancel_q')}</div>
    <textarea id="bk-co-reason" class="bk-co-textarea" rows="3" placeholder="${t('bk_cancel_ph')}"></textarea>
    <div id="bk-co-msg" class="bk-co-msg"></div>
    <button class="bk-submit danger" id="bk-co-ok" style="margin-top:8px">${t('bk_cancel_confirm')}</button>
    <button class="bk-submit ghost" id="bk-co-back" style="margin-top:8px">${t('bk_cancel_back')}</button>`;
  document.getElementById("bk-co-back").onclick=()=>{ BKF_FORM_OPEN=false; renderBook(true); };
  document.getElementById("bk-co-ok").onclick=async function(){
    const reason = (document.getElementById("bk-co-reason").value||"").trim();
    if(!reason){ document.getElementById("bk-co-msg").textContent = t('bk_pick_reason')||"Напишите причину"; return; }
    this.disabled=true; this.textContent="…";
    try{
      const upd = {
        status:"cancelled",
        cancel_reason: "Отмена гостем: " + reason,
        cancelled_by_name: "Гость" + (GUEST && GUEST.name ? (" · "+GUEST.name) : ""),
        cancelled_at: new Date().toISOString()
      };
      const { error } = await SB.from("bookings").update(upd).eq("id", bookingId).eq("created_by", Number(GUEST.tg_id));
      if(error){ document.getElementById("bk-co-msg").textContent = error.message; this.disabled=false; this.textContent=t('bk_cancel_confirm'); return; }
    }catch(e){ document.getElementById("bk-co-msg").textContent = String(e.message||e); this.disabled=false; this.textContent=t('bk_cancel_confirm'); return; }
    BKF_FORM_OPEN=false;
    try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("success"); }catch(_){}
    body.innerHTML = `<div class="bk-res ok"><div class="bk-res-ic">✓</div>
      <div class="bk-res-h">${t('bk_cancel_done')}</div>
      <button class="bk-submit" data-go="home" style="margin-top:18px">${t('bk_done_btn')}</button></div>`;
    body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    mybkRefresh();
  };
}

// realtime-подписка на изменения текущей заявки гостя
let BK_SUB = null;
let BK_LAST_CANCELLED_SEEN = null;   // id отклонённой заявки, после которой гость уже открыл новую форму
function bkfSubscribe(bookingId){
  try{
    if(BK_SUB){ SB.removeChannel(BK_SUB); BK_SUB=null; }
    BK_SUB = SB.channel("guest-bk-"+bookingId)
      .on("postgres_changes",
        { event:"UPDATE", schema:"public", table:"bookings", filter:"id=eq."+bookingId },
        (payload)=>{ bkfApplyStatusUpdate(payload.new || {}); })
      .subscribe();
  }catch(_){}
  // ПОДСТРАХОВКА: опрос статуса раз в 12 сек (на случай если realtime не настроен/уснул)
  bkfStartPoll(bookingId);
}

// единая обработка пришедшего статуса (из realtime или из опроса)
let BK_LAST_SEEN_STATUS = null;
function bkfApplyStatusUpdate(row){
  if(!row || !row.id) return;
  // если гость открыл форму новой заявки — не перерисовываем её обратно на старый статус
  if(BKF_FORM_OPEN){ return; }
  // реагируем только на реальную смену статуса
  if(row.status===BK_LAST_SEEN_STATUS) { /* всё равно обновим карточку ниже */ }
  BK_LAST_SEEN_STATUS = row.status;
  MYBK_LAST = row; mybkBadge(row); mybkRenderHomeSlot(row);
  const body = document.getElementById("bk-body");
  if(!body) return;
  if(row.status==="booked"){
    body.innerHTML = bkfStatusCard(row);
    const co=document.getElementById("bk-cancel-own");
    if(co) co.onclick=()=>bkfCancelOwnPrompt(row.id);
    try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("success"); }catch(_){}
    bkfStopPoll();
  }else if(row.status==="cancelled"){
    body.innerHTML = bkfStatusCard(row) +
      `<button class="bk-submit" id="bk-newreq" style="margin-top:4px">${t('bk_new_req')}</button>`;
    const nb=document.getElementById("bk-newreq");
    if(nb) nb.onclick=()=>{ BK_LAST_CANCELLED_SEEN=row.id; bkfShowForm(); };
    try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("warning"); }catch(_){}
    bkfStopPoll();
  }
}

// опрос статуса заявки
let BK_POLL_TIMER = null;
let BKF_FORM_OPEN = false;   // открыта ли форма новой заявки (блокирует перерисовку статусом)
function bkfStartPoll(bookingId){
  bkfStopPoll();
  BK_POLL_TIMER = setInterval(async ()=>{
    // если гость ушёл из раздела брони — нет смысла опрашивать
    const sec = document.getElementById("sec-book");
    if(!sec || !sec.classList.contains("active")){ return; }
    try{
      const { data } = await SB.from("bookings")
        .select("id,status,business_date,arrive_at,table_id,deposit_amount,guests_count,note,guest_name,cancel_reason")
        .eq("id", bookingId).limit(1);
      if(data && data.length){
        const row = data[0];
        if(row.status==="booked" || row.status==="cancelled"){ bkfApplyStatusUpdate(row); }
      }
    }catch(_){}
  }, 12000);
}
function bkfStopPoll(){ if(BK_POLL_TIMER){ clearInterval(BK_POLL_TIMER); BK_POLL_TIMER=null; } }

// показать форму заявки (с автоподстановкой телефона)
async function bkfShowForm(){
  const body = document.getElementById("bk-body");
  if(!body) return;
  // ВАЖНО: гость открывает форму новой заявки — прекращаем наблюдение за старой,
  // иначе polling/realtime перерисуют форму обратно на карточку старого статуса
  bkfStopPoll();
  try{ if(BK_SUB){ SB.removeChannel(BK_SUB); BK_SUB=null; } }catch(_){}
  BKF_FORM_OPEN = true;
  if(!BK_STATE.date) BK_STATE.date = bkfBizToday();
  if(!BK_STATE.phone){
    try{
      const {data} = await SB.from("bookings").select("phone,created_at")
        .eq("created_by", Number(GUEST.tg_id))
        .not("phone","is",null)

// форматирование телефона для поля ввода: группировка пробелами
function bkfFmtPhoneInput(raw){
  if(!raw) return "";
  let plus = String(raw).trim().startsWith("+");
  let d = String(raw).replace(/[^\d]/g,"");
  // узбекский номер: 998 + 9 цифр -> "+998 90 063 88 88"
  if(d.startsWith("998")){
    const rest = d.slice(3,12); // до 9 цифр оператора+номера
    const parts = [rest.slice(0,2), rest.slice(2,5), rest.slice(5,7), rest.slice(7,9)].filter(Boolean);
    return ("+998" + (parts.length?(" "+parts.join(" ")):"")).trim();
  }
  // 9 цифр без кода страны -> добавим +998
  if(d.length<=9 && (plus===false)){
    const parts = [d.slice(0,2), d.slice(2,5), d.slice(5,7), d.slice(7,9)].filter(Boolean);
    return parts.length ? ("+998 "+parts.join(" ")) : "";
  }
  // прочее (другой код страны) — просто группируем по 3
  return (plus?"+":"") + d.replace(/(\d{1,3})(?=(\d{3})+$)/g,"$1 ").trim();
}

// интервалы времени 30 мин: 18:00 → 23:30, затем 00:00 → 04:30 (ночь)
function bkfTimeSlots(){
  const out=[];
  for(let h=18; h<=23; h++){ out.push(pad2(h)+":00"); out.push(pad2(h)+":30"); }
  for(let h=0; h<=4; h++){ out.push(pad2(h)+":00"); out.push(pad2(h)+":30"); }
  return out;
}
function pad2(n){ return String(n).padStart(2,"0"); }
// прошёл ли слот времени для выбранной бизнес-даты (с запасом 0 мин).
// учитывает ночные часы: для 00:00-04:59 фактический момент — следующий календарный день.
function bkfSlotPassed(dateIso, time){
  if(!dateIso || !time) return false;
  // момент слота как реальная дата-время
  const [y,m,dd] = dateIso.split("-").map(Number);
  const [h,mi] = time.split(":").map(Number);
  const slot = new Date(y, m-1, dd);
  if(h < 5) slot.setDate(slot.getDate()+1);   // ночь = следующий календарный день
  slot.setHours(h, mi, 0, 0);
  // нельзя бронировать слот, который уже наступил/прошёл
  return slot.getTime() <= Date.now();
}
// время прихода -> ISO timestamptz. Для 00:00-04:59 это следующий календарный день
// относительно бизнес-даты (ночь выбранной даты).
function bkfComposeArrive(dateIso, time){
  const [y,m,dd] = dateIso.split("-").map(Number);
  const [h,mi] = time.split(":").map(Number);
  const d = new Date(y, m-1, dd);
  if(h < 5) d.setDate(d.getDate()+1);   // ночные часы = следующий календарный день
  d.setHours(h, mi, 0, 0);
  return d.toISOString();
}

  const phone = (BK_STATE.phone||"").trim();
  const digits = phone.replace(/[^\d]/g,"");

  const btn=document.getElementById("bk-submit");
  btn.disabled=true; btn.textContent=t('bk_sending');

    const zone = BK_REF.zones.find(z=>z.id===BK_STATE.zoneId);

    // время прихода -> timestamptz; ночные часы (00:00-04:59) = следующий календарный день
    const arriveAt = bkfComposeArrive(BK_STATE.date, BK_STATE.time);
    const noteParts = [
      "🌐 Заявка с сайта",
      "Зона: "+zone.title,
      "Время: "+BK_STATE.time,
      guests?("Гостей: "+guests):null,
      BK_STATE.comment?("Коммент: "+BK_STATE.comment.trim()):null
    ].filter(Boolean);

    const row = {
      table_id: tbl.id,
      business_date: BK_STATE.date,
      arrive_at: arriveAt,
      status: "request",
      guest_name: GUEST.name,
      guests_count: guests,
      phone: phone,
      note: noteParts.join(" · "),
      deposit_amount: 0,
      is_paid: false,
      created_by: Number(GUEST.tg_id),
      created_by_name: GUEST.name
    };
    const { data:ins, error } = await SB.from("bookings").insert(row).select("id").single();
    if(error){ bkfMsg(error.message); btn.disabled=false; btn.textContent=t('bk_submit'); return; }

    BKF_FORM_OPEN = false;   // заявка отправлена — форма закрыта, можно следить за новой
    BK_LAST_SEEN_STATUS = "request";
    // подписка на изменения новой заявки — гость сразу увидит подтверждение/отказ
    if(ins && ins.id) bkfSubscribe(ins.id);

    // экран «заявка отправлена»
    const body=document.getElementById("bk-body");
    body.innerHTML = `
      <div class="bk-done">
        <div class="bk-done-ic">✓</div>
        <div class="bk-done-t">${t('bk_done_t')}</div>
        <div class="bk-done-sub">${t('bk_done_sub')}</div>
        <button class="bk-submit" data-go="home" style="margin-top:18px">${t('bk_done_btn')}</button>
      </div>`;
    body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
    try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("success"); }catch(_){}
    // сбросить форму
    BK_STATE.zoneId=null; BK_STATE.comment=""; 
  }catch(e){
    bkfMsg(String(e.message||e)); btn.disabled=false; btn.textContent=t('bk_submit');
  }
}

function zgCount(id){
  const zones = [...KARAOKE_ZONES, ...CLUB_ZONES];
  const z = zones.find(x=>x.id===id);
  return z && z.imgs ? z.imgs.length : 0;
}
function zgGo(id, i){
  const n = zgCount(id); if (n<=1) return;
  zgState[id] = (i + n) % n;
  const track = document.getElementById("zgt-"+id);
  if (track) track.style.transform = `translateX(-${zgState[id]*100}%)`;
  const c = document.getElementById("zgc-"+id);
  if (c) c.textContent = `${zgState[id]+1} / ${n}`;
  document.querySelectorAll(`[data-zd^="${id}:"]`).forEach((d,idx)=>d.classList.toggle("on", idx===zgState[id]));
}
function zgMove(id, dir){ zgGo(id, (zgState[id]||0) + dir); }

// ============ МОИ БРОНИ: баннер на главной + бейдж в шапке ============
let MYBK_LAST = null;        // последняя заявка гостя (любой статус)
let MYBK_SEEN_ID = null;     // id заявки, статус которой гость уже «видел» (для бейджа)
let MYBK_SEEN_STATUS = null;
const MYBK_DISMISSED = new Set();   // id отклонённых заявок, скрытых гостем (крестик)
let MYBK_TOAST_TIMER = null;        // таймер авто-скрытия отклонённого баннера
const MYBK_CS_KEY = "dismissed_declined";   // ключ в Telegram CloudStorage

// загрузить список скрытых заявок из Telegram CloudStorage (между сессиями)
function mybkLoadDismissed(cb){
  // 0) sessionStorage — переживает перерисовки в рамках открытия
  try{
    const sv = window.sessionStorage && sessionStorage.getItem(MYBK_CS_KEY);
    if(sv){ JSON.parse(sv).forEach(k=>MYBK_DISMISSED.add(String(k))); }
  }catch(_){}
  // 1) localStorage — синхронно, надёжно в Telegram WebView
  try{
    const v = window.localStorage && localStorage.getItem(MYBK_CS_KEY);
    if(v){ JSON.parse(v).forEach(k=>MYBK_DISMISSED.add(String(k))); }
  }catch(_){}
  // 2) CloudStorage — для синхронизации между устройствами (если доступен)
  try{
    const cs = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage;
    if(cs && cs.getItem){
      cs.getItem(MYBK_CS_KEY, (err,val)=>{
        if(!err && val){ try{ JSON.parse(val).forEach(k=>MYBK_DISMISSED.add(String(k))); }catch(_){} }
        if(cb) cb();
      });
      return;
    }
  }catch(_){}
  if(cb) cb();
}
// скрыть заявку (ключ id:status) и сохранить во всех доступных хранилищах
function mybkDismiss(key){
  MYBK_DISMISSED.add(String(key));
  const payload = JSON.stringify([...MYBK_DISMISSED]);
  try{ if(window.sessionStorage) sessionStorage.setItem(MYBK_CS_KEY, payload); }catch(_){}
  try{ if(window.localStorage) localStorage.setItem(MYBK_CS_KEY, payload); }catch(_){}
  try{
    const cs = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage;
    if(cs && cs.setItem) cs.setItem(MYBK_CS_KEY, payload);
  }catch(_){}
}

// подтянуть последнюю заявку гостя и обновить баннер + бейдж
async function mybkRefresh(){
  const ok = await guestAuth();
  if(!ok){ mybkRenderHomeSlot(null); mybkBadge(null); return; }
  let last=null;
  try{
    const {data} = await SB.from("bookings")
      .select("id,status,business_date,arrive_at,table_id,deposit_amount,guests_count,note,guest_name,cancel_reason")
      .eq("created_by", Number(GUEST.tg_id))
      .in("status",["request","booked","cancelled"])
      .order("id",{ascending:false}).limit(20);
    last = mybkPickRelevant(data||[]);
  }catch(_){}
  // прошедшую бронь не показываем
  if(last && typeof bkfIsPast==="function" && bkfIsPast(last)) last=null;
  MYBK_LAST = last;
  mybkLoadDismissed(()=>{
    mybkRenderHomeSlot(last);
    mybkBadge(last);
  });
  mybkSubscribeHome(last);
}

// выбрать самую релевантную заявку из списка: booked > request > cancelled.
// внутри статуса — самую свежую (по id). Прошедшие отбрасываются.
function mybkPickRelevant(rows){
  if(!rows || !rows.length) return null;
  const alive = rows.filter(r=>!(typeof bkfIsPast==="function" && bkfIsPast(r)));
  const pool = alive.length ? alive : rows;
  const rank = s => s==="booked"?0 : (s==="request"?1 : 2);
  let best=null;
  for(const r of pool){
    if(!best){ best=r; continue; }
    const rb=rank(best.status), rr=rank(r.status);
    if(rr<rb || (rr===rb && Number(r.id)>Number(best.id))) best=r;
  }
  return best;
}

// бейдж-точка на иконке в шапке
function mybkBadge(b){
  const btn=document.getElementById("tb-mybk");
  if(!btn) return;
  btn.classList.remove("has-dot","dot-ok","dot-no","live");
  if(!b) return;
  // точку показываем, если статус заявки ещё «не отсмотрен» гостем и не закрыт крестиком
  const fresh = (MYBK_SEEN_ID!==b.id) || (MYBK_SEEN_STATUS!==b.status);
  const dismissed = MYBK_DISMISSED.has(mybkKey(b));
  if(b.status==="booked"){ btn.classList.add("live"); if(fresh && !dismissed) btn.classList.add("has-dot","dot-ok"); }
  else if(b.status==="cancelled"){ if(fresh && !dismissed) btn.classList.add("has-dot","dot-no"); }
  else if(b.status==="request"){ btn.classList.add("live"); }
}

// баннер на главном экране (в слот #bkhome-slot)
function mybkRenderHomeSlot(b){
  const slot=document.getElementById("bkhome-slot");
  if(!slot) return;
  if(!b){ slot.innerHTML=""; return; }
  // если этот статус заявки гость уже закрыл крестиком — не показываем,
  // пока не произойдёт новое событие (смена статуса или новая заявка)
  if(MYBK_DISMISSED.has(mybkKey(b))){ slot.innerHTML=""; return; }
  let cls, ic, label;
  const dateStr = (typeof bkfFmtDate==="function" && b.business_date) ? bkfFmtDate(b.business_date) : "";
  const timeStr = (b.arrive_at && typeof bkfFmtTime==="function") ? bkfFmtTime(b.arrive_at) : "";
  const when = [dateStr, timeStr].filter(Boolean).join(" · ");
  if(b.status==="booked"){ cls="ok"; ic="✓"; label=t('hb_confirmed'); }
  else if(b.status==="cancelled"){ cls="no"; ic=""; label=t('hb_declined'); }
  else { cls="req"; ic="⏳"; label=t('hb_review'); }
  const closable = (b.status!=="request");   // «на рассмотрении» закрыть нельзя — висит до решения
  slot.innerHTML = `
    <div class="hb-wrap ${cls}">
      <div class="hb-banner" id="hb-go" role="button" tabindex="0">
        ${ic?`<span class="hb-ic">${ic}</span>`:""}
        <span class="hb-txt">
          <span class="hb-h">${t('hb_title')} · ${label}</span>
          ${when?`<span class="hb-sub">${when}</span>`:""}
        </span>
      </div>
      ${closable?`<button class="hb-close" id="hb-close" aria-label="${t('hb_close')}" title="${t('hb_close')}">✕</button>`:""}
    </div>`;
  const g=document.getElementById("hb-go");
  if(g) g.onclick=()=>{ mybkMarkSeen(b); go("book"); };
  if(closable){
    const x=document.getElementById("hb-close");
    if(x) x.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); mybkDismiss(mybkKey(b)); slot.innerHTML=""; mybkBadge(b); };
  }
}
// ключ скрытия = id + статус: новое событие (другой статус) снова покажет баннер
function mybkKey(b){ return String(b.id)+":"+String(b.status); }

// realtime на главной: статус сменился, пока гость не в разделе брони
let MYBK_SUB=null;
function mybkSubscribeHome(b){
  try{
    if(MYBK_SUB){ SB.removeChannel(MYBK_SUB); MYBK_SUB=null; }
    mybkStopPoll();
    if(!b) return;
    MYBK_SUB = SB.channel("guest-home-"+b.id)
      .on("postgres_changes",
        { event:"UPDATE", schema:"public", table:"bookings", filter:"id=eq."+b.id },
        (payload)=>{ mybkHomeApply(payload.new||{}); })
      .subscribe();
    // ПОДСТРАХОВКА опросом, пока заявка ещё на рассмотрении
    if(b.status==="request") mybkStartPoll(b.id);
  }catch(_){}
}

// обработка обновления статуса на главном
function mybkHomeApply(row){
  if(!row || !row.id) return;
  MYBK_LAST=row;
  mybkRenderHomeSlot(row);
  mybkBadge(row);
  try{
    if(row.status==="booked") window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("success");
    else if(row.status==="cancelled") window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred?.("warning");
  }catch(_){}
  if(row.status!=="request") mybkStopPoll();
}

// опрос статуса для главного экрана
let MYBK_POLL_TIMER=null;
function mybkStartPoll(bookingId){
  mybkStopPoll();
  MYBK_POLL_TIMER = setInterval(async ()=>{
    try{
      const { data } = await SB.from("bookings")
        .select("id,status,business_date,arrive_at,table_id,deposit_amount,guests_count,note,guest_name,cancel_reason")
        .eq("id", bookingId).limit(1);
      if(data && data.length){
        const row=data[0];
        if(row.status!=="request") mybkHomeApply(row);
      }
    }catch(_){}
  }, 12000);
}
function mybkStopPoll(){ if(MYBK_POLL_TIMER){ clearInterval(MYBK_POLL_TIMER); MYBK_POLL_TIMER=null; } }

// гость «увидел» статус — гасим бейдж
function mybkMarkSeen(b){
  if(!b) return;
  MYBK_SEEN_ID=b.id; MYBK_SEEN_STATUS=b.status;
  mybkBadge(b);
}

// клик по иконке в шапке → раздел брони
(function(){
  const btn=document.getElementById("tb-mybk");
  if(btn) btn.onclick=()=>{ if(MYBK_LAST) mybkMarkSeen(MYBK_LAST); go("book"); };
})();

// ============ НАВИГАЦИЯ ============
const NAV = [
  {id:"home", key:"nav_home", ic:"home"},
  {id:"zones", key:"nav_zones", ic:"zones"},
  {id:"menu", key:"nav_menu", ic:"menu"},
  {id:"dress", key:"nav_dress", ic:"dress"},
  {id:"location", key:"nav_where", ic:"where"},
];
let CUR = "home";
function renderNav(){
  const nb = document.getElementById("navbar");
  nb.innerHTML = NAV.map(n=>`<button data-go="${n.id}" class="${CUR===n.id?'active':''}">${IC[n.ic]}<span>${t(n.key)}</span></button>`).join("");
  nb.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){
  CUR = id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  const map = {home:"sec-home",zones:"sec-zones",menu:"sec-menu",book:"sec-book",dress:"sec-dress",location:"sec-location",contacts:"sec-contacts"};
  document.getElementById(map[id]).classList.add("active");
  renderNav();
  window.scrollTo(0,0);
  if(id==="book"){ if(typeof ZONE_VENUE!=="undefined" && ZONE_VENUE){ BK_STATE.venue=ZONE_VENUE; } renderBook(true); if(MYBK_LAST) mybkMarkSeen(MYBK_LAST); }   // бронь — под выбранное заведение
  if(id==="home") mybkRefresh();       // обновить баннер статуса брони на главной
  if(id==="zones") renderZones();     // перерисовать под выбранное заведение (ZONE_VENUE)
}

// ============ ПЕРЕРИСОВКА ВСЕГО (при смене языка/заведения) ============
function renderAll(){
  renderHome();
  renderMenu();
  renderLocation();
  renderContacts();
  renderZones();
  renderBook();
  renderDress();
  renderNav();
  const mybkLbl=document.getElementById("tb-mybk-lbl");
  if(mybkLbl) mybkLbl.textContent=t('tb_mybk');
  mybkRefresh();
}

// язык
document.getElementById("lang-tabs").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
    LANG=b.dataset.l;
    document.getElementById("lang-tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.l===LANG));
    document.documentElement.lang=LANG;
    renderAll();
  };
});

// Telegram init
try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg){ tg.ready(); tg.expand(); } }catch(_){}

renderAll();

</script>
