<style>
:root{
  --bg:#0d0f12; --panel:#15181d; --panel2:#1c2025; --line:#2a2f37;
  --text:#eef1f4; --muted:#9aa3ad; --emerald:#1fbf7a; --gold:#c9a14a;
  --hot:#e2655c; --new:#4a9be2; --veg:#5cbf7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ВЕРХНЯЯ ПАНЕЛЬ */
#topbar{position:sticky;top:0;z-index:50;background:rgba(13,15,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
#topbar .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#topbar .brand svg{width:22px;height:22px;flex-shrink:0}
#topbar .brand b{font-size:16px;font-weight:800;letter-spacing:.14em}
.lang-tabs{display:flex;gap:3px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-tabs button{border:none;background:transparent;color:var(--muted);padding:5px 9px;font-size:12px;font-weight:700}
.lang-tabs button.active{background:var(--emerald);color:#08130d}

/* КОНТЕНТ */
#app{max-width:560px;margin:0 auto;padding:0 0 84px}
.section{display:none;padding:14px}
.section.active{display:block}

/* ГЛАВНАЯ */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line)}
.hero img{width:100%;height:200px;object-fit:cover;opacity:.85}
.hero .hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,18,.1),rgba(13,15,18,.9))}
.hero .hero-mark{position:absolute;left:0;right:0;bottom:14px;text-align:center}
.hero .hero-mark svg{width:42px;height:42px;margin-bottom:2px}
.hero .hero-mark .name{font-size:26px;font-weight:800;letter-spacing:.2em}
.hero .hero-mark .tag{font-size:11px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}

.venue-switch{display:flex;gap:8px;margin-bottom:18px}
.venue-switch button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:14px;padding:16px 10px;font-size:15px;font-weight:800;letter-spacing:.04em;position:relative}
.venue-switch button.active{border-color:var(--emerald);background:var(--panel2)}
.venue-switch button .vs-sub{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:left;
  color:var(--text);display:flex;flex-direction:column;gap:6px;min-height:92px;justify-content:center}
.tile:active{background:var(--panel2)}
.tile .t-ic{width:24px;height:24px;color:var(--emerald)}
.tile .t-name{font-size:15px;font-weight:700}
.tile .t-sub{font-size:11px;color:var(--muted)}

/* ЗАГОЛОВОК РАЗДЕЛА */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head .back{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  width:36px;height:36px;font-size:16px;flex-shrink:0}
.sec-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em}

/* МЕНЮ */
.menu-tabs{display:flex;gap:6px;margin-bottom:14px}
.menu-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:9px;font-size:13px;font-weight:700}
.menu-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.cat{margin-bottom:18px}
.cat-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
.cat-title .cat-bar{width:4px;height:15px;border-radius:3px;flex-shrink:0}
.mi{display:flex;justify-content:space-between;gap:12px;padding:7px 0;align-items:baseline}
.mi .mi-n{font-size:14px}
.mi .mi-badges{display:inline-flex;gap:4px;margin-left:2px;vertical-align:middle}
.mi .bdg{font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;white-space:nowrap;letter-spacing:.02em}
.bdg.chef{color:var(--gold);border:1px solid var(--gold)}
.bdg.hot{color:var(--hot);border:1px solid var(--hot)}
.bdg.new{color:var(--new);border:1px solid var(--new)}
.bdg.veg{color:var(--veg);border:1px solid var(--veg)}
.mi .mi-p{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.mi .mi-p.dash{color:var(--line)}
.menu-note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.menu-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-size:11px;color:var(--muted)}
.menu-legend .lg{display:inline-flex;align-items:center;gap:4px}

/* КАК ДОБРАТЬСЯ / КОНТАКТЫ */
.info-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:12px}
.info-card h3{margin:0 0 8px;font-size:15px;font-weight:700}
.info-card p{margin:0 0 4px;color:var(--muted);font-size:14px}
.btn-row{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);border-radius:11px;padding:13px;font-size:14px;font-weight:700;
  text-decoration:none}
.btn.primary{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.btn svg{width:18px;height:18px}
.hours-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.hours-row:first-of-type{border-top:none}
.hours-row .h-d{color:var(--muted)}

/* ЗАГЛУШКА */
.stub{text-align:center;color:var(--muted);padding:50px 20px}
.stub svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}

/* ВИТРИНА ЗАЛОВ */
.zone-venue-tabs{display:flex;gap:8px;margin-bottom:16px}
.zone-venue-tabs button{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;padding:10px;font-size:14px;font-weight:700}
.zone-venue-tabs button.active{background:var(--emerald);color:#08130d;border-color:var(--emerald)}
.zone-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;margin-bottom:16px}
.zone-gallery{position:relative;width:100%;aspect-ratio:3/2;background:var(--panel2);overflow:hidden}
.zone-gallery .zg-track{display:flex;height:100%;transition:transform .3s ease;will-change:transform}
.zone-gallery .zg-slide{min-width:100%;height:100%;position:relative}
.zone-gallery .zg-slide img{width:100%;height:100%;object-fit:cover}
.zone-gallery .zg-nophoto{display:flex;align-items:center;justify-content:center;flex-direction:column;
  height:100%;color:var(--muted);gap:8px}
.zone-gallery .zg-nophoto svg{width:42px;height:42px;opacity:.35}
.zone-gallery .zg-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;
  border:none;border-radius:50%;background:rgba(13,15,18,.6);color:#fff;font-size:18px;display:flex;
  align-items:center;justify-content:center;backdrop-filter:blur(4px);z-index:2}
.zone-gallery .zg-prev{left:8px}.zone-gallery .zg-next{right:8px}
.zone-gallery .zg-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.zone-gallery .zg-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
.zone-gallery .zg-dot.on{background:#fff}
.zone-gallery .zg-count{position:absolute;top:8px;right:10px;background:rgba(13,15,18,.6);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px);z-index:2}
.zone-body{padding:14px}
.zone-body h3{margin:0 0 4px;font-size:18px;font-weight:800}
.zone-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.zone-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.zone-tag b{color:var(--text);font-weight:700}
.zone-tag .zt-ic{width:13px;height:13px}
.zone-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
.zone-book-btn{width:100%;border:1px solid var(--emerald);background:var(--emerald);color:#08130d;
  border-radius:11px;padding:13px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px}
.zone-book-btn svg{width:17px;height:17px}
.zone-note{font-size:11px;color:var(--gold);margin-top:-4px;margin-bottom:10px;font-weight:600}

/* НИЖНЯЯ НАВИГАЦИЯ */
#navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(13,15,18,.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto}
#navbar button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600}
#navbar button.active{color:var(--emerald)}
#navbar button svg{width:21px;height:21px}

function renderMenu(){
  const el = document.getElementById("sec-menu");
  const data = MENU_TAB==="bar" ? BAR_MENU : KITCHEN_MENU;
  let legend = "";
  if(MENU_TAB==="kitchen"){
    legend = `<div class="menu-legend">
      <span class="lg"><span class="bdg chef">${KITCHEN_BADGES.chef[LANG]}</span></span>
      <span class="lg"><span class="bdg hot">${KITCHEN_BADGES.hot[LANG]}</span></span>
      <span class="lg"><span class="bdg new">${KITCHEN_BADGES.new[LANG]}</span></span>
      <span class="lg"><span class="bdg veg">${KITCHEN_BADGES.veg[LANG]}</span></span>
    </div>`;
  }
  const cats = data.map((sec,ci)=>{
    const col = CAT_PALETTE[ci % CAT_PALETTE.length];
    const rows = sec.items.map(it=>{
      const badges = (it.b||[]).map(k=>`<span class="bdg ${k}">${KITCHEN_BADGES[k][LANG]}</span>`).join("");
      const price = it.p ? it.p : "—";
      return `<div class="mi"><div class="mi-n">${nm(it.n)}${badges?`<span class="mi-badges">${badges}</span>`:""}</div>
        <div class="mi-p ${it.p?'':'dash'}">${price}</div></div>`;
    }).join("");
    return `<div class="cat"><div class="cat-title" style="color:${col}"><span class="cat-bar" style="background:${col}"></span>${sec.cat[LANG]}</div>${rows}</div>`;
  }).join("");
  const note = MENU_TAB==="bar" ? `<div class="menu-note">${BAR_MENU_NOTE[LANG]}</div>` : "";
  el.innerHTML = `
    <div class="sec-head"><button class="back" data-go="home">←</button><h2>${t('menu_t')}</h2></div>
    <div class="menu-tabs">
      <button data-mt="bar" class="${MENU_TAB==='bar'?'active':''}">${t('tab_bar')}</button>
      <button data-mt="kitchen" class="${MENU_TAB==='kitchen'?'active':''}">${t('tab_kitchen')}</button>
    </div>
    ${legend}${cats}${note}`;
  el.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{MENU_TAB=b.dataset.mt;renderMenu();window.scrollTo(0,0);});
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

// ============ ВИТРИНА ЗАЛОВ ============
let ZONE_VENUE = "karaoke";          // какой набор зон показываем
const zgState = {};                  // индекс текущего слайда галереи по zoneId

function zoneImgPath(f){ return "img/" + f; }   // фото лежат в подпапке img/

function renderZones(){
  const el = document.getElementById("sec-zones");
  const Z = ZONE_DEP_NOTE;
  const zones = ZONE_VENUE === "karaoke" ? KARAOKE_ZONES : CLUB_ZONES;

  const cards = zones.map(z => {
    // галерея
    let gallery;
    if (z.imgs && z.imgs.length) {
      if (zgState[z.id] == null) zgState[z.id] = 0;
      const slides = z.imgs.map(f => `<div class="zg-slide"><img src="${zoneImgPath(f)}" alt="" loading="lazy"></div>`).join("");
      const dots = z.imgs.length > 1
        ? `<div class="zg-dots">${z.imgs.map((_,i)=>`<span class="zg-dot ${i===0?'on':''}" data-zd="${z.id}:${i}"></span>`).join("")}</div>` : "";
      const arrows = z.imgs.length > 1
        ? `<button class="zg-arrow zg-prev" data-zg="${z.id}:-1">‹</button><button class="zg-arrow zg-next" data-zg="${z.id}:1">›</button>` : "";
      const count = z.imgs.length > 1 ? `<div class="zg-count" id="zgc-${z.id}">1 / ${z.imgs.length}</div>` : "";
      gallery = `<div class="zone-gallery" id="zg-${z.id}">
        <div class="zg-track" id="zgt-${z.id}">${slides}</div>${arrows}${dots}${count}</div>`;
    } else {
      gallery = `<div class="zone-gallery"><div class="zg-nophoto">${KEYHOLE}<span>${Z.photos_soon[LANG]}</span></div></div>`;
    }

    // метки: вместимость + депозит «по запросу»
    const tags = [];
    if (z.cap && z.cap[LANG]) {
      tags.push(`<span class="zone-tag"><svg class="zt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 6a3 3 0 0 1 0 6M21 20c0-2.5-2-4-4-4.5"/></svg><b>${z.cap[LANG]}</b></span>`);
    }
    tags.push(`<span class="zone-tag">${Z.deposit[LANG]}: <b>${Z.request[LANG]}</b></span>`);

    const note = z.note ? `<div class="zone-note">${z.note[LANG]}</div>` : "";

    return `<div class="zone-card">
      ${gallery}
      <div class="zone-body">
        <h3>${z.name[LANG]}</h3>
        <div class="zone-meta">${tags.join("")}</div>
        ${note}
        <div class="zone-desc">${z.desc[LANG]}</div>
        <button class="zone-book-btn" data-zbook="${z.id}">${IC.book}${Z.book[LANG]}</button>
      </div>
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="sec-head"><button class="back" data-go="home">←</button><h2>${t('zones_t')}</h2></div>
    <div class="zone-venue-tabs">
      <button data-zv="karaoke" class="${ZONE_VENUE==='karaoke'?'active':''}">${t('karaoke')}</button>
      <button data-zv="club" class="${ZONE_VENUE==='club'?'active':''}">${t('club')}</button>
    </div>
    ${cards}`;

  // навигация разделов
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  // переключение заведения
  el.querySelectorAll("[data-zv]").forEach(b=>b.onclick=()=>{ZONE_VENUE=b.dataset.zv;renderZones();window.scrollTo(0,0);});
  // стрелки галереи
  el.querySelectorAll("[data-zg]").forEach(b=>b.onclick=()=>{
    const [id,dir] = b.dataset.zg.split(":");
    zgMove(id, parseInt(dir,10));
  });
  // точки галереи
  el.querySelectorAll("[data-zd]").forEach(d=>d.onclick=()=>{
    const [id,i] = d.dataset.zd.split(":");
    zgGo(id, parseInt(i,10));
  });
  // кнопка брони → пока ведёт в раздел брони (этап 3)
  el.querySelectorAll("[data-zbook]").forEach(b=>b.onclick=()=>{ go("book"); });
}

function zgCount(id){
  const zones = [...KARAOKE_ZONES, ...CLUB_ZONES];
  const z = zones.find(x=>x.id===id);
  return z && z.imgs ? z.imgs.length : 0;
}
function zgGo(id, i){
  const n = zgCount(id); if (n<=1) return;
  zgState[id] = (i + n) % n;
  const track = document.getElementById("zgt-"+id);
  if (track) track.style.transform = `translateX(-${zgState[id]*100}%)`;
  const c = document.getElementById("zgc-"+id);
  if (c) c.textContent = `${zgState[id]+1} / ${n}`;
  document.querySelectorAll(`[data-zd^="${id}:"]`).forEach((d,idx)=>d.classList.toggle("on", idx===zgState[id]));
}
function zgMove(id, dir){ zgGo(id, (zgState[id]||0) + dir); }

// ============ НАВИГАЦИЯ ============
const NAV = [
  {id:"home", key:"nav_home", ic:"home"},
  {id:"zones", key:"nav_zones", ic:"zones"},
  {id:"menu", key:"nav_menu", ic:"menu"},
  {id:"book", key:"nav_book", ic:"book"},
  {id:"location", key:"nav_where", ic:"where"},
];
let CUR = "home";
function renderNav(){
  const nb = document.getElementById("navbar");
  nb.innerHTML = NAV.map(n=>`<button data-go="${n.id}" class="${CUR===n.id?'active':''}">${IC[n.ic]}<span>${t(n.key)}</span></button>`).join("");
  nb.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){
  CUR = id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  const map = {home:"sec-home",zones:"sec-zones",menu:"sec-menu",book:"sec-book",location:"sec-location",contacts:"sec-contacts"};
  document.getElementById(map[id]).classList.add("active");
  renderNav();
  window.scrollTo(0,0);
}

// ============ ПЕРЕРИСОВКА ВСЕГО (при смене языка/заведения) ============
function renderAll(){
  renderHome();
  renderMenu();
  renderLocation();
  renderContacts();
  renderZones();
  renderStub("sec-book", t('book_t'));
  renderNav();
}

// язык
document.getElementById("lang-tabs").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
    LANG=b.dataset.l;
    document.getElementById("lang-tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.l===LANG));
    document.documentElement.lang=LANG;
    renderAll();
  };
});

// Telegram init
try{ const tg=window.Telegram&&window.Telegram.WebApp; if(tg){ tg.ready(); tg.expand(); } }catch(_){}

renderAll();

</script>
