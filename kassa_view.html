<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--smol);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

<body>

<div id="gate"><div class="g-logo">КАССА</div><div class="spin"></div><div class="g-msg" id="gateMsg">Проверка доступа…</div></div>

    <div><div class="lbl">Остаток в кассе</div><div class="sum" id="hdrSum">—</div></div>

  </div>

  <section class="tabpage on" id="tab-summary"></section>

<script>
/* ==== адрес защищённой функции (без ключей — доступ решает она сама) ==== */
const FN_URL = "https://wtncocptetgcjsumavev.supabase.co/functions/v1/kassa-view";

/* ===CALC_START=== расчёты кассы (дословно из kassa.html, проверено test_calc.js) ==== */
const DEBT_CATS = ["Долговой счет ГОСТИ","Долговой учред"];
const SAL_CATS = ["Зар.плата КАРАОКЕ","Зар.плата ОБЩАЯ","Зар.плата КЛУБ"];
const DOW = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
let S = { entries:[], days:{} };
let CATALOG = [];
function setData(s, catalog){ S = s || {entries:[],days:{}}; CATALOG = catalog || []; }
function normName(x){ return String(x).toUpperCase().replace(/[^А-ЯA-ZЁ0-9]/g,""); }
function staffNameSet(){ const st=new Set(); for(const c of CATALOG){ if(SAL_CATS.includes(c.cat)) st.add(normName(c.cp)); } return st; }
// «персонал» в долговых = зарплатный справочник + учредители (Долговой учред), как в кассе
function debtStaffSet(){ const st=staffNameSet(); for(const c of CATALOG){ if(c.cat==="Долговой учред") st.add(normName(c.cp)); } for(const e of S.entries){ if(!e.deleted && e.cat==="Долговой учред") st.add(normName(e.cp)); } return st; }
const fmt = n => (n<0?"−":"") + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
function shiftDate(iso, n){ const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function human(iso){ const d = new Date(iso+"T12:00:00"); return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]; }
function humanDM(iso){ const d = new Date(iso+"T12:00:00"); return d.getDate()+" "+MON[d.getMonth()]; }
function humanDOW(iso){ const d = new Date(iso+"T12:00:00"); return DOW[d.getDay()]; }
function bizToday(){ const d = new Date(Date.now() - 17*3600*1000); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayEntries(iso){ return S.entries.filter(e=>e.bizDate===iso && !e.deleted); }
function daySums(iso){ let inn=0,out=0; for(const e of dayEntries(iso)){ if(e.method==="card") continue; if(e.type==="in") inn+=e.amount; else out+=e.amount; } return {inn,out}; }
function openingOf(iso){ if(!S.openingSet) return 0; if(iso < S.firstDate) return 0; let bal = S.firstOpening, d = S.firstDate; while(d < iso){ const day = S.days[d]; if(day && day.closed){ bal = day.fact; } else { const s = daySums(d); bal = bal + s.inn - s.out; } d = shiftDate(d,1); } return bal; }
function currentBalance(iso){ const s = daySums(iso); return openingOf(iso) + s.inn - s.out; }
function dayInClean(iso){ let inn=0; for(const e of dayEntries(iso)){ if(e.type!=="in" || e.method==="card" || e.kind==="cardfix") continue; inn+=e.amount; } return inn; }
function dayInAll(iso){ let inn=0; for(const e of dayEntries(iso)){ if(e.type!=="in" || e.kind==="cardfix") continue; inn+=e.amount; } return inn; }
function daySpendBreakdown(iso){ let nal=0, beznal=0, card=0; for(const e of dayEntries(iso)){ if(e.type!=="out" || e.kind==="cardfix") continue; if(e.method==="card"){ card+=e.amount; continue; } if(e.cat==="Без.нал"){ beznal+=e.amount; continue; } nal+=e.amount; } return {nal, beznal, card, total: nal+beznal+card}; }
function cardDaySum(iso){ let v=0; for(const e of dayEntries(iso)){ if(e.method!=="card") continue; v += (e.type==="in"? e.amount : -e.amount); } return v; }
function cardOpeningOf(iso){ if(!S.openingSet) return 0; if(iso <= S.firstDate) return S.cardStart || 0; let bal = S.cardStart || 0, d = S.firstDate; while(d < iso){ const day = S.days[d]; if(day && day.closed && day.cardFact!==undefined){ bal = day.cardFact; } else { bal = bal + cardDaySum(d); } d = shiftDate(d,1); } return bal; }
function cardBalance(iso){ if(!S.openingSet) return 0; if(iso && iso < S.firstDate) return 0; return cardOpeningOf(iso) + cardDaySum(iso); }
function debtBalance(cp){ let bal = 0; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || e.cp!==cp) continue; bal += (e.type==="out"? e.amount : -e.amount); } return bal; }
function openDebts(cp){ const acc = {}; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || e.cp!==cp || !e.orderNo) continue; if(!acc[e.orderNo]) acc[e.orderNo] = {orderNo:e.orderNo, cat:e.cat, out:0, inn:0, date:e.bizDate}; if(e.type==="out"){ acc[e.orderNo].out += e.amount; if(e.bizDate<acc[e.orderNo].date) acc[e.orderNo].date=e.bizDate; } else acc[e.orderNo].inn += e.amount; } return Object.values(acc).map(a=>({...a, left: a.out-a.inn})).filter(a=>a.left>0).sort((a,b)=>a.date.localeCompare(b.date)); }
function debtTotalsSplit(mk){ const st = debtStaffSet(); const seen = new Set(); const r = {staffCur:0, staffOld:0, guestCur:0, guestOld:0}; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || seen.has(e.cp)) continue; seen.add(e.cp); const isStaff = st.has(normName(e.cp)); for(const o of openDebts(e.cp)){ const cur = o.date.slice(0,7)===mk; if(isStaff){ if(cur) r.staffCur+=o.left; else r.staffOld+=o.left; } else { if(cur) r.guestCur+=o.left; else r.guestOld+=o.left; } } } return r; }
function debtList(){ const st = debtStaffSet(); const seen = new Set(); const out = []; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || seen.has(e.cp)) continue; seen.add(e.cp); const bal = debtBalance(e.cp); if(bal<=0) continue; const open = openDebts(e.cp); const note = open.length ? ("счетов: "+open.length+" · с "+open[0].date) : ""; out.push({cp:e.cp, isStaff: st.has(normName(e.cp)), bal, note}); } return out.sort((a,b)=>b.bal-a.bal); }
function bankAnchor(){ if(!S.bank) return null; const ch = (S.bank.checks||[]); return ch.length ? ch[ch.length-1] : {date:S.bank.startDate, amount:S.bank.startAmount}; }
function bankFlows(afterDate){ let uz=0,humo=0,rah=0,qr=0,inkass=0,other=0,ret=0; for(const e of S.entries){ if(e.deleted || e.cat!=="Без.нал" || e.bizDate<=afterDate) continue; const n = normName(e.cp); if(e.type==="in"){ ret += e.amount; continue; } if(n.includes("ИНКАССАЦ")) inkass+=e.amount; else if(n.includes("QR")) qr+=e.amount; else if(n.includes("RAHMAT")||n.includes("РАХМАТ")) rah+=e.amount; else if(n.includes("HUMO")||n.includes("ХУМО")) humo+=e.amount; else if(n.includes("UZCARD")||n.includes("УЗКАРД")) uz+=e.amount; else other+=e.amount; } let pays=0; for(const p of ((S.bank&&S.bank.payments)||[])){ if(p.date>afterDate) pays+=p.amount; } let rcv=0; for(const r of ((S.bank&&S.bank.receipts)||[])){ if(r.date>afterDate) rcv+=r.amount; } const fee = Math.round(uz*0.01)+Math.round(humo*0.01)+Math.round((rah+other)*0.015)+Math.round(qr*0.0065); return {uz,humo,rah,qr,inkass,other,ret,pays,rcv,fee}; }
function bankBalance(){ const a = bankAnchor(); if(!a) return null; const f = bankFlows(a.date); return a.amount + f.uz + f.humo + f.rah + f.qr + f.other + f.inkass + f.rcv - f.ret - f.pays - f.fee; }
function bankAgg(entryPred, payPred){ let uz=0,humo=0,rah=0,qr=0,inkass=0,other=0,ret=0; for(const e of S.entries){ if(e.deleted || e.cat!=="Без.нал" || !entryPred(e)) continue; const n=normName(e.cp); if(e.type==="in"){ ret+=e.amount; continue; } if(n.includes("ИНКАССАЦ")) inkass+=e.amount; else if(n.includes("QR")) qr+=e.amount; else if(n.includes("RAHMAT")||n.includes("РАХМАТ")) rah+=e.amount; else if(n.includes("HUMO")||n.includes("ХУМО")) humo+=e.amount; else if(n.includes("UZCARD")||n.includes("УЗКАРД")) uz+=e.amount; else other+=e.amount; } let pays=0; for(const p of ((S.bank&&S.bank.payments)||[])){ if(payPred(p)) pays+=p.amount; } let rcv=0; for(const r of ((S.bank&&S.bank.receipts)||[])){ if(payPred(r)) rcv+=r.amount; } const fee=Math.round(uz*0.01)+Math.round(humo*0.01)+Math.round((rah+other)*0.015)+Math.round(qr*0.0065); const net=uz+humo+rah+qr+other+inkass+rcv - ret - pays - fee; return {uz,humo,rah,qr,inkass,other,ret,pays,rcv,fee,net}; }
function bankDaySummary(iso){ return bankAgg(e=>e.bizDate===iso, p=>p.date===iso); }
function bankBalanceAsOf(iso){ const a=bankAnchor(); if(!a) return null; if(iso<a.date) return a.amount; const f=bankAgg(e=>e.bizDate>a.date&&e.bizDate<=iso, p=>p.date>a.date&&p.date<=iso); return a.amount+f.net; }
function latestBizDate(){ let mx=null; for(const e of S.entries){ if(!e.deleted && (!mx || e.bizDate>mx)) mx=e.bizDate; } for(const d in S.days){ if(!mx || d>mx) mx=d; } return mx; }
/* ===CALC_END=== */

/* ==== строки БД -> вид приложения (по meta, без ключей) ==== */
function rowToEntry(r){ const m=r.meta||{}; const e={id:r.id,bizDate:r.biz_date,cat:(m.cat||""),cp:(m.cp||""),type:r.type,amount:Number(r.amount),note:r.note||"",orderNo:r.order_no||"",by:r.created_by||"",ts:r.created_at||undefined}; if(r.method)e.method=r.method; if(r.kind)e.kind=r.kind; if(m.time)e.time=m.time; if(r.deleted)e.deleted=true; if(m.backdated)e.backdated=m.backdated; return e; }
function rowToDay(r){ const d={closed:!!r.closed}; if(r.fact!=null)d.fact=Number(r.fact); if(r.card_fact!=null)d.cardFact=Number(r.card_fact); if(r.closed_by)d.by=r.closed_by; if(r.closed_at)d.closedAt=r.closed_at; return d; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ==== загрузка через Telegram ==== */
let VD = null, GEN = null, ROLE = "admin", MYSAL = null, VIEWERCP = "", SEL = null;
async function boot(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#120d06"); }catch(e){} }
  const initData = tg && tg.initData;
  if(!initData){ return decoy(); }               // открыли в браузере / вне Telegram
  try{
    const res = await fetch(FN_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({initData}) });
    if(res.status===401 || res.status===403){ return decoy(); }  // нет доступа — показываем календарь
    if(!res.ok){ return decoy(); }               // серверная ошибка — тоже не раскрываем кассу
    const data = await res.json();
    hydrate(data);
    show();
    renderAll();
  }catch(e){ decoy(); }                           // нет связи — календарь
}
/* ==== нейтральная заглушка-календарь ==== */
let _calM = null;
function decoy(){
  const g = document.getElementById("gate");
  for(const id of ["hdr","main","nav"]){ const el=document.getElementById(id); if(el) el.style.display="none"; }
  const now = new Date();
  if(!_calM) _calM = { y: now.getFullYear(), m: now.getMonth() };
  g.className = "decoy"; g.style.display = "flex";
  g.innerHTML = calHtml();
  try{ document.title = "Календарь"; }catch(e){}
  try{ const tg=window.Telegram&&window.Telegram.WebApp; tg&&tg.setHeaderColor&&tg.setHeaderColor("#eef0f3"); }catch(e){}
}
function calHtml(){
  const now = new Date();
  const MN = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  const y=_calM.y, m=_calM.m;
  let start=new Date(y,m,1).getDay(); start=(start+6)%7;         // с понедельника
  const daysIn=new Date(y,m+1,0).getDate();
  const isCur=(y===now.getFullYear() && m===now.getMonth());
  let cells="";
  for(let i=0;i<start;i++) cells+='<div class="cd empty"></div>';
  for(let d=1;d<=daysIn;d++){
    const wd=(start+d-1)%7; const wknd=(wd>=5);
    const t=isCur && d===now.getDate();
    cells+='<div class="cd'+(t?" today":(wknd?" wknd":""))+'">'+d+'</div>';
  }
  return '<div class="calwrap"><div class="calcard">'+
    '<div class="calapp">Календарь</div>'+
    '<div class="calhead"><button onclick="decoyNav(-1)">‹</button>'+
      '<div class="caltitle">'+MN[m]+' '+y+'</div>'+
      '<button onclick="decoyNav(1)">›</button></div>'+
    '<div class="calgrid calwd">'+WD.map(w=>'<div class="cw">'+w+'</div>').join("")+'</div>'+
    '<div class="calgrid">'+cells+'</div>'+
    '</div></div>';
}
function decoyNav(delta){
  _calM.m+=delta;
  if(_calM.m<0){ _calM.m=11; _calM.y--; }
  if(_calM.m>11){ _calM.m=0; _calM.y++; }
  document.getElementById("gate").innerHTML = calHtml();
}
function hydrate(data){
  const s = { entries:[], days:{} };
  if(data.setup) Object.assign(s, data.setup);
  if(data.appstate) Object.assign(s, data.appstate);
  s.entries = (data.entries||[]).map(rowToEntry);
  s.days = {}; for(const r of (data.days||[])) s.days[r.biz_date]=rowToDay(r);
  setData(s, data.catalog||[]);
  VD = latestBizDate();
  SEL = VD;
  GEN = data.generatedAt;
  ROLE = data.role || "admin";
  MYSAL = data.mySalary || null;
  VIEWERCP = data.viewerCp || "";
  const roName = {admin:"админ", upr:"управляющий", dir:"директор"}[ROLE] || ROLE;
  document.getElementById("roBadge").textContent = "🔒 просмотр · " + roName;
}
function gate(msg){ document.getElementById("gate").innerHTML = '<div class="g-logo">КАССА</div><div class="g-msg">'+esc(msg)+'</div>'; }
function show(){ document.getElementById("gate").style.display="none"; for(const id of ["hdr","main","nav"]) document.getElementById(id).style.display=""; }

/* ==== рендер ==== */
function renderAll(){
  buildNav();
  const gd = GEN ? new Date(GEN) : null;
  if(ROLE==="admin"){
    if(!VD){ gate("Данных пока нет — касса ещё не закрывала смены."); return; }
    const nal = currentBalance(VD), card = cardBalance(VD);
    document.getElementById("hdrSum").textContent = fmt(nal+card);
    document.getElementById("hdrNal").innerHTML = 'нал <b style="color:var(--cream)">'+fmt(nal)+'</b>';
    document.getElementById("hdrCard").innerHTML = 'карта <b style="color:var(--cream)">'+fmt(card)+'</b>';
    document.getElementById("asof").textContent = "данные на последнюю закрытую смену · "+human(VD)+(gd?" · обновлено "+gd.toLocaleString("ru-RU"):"");
    renderSummary(); renderKassa(); renderBank(); renderDebts();
  } else {
    // upr/dir — только долги и своя ЗП, остатки кассы в шапке НЕ показываем
    const hb = document.querySelector('#hdr .hdr-bal'); if(hb) hb.style.display='none';
    const who = VIEWERCP ? " · "+esc(VIEWERCP) : "";
    document.getElementById("asof").innerHTML = "долги персонала и гостей + ваша зарплата"+who+(gd?" · обновлено "+esc(gd.toLocaleString("ru-RU")):"");
    renderDebts(); renderSalary();
  }
}
function renderSummary(){
  const d=SEL||VD;
  const nal=currentBalance(d), card=cardBalance(d), sp=daySpendBreakdown(d), inn=dayInAll(d);
  const mk=d.slice(0,7), ds=debtTotalsSplit(mk);
  const staff=ds.staffCur+ds.staffOld, guest=ds.guestCur+ds.guestOld;
  const guestCount = debtList().filter(x=>!x.isStaff).length;
  const bank=bankBalance(); const a=bankAnchor(); const f=a?bankFlows(a.date):null;
  const term = f?(f.uz+f.humo+f.rah+f.qr+f.other+f.inkass):0;
  document.getElementById("tab-summary").innerHTML =
    dayNavHtml()+
    '<div class="sect">Смена за день</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="t">Приход</div><div class="v in">+'+fmt(inn)+'</div><div class="s">касса + карта</div></div>'+
      '<div class="kpi"><div class="t">Расход</div><div class="v out">−'+fmt(sp.total)+'</div><div class="s">нал '+fmt(sp.nal)+' · карта '+fmt(sp.card)+' · безнал '+fmt(sp.beznal)+'</div></div>'+
      '<div class="kpi wide"><div class="t">Всего в кассе</div><div class="v" style="color:var(--gold)">'+fmt(nal+card)+'</div><div class="s">нал '+fmt(nal)+' · карта '+fmt(card)+'</div></div>'+
    '</div>'+
    '<div class="sect">Долги — открыто</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="t">Персонал</div><div class="v" style="color:'+(staff?'var(--warn)':'var(--ash)')+'">'+fmt(staff)+'</div><div class="s">этот месяц '+fmt(ds.staffCur)+' · прошлые '+fmt(ds.staffOld)+'</div></div>'+
      '<div class="kpi"><div class="t">Гости</div><div class="v" style="color:'+(guest?'var(--warn)':'var(--ash)')+'">'+fmt(guest)+'</div><div class="s">открытых счетов: '+guestCount+'</div></div>'+
    '</div>'+
    '<div class="sect">Безнал — счёт</div>'+
    '<div class="kpi wide"><div class="t">Расчётный остаток на счёте</div><div class="v" style="color:'+(bank==null?'var(--ash)':'var(--gold)')+'">'+(bank==null?'не настроен':'≈ '+fmt(bank))+'</div>'+
      (f?'<div class="s">с последней сверки: терминалы +'+fmt(term)+' · платежи −'+fmt(f.pays)+'</div>':'')+'</div>';
}
function methodBadge(e){ if(e.cat==="Без.нал"||e.cat==="Излишки и недостачи"||DEBT_CATS.includes(e.cat)) return ""; return e.method==="card"?'<span class="badge card">КАРТА</span>':'<span class="badge cash">НАЛ</span>'; }
function rowHtml(e){
  const parts=[e.cat]; if(e.orderNo)parts.push("счёт №"+e.orderNo); if(e.note)parts.push(e.note); if(e.time)parts.push(e.time); if(e.by)parts.push(e.by);
  return '<div class="row '+(e.type==="in"?"r-in":"r-out")+'"><div class="who">'+esc(e.cp)+methodBadge(e)+'<small>'+esc(parts.join(" · "))+'</small></div>'+
    '<div class="amt '+e.type+'">'+(e.type==="in"?"+":"−")+fmt(e.amount)+'</div></div>';
}
function renderKassa(){
  const d=SEL||VD;
  const es=dayEntries(d).slice().reverse();
  const inn=dayInAll(d), out=daySpendBreakdown(d).total, closed=S.days[d]&&S.days[d].closed;
  let html=dayNavHtml()+
    '<div class="dayhead" style="justify-content:center;padding-top:0"><span class="dsum">прих. <span class="in">+'+fmt(inn)+'</span> · расх. <span class="out">−'+fmt(out)+'</span>'+(closed?' <span class="locked">закрыт</span>':'')+'</span></div>';
  html += es.length ? '<div class="rows">'+es.map(rowHtml).join("")+'</div>' : '<div class="empty">Нет операций за этот день.</div>';
  document.getElementById("tab-kassa").innerHTML=html;
}
/* рамка-дата со стрелками (как в кассе): по умолчанию свежий день, кнопка «сегодня» */
function dayNavHtml(){
  const d=SEL||VD; const isToday=(d===bizToday());
  return '<div class="daynav">'+
    '<button class="dn-arrow" onclick="navDay(-1)">◀</button>'+
    '<div class="datebox"><b>'+humanDM(d)+'</b><span>'+humanDOW(d)+(isToday?' · сегодня':'')+'</span></div>'+
    '<div class="dn-right">'+
      (isToday?'':'<button class="dn-today" onclick="navToday()">сегодня</button>')+
      '<button class="dn-arrow" onclick="navDay(1)">▶</button>'+
    '</div></div>';
}
function navDay(delta){ SEL=shiftDate(SEL||VD, delta); renderSummary(); renderKassa(); renderBank(); }
function navToday(){ SEL=bizToday(); renderSummary(); renderKassa(); renderBank(); }
function renderBank(){
  const box=document.getElementById("tab-bank");
  if(!S.bank||!S.bank.startDate){ box.innerHTML='<div class="empty">Безналичный счёт не настроен в кассе.</div>'; return; }
  const d=SEL||VD;
  const ds=bankDaySummary(d), balEnd=bankBalanceAsOf(d);
  const inSum=ds.uz+ds.humo+ds.rah+ds.qr+ds.inkass+ds.other+ds.rcv;
  const outSum=ds.pays+ds.fee+ds.ret;
  const L=(t,v,c)=>'<div class="l"><div>'+t+'</div><b class="'+c+'">'+(c==="in"?"+":"−")+fmt(v)+'</b></div>';
  const dayPays=((S.bank.payments)||[]).filter(p=>p.date===d).slice().reverse();
  const dayRcv=((S.bank.receipts)||[]).filter(r=>r.date===d).slice().reverse();
  let html=dayNavHtml()+
    '<div class="sect" style="color:var(--in);margin-top:2px">Приход за день</div>'+
    '<div class="card-wrap calc">'+
      L('Терминал Uzcard',ds.uz,'in')+L('Терминал Humo',ds.humo,'in')+L('Терминал Rahmat',ds.rah,'in')+L('Терминал · QR',ds.qr,'in')+L('Инкассация',ds.inkass,'in')+
      (ds.other?L('Прочие терминалы',ds.other,'in'):'')+
      (ds.rcv?L('Приход на счёт',ds.rcv,'in'):'')+
      '<div class="l gold"><div>Итого приход</div><b class="in">+'+fmt(inSum)+'</b></div>'+
    '</div>'+
    '<div class="sect" style="color:var(--out)">Расход за день</div>'+
    '<div class="card-wrap calc">'+
      L('Платежи со счёта',ds.pays,'out')+
      L('Комиссия за день',ds.fee,'out')+
      (ds.ret?L('Возвраты по безналу',ds.ret,'out'):'')+
      '<div class="l gold"><div>Итого расход</div><b class="out">−'+fmt(outSum)+'</b></div>'+
    '</div>'+
    '<div class="card-wrap calc"><div class="l gold"><div>Итого за день (приход − расход)</div><b style="color:'+(ds.net<0?'var(--out)':'var(--in)')+'">'+(ds.net<0?"−":"+")+fmt(Math.abs(ds.net))+'</b></div></div>'+
    '<div class="kpi wide" style="border:2px solid var(--gold);background:rgba(232,201,122,.08);margin-top:10px"><div class="t" style="color:var(--gold)">Должно быть на счёте · на конец дня</div><div class="v" style="color:var(--gold)">≈ '+fmt(balEnd)+'</div></div>';
  if(dayPays.length) html+='<div class="sect">Платежи со счёта за день</div><div class="rows">'+dayPays.map(p=>'<div class="row r-out"><div class="who">'+esc(p.category||"платёж")+(p.payee?' · '+esc(p.payee):'')+'<small>'+esc(p.date)+(p.note?' · '+esc(p.note):'')+'</small></div><div class="amt out">−'+fmt(p.amount)+'</div></div>').join("")+'</div>';
  if(dayRcv.length) html+='<div class="sect">Приходы на счёт за день</div><div class="rows">'+dayRcv.map(r=>'<div class="row r-in"><div class="who">'+(r.from?esc(r.from):"Приход на счёт")+'<small>'+esc(r.date)+(r.note?' · '+esc(r.note):'')+'</small></div><div class="amt in">+'+fmt(r.amount)+'</div></div>').join("")+'</div>';
  box.innerHTML=html;
}
let debtKind="staff";
function renderDebts(){
  const list=debtList();
  const staff=list.filter(d=>d.isStaff), guest=list.filter(d=>!d.isStaff);
  const sT=staff.reduce((s,d)=>s+d.bal,0), gT=guest.reduce((s,d)=>s+d.bal,0);
  const cur=debtKind==="staff"?staff:guest;
  document.getElementById("tab-debts").innerHTML =
    '<div class="pill-tabs">'+
      '<button class="'+(debtKind==="staff"?"on":"")+'" onclick="setDebt(\'staff\')">Персонал · '+fmt(sT)+'</button>'+
      '<button class="'+(debtKind==="guest"?"on":"")+'" onclick="setDebt(\'guest\')">Гости · '+fmt(gT)+'</button>'+
    '</div>'+
    '<div class="rows">'+(cur.length?cur.map(d=>'<div class="row r-out"><div class="who">'+esc(d.cp)+'<small>'+esc(d.note||"долг")+'</small></div><div class="amt out">−'+fmt(d.bal)+'</div></div>').join(""):'<div class="empty">Открытых долгов нет.</div>')+'</div>';
}
function setDebt(k){ debtKind=k; renderDebts(); }

/* ==== своя ЗП (для upr/dir) — итоги считает сервер, тут только показ ==== */
function renderSalary(){
  const box=document.getElementById("tab-salary");
  if(!MYSAL){ box.innerHTML='<div class="empty">Данные по зарплате недоступны.</div>'; return; }
  const s=MYSAL, mk=(GEN?String(GEN):"").slice(0,7);
  const parts=(s.parts||[]).filter(p=>p.amount);
  const rest=s.rest;
  box.innerHTML =
    '<div class="sect">Моя зарплата'+(mk?' · '+mk:'')+'</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="t">Начислено за месяц</div><div class="v" style="color:var(--gold)">'+fmt(s.accrued)+'</div>'+
        ((s.parts&&s.parts.length>1)?'<div class="s">'+s.parts.map(p=>esc(p.label)+' '+fmt(p.amount)).join(' · ')+'</div>':'')+'</div>'+
      '<div class="kpi"><div class="t">Выплачено</div><div class="v in">'+fmt(s.paid)+'</div><div class="s">'+(s.advance?'в т.ч. аванс '+fmt(s.advance):'')+'</div></div>'+
    '</div>'+
    '<div class="sect">К выплате</div>'+
    '<div class="card-wrap calc">'+
      '<div class="l"><div>Начислено</div><b>'+fmt(s.accrued)+'</b></div>'+
      '<div class="l"><div>Выплачено в этом месяце</div><b class="in">−'+fmt(s.paid)+'</b></div>'+
      (s.dm?'<div class="l"><div>Мои долги/заказы (этот месяц)</div><b class="out">−'+fmt(s.dm)+'</b></div>':'')+
      '<div class="l gold"><div>Остаток к выплате</div><b style="color:'+(rest<0?'var(--out)':'var(--gold)')+'">'+fmt(rest)+'</b></div>'+
    '</div>'+
    (s.orderDebt>0?'<div class="sect">Общий долг (заказы + аванс)</div><div class="kpi wide"><div class="t">Всего за мной</div><div class="v" style="color:var(--warn)">'+fmt(s.orderDebt)+'</div><div class="s">накопительно по всем месяцам</div></div>':'');
}

/* ==== нижняя навигация под роль ==== */
const NAV_ADMIN = [
  {id:"summary",ic:"◈",label:"Сводка"},
  {id:"kassa",ic:"▤",label:"Касса"},
  {id:"bank",ic:"▧",label:"Безнал"},
  {id:"debts",ic:"▨",label:"Долги"},
];
const NAV_LIMITED = [
  {id:"debts",ic:"▨",label:"Долги"},
  {id:"salary",ic:"◉",label:"Моя ЗП"},
];
function buildNav(){
  const items = ROLE==="admin" ? NAV_ADMIN : NAV_LIMITED;
  const nav=document.getElementById("nav");
  nav.innerHTML = items.map((it,i)=>'<button data-tab="'+it.id+'"'+(i===0?' class="on"':'')+'><span class="ic">'+it.ic+'</span>'+it.label+'</button>').join("");
  nav.querySelectorAll('button').forEach(b=>{ b.onclick=()=>setTab(b.dataset.tab); });
  setTab(items[0].id);
}
function setTab(id){
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on', x.dataset.tab===id));
  document.querySelectorAll('.tabpage').forEach(p=>p.classList.toggle('on', p.id==='tab-'+id));
  window.scrollTo(0,0);
}

boot();
</script>
