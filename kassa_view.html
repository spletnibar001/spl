
<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0A08">
<title>Касса · просмотр</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--smol:#0B0A08;--panel:#161209;--panel2:#1D1810;--line:#2C2517;--gold:#E8C97A;--gold-dim:#B89A54;--cream:#F3ECDA;--ash:#988D75;--in:#8FD49B;--out:#E8735A;--warn:#E8A34A;--alert:#E25A5A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%}
body{min-height:100%;background:var(--smol);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.in{color:var(--in)}.out{color:var(--out)}.warn{color:var(--warn)}.alert{color:var(--alert)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1a1409,#120d06);border-bottom:1px solid #4A3D20;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
.hdr-top{display:flex;align-items:center;gap:8px}
.logo{font-weight:800;letter-spacing:.25em;color:var(--gold);font-size:14px}
.ro{margin-left:auto;font-size:10.5px;color:var(--ash);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.hdr-bal{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between}
.hdr-bal .lbl{font-size:11px;color:var(--gold-dim);letter-spacing:.08em;text-transform:uppercase}
.hdr-bal .sum{font-size:29px;font-weight:800;color:var(--gold);line-height:1;text-shadow:0 0 22px rgba(232,201,122,.22)}
.hdr-bal .split{font-size:11px;color:var(--ash);margin-top:4px}
.asof{font-size:10.5px;color:var(--ash);margin-top:8px}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.tabpage{display:none}.tabpage.on{display:block}
.sect{font-size:11px;color:var(--gold-dim);letter-spacing:.12em;text-transform:uppercase;margin:18px 4px 8px}
.sect:first-child{margin-top:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .t{font-size:10.5px;color:var(--ash);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:800;margin-top:6px;line-height:1.05}
.kpi .s{font-size:11px;color:var(--ash);margin-top:6px;line-height:1.5}
.kpi.wide{grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.r-in{border-left-color:var(--in)}.row.r-out{border-left-color:rgba(232,115,90,.75)}
.row .who{font-weight:600;font-size:14px;line-height:1.3}
.row .who small{display:block;font-size:11px;color:var(--ash);font-weight:500;margin-top:3px}
.row .amt{font-weight:800;font-size:15px;white-space:nowrap}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;color:var(--ash)}
.badge.card{border-color:#3a4a5a;color:#8fb3d4}.badge.cash{border-color:#4a3d20;color:var(--gold-dim)}
.daygroup{margin-bottom:6px}
.dayhead{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:space-between;align-items:baseline;padding:6px 6px 8px;font-size:12px}
.dayhead b{color:var(--cream);font-weight:700}.dayhead .dsum{color:var(--ash);font-size:11.5px}
.locked{font-size:10px;color:var(--in);border:1px solid rgba(143,212,155,.3);border-radius:20px;padding:1px 8px}
.daynav{display:flex;align-items:center;gap:9px;margin:4px 0 14px}
.daynav .dn-arrow{background:var(--panel2);border:1px solid var(--line);color:var(--gold);border-radius:12px;width:44px;height:46px;font-size:15px;flex:none}
.datebox{flex:1;text-align:center;border:1.5px solid var(--gold-dim);border-radius:14px;padding:6px 8px;background:rgba(232,201,122,.06);min-width:0}
.datebox b{display:block;color:var(--gold);font-size:16px;font-weight:800;line-height:1.15}
.datebox span{display:block;color:var(--ash);font-size:11.5px;margin-top:1px}
.dn-right{display:flex;gap:8px;align-items:center;flex:none}
.dn-today{background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);border-radius:12px;padding:0 12px;height:46px;font-size:12px;font-weight:600;white-space:nowrap}
.revchip{border:1px solid var(--gold-dim);border-radius:9px;padding:6px 10px;font-size:11px;color:var(--gold-dim);line-height:1.25;letter-spacing:.02em}
.revchip b{display:block;color:var(--cream);font-weight:800;font-size:15px;margin-top:2px}
.rline{font-size:12px;color:var(--ash);line-height:1.7}
.rline b{color:var(--cream);font-weight:700}
/* экран расходов */
.exrev{display:flex;gap:8px}
.exrev .card{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--panel2)}
.exrev .card.kar{border-color:#c79a4a}.exrev .card.club{border-color:#5f7fa0}
.exrev .t{font-size:10.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.04em}
.exrev .v{font-size:clamp(12px,3.5vw,17px);font-weight:800;color:var(--cream);margin-top:4px;white-space:nowrap}
.exhero{text-align:center;margin:8px 0 2px}
.exhero .lbl{font-size:11px;color:var(--gold-dim);letter-spacing:.08em;text-transform:uppercase}
.exhero .sum{font-size:28px;font-weight:800;color:var(--out);line-height:1.05;margin-top:3px}
.exdonut{display:flex;justify-content:center;margin:6px 0 2px}
.exlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.grp{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.grp-top{display:flex;align-items:center;gap:9px;cursor:pointer}
.gdot{width:11px;height:11px;border-radius:3px;flex:none}
.chev{color:var(--ash);font-size:11px;transition:transform .15s;width:12px;flex:none}
.grp.open .chev{transform:rotate(90deg)}
.grp-name{font-weight:700;font-size:14px;color:var(--cream)}
.grp-pct{margin-left:auto;font-size:12px;color:var(--ash);font-weight:600}
.grp-amt{font-weight:800;font-size:15px;color:var(--cream);margin-left:10px}
.gtrack{height:8px;border-radius:5px;background:#241d10;overflow:hidden;margin-top:9px}
.gtrack > span{display:block;height:100%;border-radius:5px}
.gdetail{display:none;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.grp.open .gdetail{display:block}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-size:13px}
.drow .nm{color:var(--ash)}.drow b{color:var(--cream);font-weight:700;white-space:nowrap}
.drow .cnt{font-size:10.5px;color:var(--gold-dim);margin-left:6px}
.fotsplit{display:flex;gap:7px;margin-bottom:8px}
.fotsplit .fc{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
.fotsplit .fc .k{font-size:9.5px;color:var(--ash);text-transform:uppercase}
.fotsplit .fc .a{font-size:12.5px;font-weight:800;color:var(--cream);margin-top:2px}
.subhdr{font-size:10.5px;color:var(--gold-dim);letter-spacing:.08em;text-transform:uppercase;margin:4px 0 2px}
.bar{height:8px;border-radius:6px;background:#241d10;overflow:hidden;display:flex;margin-top:8px}
.bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--ash)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.calc .l{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;color:var(--ash);border-bottom:1px solid #201a10}
.calc .l:last-child{border-bottom:none}.calc .l b{color:var(--cream);font-weight:600}
.calc .l.gold b{color:var(--gold);font-weight:800;font-size:16px}
.card-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.pill-tabs{display:flex;gap:8px;margin:4px 4px 12px;overflow-x:auto}
.pill-tabs button{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--ash);border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600}
.pill-tabs button.on{background:#221B0E;border-color:var(--gold-dim);color:var(--gold)}
.empty{color:var(--ash);font-size:13px;text-align:center;padding:24px 12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(18,13,6,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--ash);padding:10px 0 12px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button .ic{font-size:20px;line-height:1}nav button.on{color:var(--gold)}
#gate{position:fixed;inset:0;background:var(--smol);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center}
#gate .g-logo{font-family:serif;letter-spacing:.3em;color:var(--gold);font-size:20px}
#gate .g-msg{color:var(--ash);font-size:14px;line-height:1.6;max-width:320px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* нейтральная заглушка-календарь (для тех, у кого нет доступа) */
.decoy{background:#eef0f3!important;align-items:flex-start!important;justify-content:center!important;padding:0!important;overflow:auto}
.calwrap{width:100%;max-width:430px;padding:26px 16px;box-sizing:border-box}
.calcard{background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.09);padding:20px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1c1c1e}
.calapp{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8e8e93;font-weight:700;text-align:center;margin-bottom:12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.caltitle{font-size:18px;font-weight:700;color:#1c1c1e}
.calhead button{width:40px;height:40px;border:none;background:#f0f0f3;border-radius:11px;font-size:22px;line-height:1;color:#3a3a3c}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwd{margin-bottom:4px}
.cw{text-align:center;font-size:12px;color:#8e8e93;font-weight:600;padding:4px 0}
.cd{text-align:center;padding:0;height:38px;line-height:38px;font-size:14.5px;color:#1c1c1e;border-radius:50%}
.cd.wknd{color:#c23b34}
.cd.empty{visibility:hidden}
.cd.today{background:#ff3b30;color:#fff;font-weight:700}
.calnote{text-align:center;color:#8e8e93;font-size:12.5px;margin-top:14px}
</style></head>
<body>

<div id="gate" class="decoy"></div>

<header style="display:none" id="hdr">
  <div class="hdr-top"><span class="logo">КАССА</span><span class="ro" id="roBadge">🔒 просмотр</span></div>
  <div class="hdr-bal">
    <div><div class="lbl">Остаток в кассе</div><div class="sum" id="hdrSum">—</div></div>
    <div style="text-align:right"><div class="split" id="hdrNal"></div><div class="split" id="hdrCard"></div></div>
  </div>
  <div class="asof" id="asof"></div>
</header>

<main style="display:none" id="main">
  <section class="tabpage on" id="tab-summary"></section>
  <section class="tabpage" id="tab-kassa"></section>
  <section class="tabpage" id="tab-bank"></section>
  <section class="tabpage" id="tab-debts"></section>
  <section class="tabpage" id="tab-salary"></section>
  <section class="tabpage" id="tab-expenses"></section>
</main>

<nav style="display:none" id="nav"></nav>

<script>
/* ==== адрес защищённой функции (без ключей — доступ решает она сама) ==== */
const FN_URL = "https://wtncocptetgcjsumavev.supabase.co/functions/v1/kassa-view";
const FN_ACCESS = "https://wtncocptetgcjsumavev.supabase.co/functions/v1/kassa-access";
function viewerWho(){
  try{ const u=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initDataUnsafe&&window.Telegram.WebApp.initDataUnsafe.user;
    if(u){ const nm=[u.first_name,u.last_name].filter(Boolean).join(" ").trim(); return nm || (u.username?("@"+u.username):("id "+u.id)); } }catch(e){}
  return VIEWERCP || ("роль "+ROLE);
}
function logViewerAccess(){ try{ fetch(FN_ACCESS,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"log",who:viewerWho(),role:ROLE,source:"viewer"})}).catch(function(){}); }catch(e){} }

/* ===CALC_START=== расчёты кассы (дословно из kassa.html, проверено test_calc.js) ==== */
const DEBT_CATS = ["Долговой счет ГОСТИ","Долговой счет ПЕРСОНАЛ","Долговой учред"];
const SAL_CATS = ["Зар.плата КАРАОКЕ","Зар.плата ОБЩАЯ","Зар.плата КЛУБ"];
const DOW = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
let S = { entries:[], days:{} };
let CATALOG = [];
function setData(s, catalog){ S = s || {entries:[],days:{}}; CATALOG = catalog || []; }
const VIEW_VER = "v18";   // видимая метка версии просмотрщика (в бейдже роли) — чтобы отличать от кэша
function shortNum(n){ n=Math.round(Math.abs(n)); if(n>=1e9) return [(n/1e9).toFixed(2).replace(".",","),"млрд"]; if(n>=1e6) return [String(Math.round(n/1e6)),"млн"]; if(n>=1e3) return [String(Math.round(n/1e3)),"тыс"]; return [fmt(n),""]; }
function forecastDonutV(pKar,pClub,isForecast){
  const KAR="#E8C97A",CLUB="#7FB0E8"; const tot=pKar+pClub,C=2*Math.PI*80,GAP=3;
  const fk=tot>0?pKar/tot:0,fc=tot>0?pClub/tot:0,lk=fk*C,lc=fc*C;
  const bn=shortNum(tot), bv=bn[0], bu=bn[1];
  let arcs='<circle cx="105" cy="105" r="80" fill="none" stroke="#241d10" stroke-width="26"/>';
  if(tot>0){
    arcs+='<circle cx="105" cy="105" r="80" fill="none" stroke="'+KAR+'" stroke-width="26" stroke-dasharray="'+Math.max(0,lk-GAP).toFixed(1)+' '+(C-Math.max(0,lk-GAP)).toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 105 105)"/>';
    arcs+='<circle cx="105" cy="105" r="80" fill="none" stroke="'+CLUB+'" stroke-width="26" stroke-dasharray="'+Math.max(0,lc-GAP).toFixed(1)+' '+(C-Math.max(0,lc-GAP)).toFixed(1)+'" stroke-dashoffset="'+(-lk).toFixed(1)+'" transform="rotate(-90 105 105)"/>';
  }
  const pctK=tot>0?Math.round(fk*100):0,pctC=tot>0?Math.round(fc*100):0;
  const leg=(c,name,pct,val)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px"><div><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:'+c+';margin-right:8px;vertical-align:middle"></span>'+name+' <span style="color:var(--ash);font-size:11px">'+pct+'%</span></div><b style="color:'+c+';white-space:nowrap">'+fmt(val)+'</b></div>';
  return '<div class="sect">'+(isForecast?'Расчётная касса за месяц (прогноз)':'Касса за месяц (факт)')+'</div>'+
    '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:4px">'+
      '<svg width="180" height="180" viewBox="0 0 210 210" style="flex:none">'+arcs+
        '<text x="105" y="100" text-anchor="middle" fill="#F3ECDA" font-size="22" font-weight="800">'+bv+'</text>'+
        '<text x="105" y="121" text-anchor="middle" fill="#E8C97A" font-size="12" font-weight="700">'+(bu?bu+' · ':'')+(isForecast?'прогноз':'факт')+'</text>'+
      '</svg>'+
      '<div style="display:flex;flex-direction:column;gap:9px;min-width:200px;flex:1">'+
        leg(KAR,'Караоке',pctK,pKar)+leg(CLUB,'Клуб',pctC,pClub)+
        '<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid var(--gold-dim);border-radius:12px;padding:8px 12px;background:rgba(232,201,122,.06)"><b style="font-weight:700">Общий приход</b><b style="color:var(--gold);white-space:nowrap">'+fmt(tot)+'</b></div>'+
      '</div>'+
    '</div>';
}
function normName(x){ return String(x).toUpperCase().replace(/[^А-ЯA-ZЁ0-9]/g,""); }
function plural(n, one, few, many){ n=Math.abs(Number(n)||0)%100; const d=n%10; if(n>10&&n<20) return many; if(d>1&&d<5) return few; if(d===1) return one; return many; }
// остаток нал/карта: для ЗАКРЫТОЙ смены — по факту закрытия (как переносится в кассе), иначе расчётно
function cashSplit(d){
  const day = S.days[d];
  if(day && day.closed && day.fact!==undefined){
    return { nal: Number(day.fact)||0, card: (day.cardFact!==undefined? (Number(day.cardFact)||0) : cardBalance(d)) };
  }
  return { nal: currentBalance(d), card: cardBalance(d) };
}
function staffNameSet(){ const st=new Set(); for(const c of CATALOG.concat(S.customCps||[])){ if(SAL_CATS.includes(c.cat)) st.add(normName(c.cp)); } return st; }
// «персонал» в долговых = зарплатный справочник (+ свои контрагенты) + учредители (Долговой учред), как в кассе
function debtStaffSet(){ const st=staffNameSet(); for(const c of CATALOG.concat(S.customCps||[])){ if(c.cat==="Долговой учред"||c.cat==="Долговой счет ПЕРСОНАЛ") st.add(normName(c.cp)); } for(const e of S.entries){ if(!e.deleted && (e.cat==="Долговой учред"||e.cat==="Долговой счет ПЕРСОНАЛ")) st.add(normName(e.cp)); } return st; }
// фикс-оклад: долг списывается с ЗП как аванс — не показываем в долгах персонала (как в кассе)
const PCT_CPS_V = { "АРТ Батырханов Тимур":1 };
const FIXED_PREFIXES_V = ["УПРАВЛЯЮЩИЙ","ТЕХНИК","ДИРЕКТОР","АРТ","БАРМЕНЕДЖЕР","ШЕФ","СММ"];
function isFixedSalary(cp){
  if(Object.keys(PCT_CPS_V).some(k=>normName(k)===normName(cp))) return false;
  if(normName(cp)===normName("МЕНЕДЖЕР Жихарева Олеся")) return false;
  if(S.salaries && S.salaries[cp]!==undefined) return true;
  if(normName(cp)===normName("Калькулятор Никита")) return true;
  const words = String(cp).toUpperCase().split(/\s+/);
  return FIXED_PREFIXES_V.some(p=>words.includes(p));
}
const fmt = n => (n<0?"−":"") + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
function shiftDate(iso, n){ const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function human(iso){ const d = new Date(iso+"T12:00:00"); return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]; }
function humanDM(iso){ const d = new Date(iso+"T12:00:00"); return d.getDate()+" "+MON[d.getMonth()]; }
function humanDOW(iso){ const d = new Date(iso+"T12:00:00"); return DOW[d.getDay()]; }
function bizToday(){ const d = new Date(Date.now() - 17*3600*1000); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayEntries(iso){ return S.entries.filter(e=>e.bizDate===iso && !e.deleted); }
function daySums(iso){ let inn=0,out=0; for(const e of dayEntries(iso)){ if(e.method==="card") continue; if(e.type==="in") inn+=e.amount; else out+=e.amount; } return {inn,out}; }
function openingOf(iso){ if(!S.openingSet) return 0; if(iso < S.firstDate) return 0; let bal = S.firstOpening, d = S.firstDate; while(d < iso){ const day = S.days[d]; if(day && day.closed){ bal = day.fact; } else { const s = daySums(d); bal = bal + s.inn - s.out; } d = shiftDate(d,1); } return bal; }
function currentBalance(iso){ const s = daySums(iso); return openingOf(iso) + s.inn - s.out; }
function dayInClean(iso){ let inn=0; for(const e of dayEntries(iso)){ if(e.type!=="in" || e.method==="card" || e.kind==="cardfix") continue; inn+=e.amount; } return inn; }
function dayInAll(iso){ let inn=0; for(const e of dayEntries(iso)){ if(e.type!=="in" || e.kind==="cardfix") continue; inn+=e.amount; } return inn; }
function daySpendBreakdown(iso){ let nal=0, beznal=0, card=0; for(const e of dayEntries(iso)){ if(e.type!=="out" || e.kind==="cardfix") continue; if(e.method==="card"){ card+=e.amount; continue; } if(e.cat==="Без.нал"){ beznal+=e.amount; continue; } nal+=e.amount; } return {nal, beznal, card, total: nal+beznal+card}; }
function dayRevCp(iso,cpName){ let v=0; for(const e of dayEntries(iso)){ if(e.type!=="in"||e.kind==="cardfix"||e.cat!=="Чистая выручка") continue; if(normName(e.cp)===normName(cpName)) v+=e.amount; } return v; }
function cardDaySum(iso){ let v=0; for(const e of dayEntries(iso)){ if(e.method!=="card") continue; v += (e.type==="in"? e.amount : -e.amount); } return v; }
function cardOpeningOf(iso){ if(!S.openingSet) return 0; if(iso <= S.firstDate) return S.cardStart || 0; let bal = S.cardStart || 0, d = S.firstDate; while(d < iso){ const day = S.days[d]; if(day && day.closed && day.cardFact!==undefined){ bal = day.cardFact; } else { bal = bal + cardDaySum(d); } d = shiftDate(d,1); } return bal; }
function cardBalance(iso){ if(!S.openingSet) return 0; if(iso && iso < S.firstDate) return 0; return cardOpeningOf(iso) + cardDaySum(iso); }
function debtBalance(cp){ let bal = 0; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || e.cp!==cp) continue; bal += (e.type==="out"? e.amount : -e.amount); } return bal; }
function openDebts(cp){ const acc = {}; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || e.cp!==cp || !e.orderNo) continue; if(!acc[e.orderNo]) acc[e.orderNo] = {orderNo:e.orderNo, cat:e.cat, out:0, inn:0, date:e.bizDate, venue:null}; if(e.type==="out"){ acc[e.orderNo].out += e.amount; if(e.bizDate<acc[e.orderNo].date) acc[e.orderNo].date=e.bizDate; if(e.venue) acc[e.orderNo].venue=e.venue; } else acc[e.orderNo].inn += e.amount; } return Object.values(acc).map(a=>({...a, left: a.out-a.inn})).filter(a=>a.left>0).sort((a,b)=>a.date.localeCompare(b.date)); }
function venueBadge(v){ if(!v) return ""; const c=v==="клуб"?"#8fb3d4":"#E8C97A"; const t=v==="клуб"?"КЛУБ":"КАРАОКЕ"; return '<span class="badge" style="border-color:'+c+';color:'+c+'">'+t+'</span>'; }
function debtTotalsSplit(mk){ const st = debtStaffSet(); const seen = new Set(); const r = {staffCur:0, staffOld:0, guestCur:0, guestOld:0}; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || seen.has(e.cp)) continue; seen.add(e.cp); const isStaff = st.has(normName(e.cp)); if(isStaff && isFixedSalary(e.cp)) continue; if(!isStaff && isWriteoff(e.cp)) continue; for(const o of openDebts(e.cp)){ const cur = o.date.slice(0,7)===mk; if(isStaff){ if(cur) r.staffCur+=o.left; else r.staffOld+=o.left; } else { if(cur) r.guestCur+=o.left; else r.guestOld+=o.left; } } } return r; }
function debtList(){ const st = debtStaffSet(); const seen = new Set(); const out = []; for(const e of S.entries){ if(e.deleted || !DEBT_CATS.includes(e.cat) || seen.has(e.cp)) continue; seen.add(e.cp); if(st.has(normName(e.cp)) && isFixedSalary(e.cp)) continue; if(!st.has(normName(e.cp)) && isWriteoff(e.cp)) continue; const bal = debtBalance(e.cp); if(bal<=0) continue; const open = openDebts(e.cp); const note = open.length ? ("счетов: "+open.length+" · с "+open[0].date) : ""; const firstDate = open.length ? open[0].date : null; const venues=[...new Set(open.map(o=>o.venue).filter(Boolean))]; out.push({cp:e.cp, isStaff: st.has(normName(e.cp)), bal, note, firstDate, venues}); } return out.sort((a,b)=>b.bal-a.bal); }
// невозвратные (списанные гостевые долги + статья «Невозвратные») — только для админа/кассира
function canSeeWriteoffs(){ return ROLE==="admin" || ROLE==="cashier"; }
function woDebtList(){ const st=debtStaffSet(); const out=[]; const seen=new Set();
  for(const e of S.entries){ if(e.deleted||!DEBT_CATS.includes(e.cat)||seen.has(e.cp)) continue; seen.add(e.cp); if(st.has(normName(e.cp))||!isWriteoff(e.cp)) continue; const bal=debtBalance(e.cp); if(bal>0) out.push({cp:e.cp,bal}); }
  const nz={}; for(const e of S.entries){ if(e.deleted||e.cat!=="Невозвратные") continue; const k=normName(e.cp); const a=(nz[k]=nz[k]||{cp:e.cp,bal:0}); a.bal += e.type==="out"?e.amount:-e.amount; }
  for(const k in nz){ if(nz[k].bal>0) out.push({cp:nz[k].cp,bal:nz[k].bal}); }
  return out.sort((a,b)=>b.bal-a.bal); }
// просрочка счёта: жёлтый с 10 дней, оранжевый с 20, красный с 30 (как в кассе)
const DEBT_AGE_1=10, DEBT_AGE_2=20, DEBT_AGE_3=30;
function debtAgeDays(dateIso){ const t=Date.parse(dateIso+"T12:00:00"); if(!t) return 0; return Math.floor((Date.now()-t)/86400000); }
function agingBadge(dateIso){ if(!dateIso) return ""; const d=debtAgeDays(dateIso); const col=d>=DEBT_AGE_3?"var(--out)":d>=DEBT_AGE_2?"var(--warn)":d>=DEBT_AGE_1?"var(--gold)":null; if(!col) return ""; return '<span class="badge" style="border-color:'+col+';color:'+col+'">'+d+' дн</span>'; }
// группы расходов безнала (как в кассе на ПК)
const EXPENSE_GROUPS=["Продукты","Алкоголь","Административные","Коммунальные","Налоги"];
const GROUP_COLOR={"Продукты":"#8FD49B","Алкоголь":"#E8A34A","Административные":"#B89A54","Коммунальные":"#7FB0E8","Налоги":"#E8735A"};
const GROUP_BY_BANKCAT={"Поставщики":"Продукты","Электричество":"Коммунальные","Газ":"Коммунальные","Вода":"Коммунальные","Вывоз мусора":"Коммунальные","Интернет · связь":"Коммунальные","Налоги ЗП (ИНПС · НДФЛ · соц.)":"Налоги","НДС":"Налоги","Прочее":"Административные"};
const DEFAULT_SUPPLIERS=["SAPHIR DISTRIBUTION","UNION BEVERAGE TRADE","BEER PLANET","GRAND CRU"];
function payGroupKey(cat,payee){ return payee?("who:"+normName(payee)):("cat:"+cat); }
function payGroup(cat,payee){ const k=payGroupKey(cat,payee); if(S.bank&&S.bank.groupOf&&S.bank.groupOf[k]&&EXPENSE_GROUPS.includes(S.bank.groupOf[k])) return S.bank.groupOf[k]; if(payee&&DEFAULT_SUPPLIERS.map(normName).includes(normName(payee))) return "Алкоголь"; return GROUP_BY_BANKCAT[cat]||"Административные"; }
function groupOfPayment(p){ return (p.group&&EXPENSE_GROUPS.includes(p.group))?p.group:payGroup(p.category,p.payee); }
function grpBadge(g){ const c=GROUP_COLOR[g]||"#B89A54"; return '<span class="badge" style="border-color:'+c+';color:'+c+'">'+esc(g)+'</span>'; }
function bankAnchor(){ if(!S.bank) return null; const ch = (S.bank.checks||[]); return ch.length ? ch[ch.length-1] : {date:S.bank.startDate, amount:S.bank.startAmount}; }
function bankFlows(afterDate){ let uz=0,humo=0,rah=0,qr=0,inkass=0,other=0,ret=0; for(const e of S.entries){ if(e.deleted || e.cat!=="Без.нал" || e.bizDate<=afterDate) continue; const n = normName(e.cp); if(e.type==="in"){ ret += e.amount; continue; } if(n.includes("ИНКАССАЦ")) inkass+=e.amount; else if(n.includes("QR")) qr+=e.amount; else if(n.includes("RAHMAT")||n.includes("РАХМАТ")) rah+=e.amount; else if(n.includes("HUMO")||n.includes("ХУМО")) humo+=e.amount; else if(n.includes("UZCARD")||n.includes("УЗКАРД")) uz+=e.amount; else other+=e.amount; } let pays=0; for(const p of ((S.bank&&S.bank.payments)||[])){ if(p.date>afterDate) pays+=p.amount; } let rcv=0; for(const r of ((S.bank&&S.bank.receipts)||[])){ if(r.date>afterDate) rcv+=r.amount; } const fee = Math.round(uz*0.01)+Math.round(humo*0.01)+Math.round((rah+other)*0.015)+Math.round(qr*0.0065); return {uz,humo,rah,qr,inkass,other,ret,pays,rcv,fee}; }
function bankBalance(){ const a = bankAnchor(); if(!a) return null; const f = bankFlows(a.date); return a.amount + f.uz + f.humo + f.rah + f.qr + f.other + f.inkass + f.rcv - f.ret - f.pays - f.fee; }
function bankAgg(entryPred, payPred){ let uz=0,humo=0,rah=0,qr=0,inkass=0,other=0,ret=0; for(const e of S.entries){ if(e.deleted || e.cat!=="Без.нал" || !entryPred(e)) continue; const n=normName(e.cp); if(e.type==="in"){ ret+=e.amount; continue; } if(n.includes("ИНКАССАЦ")) inkass+=e.amount; else if(n.includes("QR")) qr+=e.amount; else if(n.includes("RAHMAT")||n.includes("РАХМАТ")) rah+=e.amount; else if(n.includes("HUMO")||n.includes("ХУМО")) humo+=e.amount; else if(n.includes("UZCARD")||n.includes("УЗКАРД")) uz+=e.amount; else other+=e.amount; } let pays=0; for(const p of ((S.bank&&S.bank.payments)||[])){ if(payPred(p)) pays+=p.amount; } let rcv=0; for(const r of ((S.bank&&S.bank.receipts)||[])){ if(payPred(r)) rcv+=r.amount; } const fee=Math.round(uz*0.01)+Math.round(humo*0.01)+Math.round((rah+other)*0.015)+Math.round(qr*0.0065); const net=uz+humo+rah+qr+other+inkass+rcv - ret - pays - fee; return {uz,humo,rah,qr,inkass,other,ret,pays,rcv,fee,net}; }
function bankDaySummary(iso){ return bankAgg(e=>e.bizDate===iso, p=>p.date===iso); }
function bankBalanceAsOf(iso){ const a=bankAnchor(); if(!a) return null; if(iso<a.date) return a.amount; const f=bankAgg(e=>e.bizDate>a.date&&e.bizDate<=iso, p=>p.date>a.date&&p.date<=iso); return a.amount+f.net; }
function latestBizDate(){ let mx=null; for(const e of S.entries){ if(!e.deleted && (!mx || e.bizDate>mx)) mx=e.bizDate; } for(const d in S.days){ if(!mx || d>mx) mx=d; } return mx; }

function rowToEntry(r){ const m=r.meta||{}; const e={id:r.id,bizDate:r.biz_date,cat:(m.cat||""),cp:(m.cp||""),type:r.type,amount:Number(r.amount),note:r.note||"",orderNo:r.order_no||"",by:r.created_by||"",ts:r.created_at||undefined}; if(r.method)e.method=r.method; if(r.kind)e.kind=r.kind; if(m.time)e.time=m.time; if(r.deleted)e.deleted=true; if(m.backdated)e.backdated=m.backdated; if(m.venue)e.venue=m.venue; return e; }
function rowToDay(r){ const d={closed:!!r.closed}; if(r.fact!=null)d.fact=Number(r.fact); if(r.card_fact!=null)d.cardFact=Number(r.card_fact); if(r.closed_by)d.by=r.closed_by; if(r.closed_at)d.closedAt=r.closed_at; return d; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ==== загрузка через Telegram ==== */
let VD = null, GEN = null, ROLE = "admin", MYSAL = null, VIEWERCP = "", SEL = null;
async function boot(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  decoy();                                        // сразу нейтральный экран — на загрузке кассу не раскрываем
  const initData = tg && tg.initData;
  if(!initData){ return; }                        // открыли в браузере / вне Telegram — остаётся календарь
  try{
    const res = await fetch(FN_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({initData}) });
    if(res.status===401 || res.status===403){ return; }  // нет доступа — остаётся календарь
    if(!res.ok){ return; }                        // серверная ошибка — тоже не раскрываем кассу
    const data = await res.json();
    hydrate(data);
    show();
    renderAll();
    logViewerAccess();                            // журнал входов (не критично, ошибки глотаем)
  }catch(e){ /* нет связи — остаётся календарь */ }
}

  const g = document.getElementById("gate");

function calHtml(){

function hydrate(data){
  const s = { entries:[], days:{} };
  if(data.setup) Object.assign(s, data.setup);

  s.days = {}; for(const r of (data.days||[])) s.days[r.biz_date]=rowToDay(r);

  VD = latestBizDate();
  SEL = VD;
  GEN = data.generatedAt;
  ROLE = data.role || "admin";
  MYSAL = data.mySalary || null;
  VIEWERCP = data.viewerCp || "";

    {name:"Алкоголь",hex:G("Алкоголь"),amt:gAmt("Алкоголь"),items:merge("Алкоголь")},
    {name:"Налоги",hex:G("Налоги"),amt:gAmt("Налоги"),items:merge("Налоги")},
    {name:"Административные",hex:G("Административные"),amt:gAmt("Административные"),items:merge("Административные")},
    {name:"Коммунальные",hex:G("Коммунальные"),amt:gAmt("Коммунальные"),items:merge("Коммунальные")},

function donutSVG(groups,total){

    '<div class="exrev">'+
    '<div class="card kar"><div class="t">Касса Караоке</div><div class="v">'+fmt(R.revKar)+'</div></div>'+
    '<div class="card club"><div class="t">Касса Клуб</div><div class="v">'+fmt(R.revClub)+'</div></div></div>';
  html+=forecastTextV(EXPM, R.revKar, R.revClub);
  html+='<div class="exhero"><div class="lbl">Всего расходов за месяц</div><div class="sum">'+(R.total?"−":"")+fmt(R.total)+'</div></div>';
  html+='<div class="exdonut">'+(R.total>0?donutSVG(R.groups,R.total):'<div class="empty">Расходов за этот месяц нет.</div>')+'</div>';
  if(shown.length){
    html+='<div class="sect">По группам · нажмите для детализации</div><div class="exlist">';
    shown.forEach((g,i)=>{
      const pct=Math.round(g.amt/R.total*100);
      let detail='';
      if(g.fot){ detail+='<div class="fotsplit"><div class="fc"><div class="k">Караоке</div><div class="a">'+fmt(g.fot.Караоке)+'</div></div><div class="fc"><div class="k">Клуб</div><div class="a">'+fmt(g.fot.Клуб)+'</div></div><div class="fc"><div class="k">Общий</div><div class="a">'+fmt(g.fot.Общий)+'</div></div></div>';
        detail+=g.people.length?('<div class="subhdr">по сотрудникам</div>'+g.people.map(p=>'<div class="drow"><span class="nm">'+esc(p.n)+(p.cnt>1?'<span class="cnt">'+p.cnt+' вып.</span>':'')+'</span><b>'+fmt(p.a)+'</b></div>').join("")):''; }
      else { detail+='<div class="subhdr">получатели · за месяц</div>'+(g.items.length?g.items.map(it=>{ const inLbl=(it.inA>0)?cashInLabel(it.n):null; return '<div class="drow"><span class="nm">'+esc(it.n)+(it.cnt>1?'<span class="cnt">'+it.cnt+' плат.</span>':'')+'</span><b>'+fmt(it.a)+'</b></div>'+(inLbl?'<div class="drow" style="opacity:.85"><span class="nm" style="padding-left:12px;color:var(--in)">↳ '+esc(inLbl)+'</span><b style="color:var(--in)">+'+fmt(it.inA)+'</b></div>':''); }).join(""):'<div class="drow"><span class="nm">детализации нет</span></div>'); }
      html+='<div class="grp" id="exg'+i+'"><div class="grp-top" onclick="document.getElementById(\'exg'+i+'\').classList.toggle(\'open\')"><span class="chev">▸</span><span class="gdot" style="background:'+g.hex+'"></span><span class="grp-name">'+g.name+'</span><span class="grp-pct">'+pct+'%</span><span class="grp-amt">'+fmt(g.amt)+'</span></div><div class="gtrack"><span style="width:'+Math.round(g.amt/max*100)+'%;background:'+g.hex+'"></span></div><div class="gdetail">'+detail+'</div></div>';
    });
    html+='</div>';
    html+='<div class="kpi wide" style="margin-top:12px;border:2px solid var(--gold);background:rgba(232,201,122,.07)"><div class="t" style="color:var(--gold)">Итого расходов</div><div class="v" style="color:var(--gold)">'+fmt(R.total)+'</div></div>';
    html+='<div class="sect">Способ оплаты</div><div class="exrev"><div class="card"><div class="t">Наличка</div><div class="v">'+fmt(R.nal)+'</div></div><div class="card"><div class="t">Карта</div><div class="v">'+fmt(R.card)+'</div></div><div class="card"><div class="t">Безнал</div><div class="v">'+fmt(R.bez)+'</div></div></div>';
  }
  box.innerHTML=html;
}

/* ==== своя ЗП (для upr/dir) — итоги считает сервер, тут только показ ==== */
function renderSalary(){
  const box=document.getElementById("tab-salary");
  if(!MYSAL){ box.innerHTML='<div class="empty">Данные по зарплате недоступны.</div>'; return; }
  const s=MYSAL, mk=(GEN?String(GEN):"").slice(0,7);
  const parts=(s.parts||[]).filter(p=>p.amount);
  const rest=s.rest;
  box.innerHTML =
    '<div class="sect">Моя зарплата'+(mk?' · '+mk:'')+'</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="t">Начислено за месяц</div><div class="v" style="color:var(--gold)">'+fmt(s.accrued)+'</div>'+
        ((s.parts&&s.parts.length>1)?'<div class="s">'+s.parts.map(p=>esc(p.label)+' '+fmt(p.amount)).join(' · ')+'</div>':'')+'</div>'+
      '<div class="kpi"><div class="t">Выплачено</div><div class="v in">'+fmt(s.paid)+'</div><div class="s">'+(s.advance?'в т.ч. аванс '+fmt(s.advance):'')+'</div></div>'+
    '</div>'+
    '<div class="sect">К выплате</div>'+
    '<div class="card-wrap calc">'+
      '<div class="l"><div>Начислено</div><b>'+fmt(s.accrued)+'</b></div>'+
      '<div class="l"><div>Выплачено в этом месяце</div><b class="in">−'+fmt(s.paid)+'</b></div>'+
      (s.dm?'<div class="l"><div>Мои долги/заказы (этот месяц)</div><b class="out">−'+fmt(s.dm)+'</b></div>':'')+
      '<div class="l gold"><div>Остаток к выплате</div><b style="color:'+(rest<0?'var(--out)':'var(--gold)')+'">'+fmt(rest)+'</b></div>'+
    '</div>'+
    (s.orderDebt>0?'<div class="sect">Общий долг (заказы + аванс)</div><div class="kpi wide"><div class="t">Всего за мной</div><div class="v" style="color:var(--warn)">'+fmt(s.orderDebt)+'</div><div class="s">накопительно по всем месяцам</div></div>':'')+
    (()=>{ // выплаты по датам — от последней (сверху) к первой, как в кассе
      const mvs=S.entries.filter(e=>!e.deleted && SAL_CATS.includes(e.cat) && String(e.bizDate).slice(0,7)===mk)
        .sort((a,b)=>(b.bizDate+(b.ts||"")).localeCompare(a.bizDate+(a.ts||"")));
      let o='<div class="sect">Выплаты по датам</div>';
      if(!mvs.length) return o+'<div class="empty">Выплат за месяц нет.</div>';
      return o+'<div class="rows">'+mvs.map(e=>{ const isOut=e.type==="out"; const lbl=e.kind==="advance"?"Аванс":(isOut?"Зарплата":"Возврат");
        return '<div class="row '+(isOut?"r-out":"r-in")+'"><div class="who">'+lbl+'<small>'+esc(e.bizDate)+(e.time?' · '+esc(e.time):'')+(e.method==="card"?' · карта':' · нал')+(e.note?' · '+esc(e.note):'')+'</small></div><div class="amt '+(isOut?"out":"in")+'">'+(isOut?"−":"+")+fmt(e.amount)+'</div></div>'; }).join("")+'</div>';
    })();
}

/* ==== нижняя навигация под роль ==== */
const NAV_ADMIN = [
  {id:"summary",ic:"◈",label:"Сводка"},
  {id:"kassa",ic:"▤",label:"Касса"},
  {id:"bank",ic:"▧",label:"Безнал"},
  {id:"debts",ic:"▨",label:"Долги"},
  {id:"expenses",ic:"◔",label:"Расходы"},
];
const NAV_LIMITED = [
  {id:"debts",ic:"▨",label:"Долги"},
  {id:"salary",ic:"◉",label:"Моя ЗП"},
];
function buildNav(){
  const items = ROLE==="admin" ? NAV_ADMIN : NAV_LIMITED;
  const nav=document.getElementById("nav");
  nav.innerHTML = items.map((it,i)=>'<button data-tab="'+it.id+'"'+(i===0?' class="on"':'')+'><span class="ic">'+it.ic+'</span>'+it.label+'</button>').join("");
  nav.querySelectorAll('button').forEach(b=>{ b.onclick=()=>setTab(b.dataset.tab); });
  setTab(items[0].id);
}
function setTab(id){
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on', x.dataset.tab===id));
  document.querySelectorAll('.tabpage').forEach(p=>p.classList.toggle('on', p.id==='tab-'+id));
  window.scrollTo(0,0);
}

boot();
</script>
