<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPLETNI · Кабинет администратора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1c2025;--line:#22272e;--text:#eef1f4;--muted:#8b949e;--emerald:#1fbf7a;--gold:#c9a14a;--red:#e2655c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 90px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.head h1{margin:0;font-size:21px;font-weight:800;flex:1;min-width:0}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;text-decoration:none}
.ib svg{width:20px;height:20px}
.sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.grp{font-size:13px;color:var(--muted);padding:20px 0 4px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.it b{font-weight:600}
.it span{font-size:14px;color:var(--muted);text-align:right;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it i{color:var(--muted);font-style:normal}
.f{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.f>label{font-size:13px;color:var(--muted)}
.f small{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
input:focus,textarea:focus{border-color:var(--emerald)}
textarea{min-height:84px;resize:vertical;line-height:1.4}
.num{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.num label{font-size:15px}
.num input{text-align:right;font-variant-numeric:tabular-nums}
.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tg{min-width:64px;height:34px;border-radius:17px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:700}
.tg.on{border-color:var(--emerald);color:var(--emerald);background:rgba(31,191,122,.1)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px}
td{padding:4px;vertical-align:middle}
td input{padding:8px 9px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,18,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.save{min-height:48px;border:0;border-radius:12px;background:var(--emerald);color:#06130d;font-size:15px;font-weight:800}
.save[disabled]{background:var(--panel2);color:var(--muted)}
.ach{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ach small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.log{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.log b{font-weight:600}
.log small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;padding:8px 0}
.mode{border-radius:12px;padding:10px 12px;margin:6px 0 0;font-size:13px;line-height:1.4;border:1px solid rgba(201,161,74,.55);background:rgba(201,161,74,.08);color:#e0bd6e}
#auth{padding:40px 20px;text-align:center;color:var(--muted);line-height:1.5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f242b;border:1px solid var(--emerald);padding:11px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="auth">Загружаем…</div>
  <div id="app" hidden></div>
</div>
<div class="bar" id="bar" hidden><div><button type="button" class="save" id="save" disabled>Сохранить</button><button type="button" class="btn" id="cancel">Отмена</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* SPLETNI · кабинет администратора (kabinet.html) · сборка 2 · 08.11.2026 (комплименты по приглашениям)
   Все настройки программ для гостей в одном месте: уровни, комплименты, достижения, коллекции, тексты бота,
   напоминания, лимиты, песни (song_settings), журнал правок с откатом. Только владелец (song_settings.owner_tg) -
   проверка на сервере (song_adm_api). Вход: подпись Telegram (бот табеля) -> Edge Function songs -> токен; rpc song_call, adm_* */
"use strict";
const SB_URL = "https://wtncocptetgcjsumavev.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0bmNvY3B0ZXRnY2pzdW1hdmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjA0MTQsImV4cCI6MjA5NjczNjQxNH0.WFEIkE8tyLr2p7inMoSuC1K8YISrKRbOI0a0tD-DGVc";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ERR = { forbidden: "Кабинет только у владельца", network: "Нет связи, попробуйте ещё раз", auth: "Сессия устарела - откройте заново из табеля",
  bad_type: "Неверный формат", bad_key: "Такой настройки нет" };
const errText = e => ERR[e] || ("Ошибка: " + e);
let TOKEN = null, D = null, VIEW = null, DRAFT = null, busy = false;

/* ---------- описание экранов ---------- */
const BACK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LBL = {
  compliments: { voice_evening: "Голосу вечера", voice_month: "Голосу месяца", birthday: "На день рождения" },
  bot_texts: { voice_evening: "Голос вечера", voice_month: "Голос месяца", birthday: "День рождения", level_up: "Новый уровень" },
  reminders: { birthday_days_before: "Поздравить с ДР за, дней", voice_evening_hour: "«Голос вечера» - во сколько, час", voice_month_day: "«Голос месяца» - какого числа" },
  limits: { yt_search_day: "Поисков YouTube у гостя в день", my_list_max: "Песен в «Моих песнях», максимум" }
};
const SETS = {
  "s.queue": { title: "Очередь в зале", f: [
    ["limit_default", "n", "Песен в очереди на стол"], ["notify_ahead", "n", "Предупредить стол за, песен"],
    ["idle_min", "n", "Убрать стол из круга без действий, мин"], ["likes_live", "b", "Лайки в зале онлайн"]] },
  "s.after": { title: "После визита", f: [
    ["post_visit", "b", "Писать после зала"], ["review_text", "t", "Просьба об отзыве - зал"], ["offer_text", "t", "Предложение - зал"],
    ["cabin_post_visit", "b", "Писать после кабинки"], ["cabin_review_text", "t", "Просьба об отзыве - кабинка"], ["cabin_offer_text", "t", "Предложение - кабинка"]] },
  "s.back": { title: "Вернуть гостя", f: [
    ["back_days", "n", "Через сколько дней звать снова"], ["back_every", "n", "Не чаще раза в, дней"], ["back_sleep_days", "n", "«Уснувший» гость - нет визитов, дней"],
    ["back_gift_days", "n", "Комплимент действует, дней"],
    ["back_company_on", "b", "Звать компанию"], ["back_compliment", "x", "Комплимент компании"], ["back_company_text", "t", "Текст для компании"],
    ["back_solo_on", "b", "Звать одного"], ["back_compliment_solo", "x", "Комплимент одному"], ["back_solo_text", "t", "Текст одному"],
    ["back_sleep_on", "b", "Будить «уснувших»"], ["back_compliment_sleep", "x", "Комплимент «уснувшим»"], ["back_sleep_text", "t", "Текст «уснувшим»"]] }
};
const MENU = [
  ["Гость", [["levels", "Уровни"], ["achievements", "Достижения"], ["compliments", "Комплименты"], ["collections", "Коллекции"]]],
  ["Бот", [["bot_texts", "Тексты бота"], ["reminders", "Напоминания"], ["s.back", "Вернуть гостя"], ["@gifts", "Комплименты по приглашениям"], ["s.after", "После визита"]]],
  ["Песни", [["s.queue", "Очередь в зале"], ["limits", "Лимиты"], ["@testery", "Тестеры"]]],
  ["", [["@log", "Журнал правок"]]]
];
const TITLE = k => { for (const g of MENU) for (const [kk, t] of g[1]) if (kk === k) return t;
  for (const s in SETS) for (const f of SETS[s].f) if ("s." + f[0] === k) return SETS[s].title + " · " + f[2];
  const c = cfg(k); return c ? c.title : k; };
const cfg = k => (D && D.cfg || []).find(c => c.key === k);
const clone = v => JSON.parse(JSON.stringify(v));

function toast(m){ const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3000); }
const when = d => new Date(d).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

/* ---------- связь ---------- */
async function fnCall(body){
  try{
    const r = await fetch(SB_URL + "/functions/v1/songs", { method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_ANON, Authorization: "Bearer " + SB_ANON }, body: JSON.stringify(body) });
    let d = {}; try{ d = await r.json(); }catch(_){}
    if (!r.ok && !d.error) d.error = "http_" + r.status;
    return d;
  }catch(e){ return { error: "network" }; }
}
async function login(){
  const tg = window.Telegram && window.Telegram.WebApp;
  let initData = tg && tg.initData;
  if (!initData){ try{ initData = sessionStorage.getItem("spl_initData") || ""; }catch(_){} }
  if (!initData){ $("#auth").textContent = "Откройте кабинет из табеля в Telegram (кнопка «Кабинет»)."; return false; }
  const d = await fnCall({ action: "login", app: "staff", initData });
  if (!d.token){ $("#auth").textContent = d.error === "not_staff" || d.error === "test_mode" ? "Кабинет только у владельца." : "Не получилось войти: " + (d.error || "ошибка"); return false; }
  TOKEN = d.token; return true;
}
async function api(action, args, retry){
  if (!TOKEN && !(await login())) return { error: "auth" };
  let d;
  try{
    const r = await fetch(SB_URL + "/rest/v1/rpc/song_call", { method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_ANON, Authorization: "Bearer " + SB_ANON },
      body: JSON.stringify({ p_token: TOKEN, p_action: action, p_args: args || {} }) });
    d = await r.json();
    if (!r.ok) d = { error: (d && d.message) || ("http_" + r.status) };
  }catch(e){ d = { error: "network" }; }
  if (d && d.error === "auth" && !retry){ TOKEN = null; return api(action, args, true); }
  return d || {};
}

/* ---------- главная ---------- */
function preview(k){
  if (k === "@testery") return D.testers + " чел.";
  if (k === "@log") return D.log.length ? when(D.log[0].at) : "пусто";
  if (k === "@gifts"){ const g = D.gifts || []; return g.length ? g.filter(x => x.st === "came").length + " пришли из " + g.length : "пока нет"; }
  if (SETS[k]) return SETS[k].f.filter(f => f[1] === "b").map(f => D.settings[f[0]] ? "вкл" : "выкл").slice(0, 2).join(" · ") || "";
  const c = cfg(k); if (!c) return "";
  const v = c.val;
  if (k === "levels") return v.map(l => l.name).join(" · ");
  if (k === "achievements") return v.filter(a => a.on).length + " из " + v.length;
  if (k === "collections") return v.length ? v.length + " шт." : "нет";
  if (k === "compliments") return v.voice_evening || "";
  if (k === "limits") return v.yt_search_day + " поисков";
  if (k === "reminders") return "ДР за " + v.birthday_days_before + " дн.";
  return Object.keys(v).length + " текста";
}
function home(){
  VIEW = null; DRAFT = null; $("#bar").hidden = true;
  let h = '<div class="head"><a href="index.html" class="ib" aria-label="Назад в табель">' + BACK + '</a><h1>Кабинет</h1></div>' +
    '<p class="sub">Настройки программ для гостей. Видите только вы, каждая правка - в журнале.</p>' +
    (D.test_mode ? '<div class="mode">Песни в тестовом режиме - гости ещё не видят уровни и достижения.</div>' : "");
  for (const [g, items] of MENU){
    if (g) h += '<div class="grp">' + g + "</div>"; else h += '<div style="height:18px"></div>';
    for (const [k, t] of items) h += '<button type="button" class="it" data-open="' + k + '"><b>' + t + "</b><span>" + esc(preview(k)) + "</span><i>›</i></button>";
  }
  $("#app").innerHTML = h; window.scrollTo(0, 0);
}

/* ---------- экраны правки ---------- */
function open(k){
  if (k === "@testery"){ location.href = "testery.html"; return; }
  VIEW = k;
  if (k === "@log" || k === "@gifts"){ DRAFT = null; $("#bar").hidden = true; }
  else { DRAFT = SETS[k] ? Object.fromEntries(SETS[k].f.map(f => [f[0], D.settings[f[0]]])) : clone(cfg(k).val); $("#bar").hidden = false; }
  draw(); window.scrollTo(0, 0);
}
function head(t, sub){ return '<div class="head"><button type="button" class="ib" data-home aria-label="Назад">' + BACK + "</button><h1>" + esc(t) + "</h1></div>" + (sub ? '<p class="sub">' + sub + "</p>" : ""); }
const inp = (path, v, type) => '<input type="' + (type || "text") + '" data-p="' + path + '" value="' + esc(v) + '"' + (type === "number" ? ' inputmode="numeric"' : "") + ">";
const tog = (path, on) => '<button type="button" class="tg' + (on ? " on" : "") + '" data-t="' + path + '">' + (on ? "вкл" : "выкл") + "</button>";

function draw(){
  const k = VIEW, v = DRAFT; let h = "";
  if (k === "@gifts"){
    const g = D.gifts || [], cnt = st => g.filter(x => x.st === st).length;
    h = head("Комплименты по приглашениям", "Комплимент закрепляется за гостем при отправке напоминания. Бронь в срок - в примечании брони «Комплимент от программы». Посадили - «пришёл».");
    h += '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 0 12px;border-bottom:1px solid var(--line)">' +
      [["wait", "ждём"], ["booked", "бронь"], ["came", "пришли"], ["expired", "истекло"]].map(([s, t]) => '<div><b style="display:block;font-size:22px">' + cnt(s) + '</b><span style="font-size:13px;color:var(--muted)">' + t + "</span></div>").join("") + "</div>";
    const ST = { wait: ["ждём бронь", "var(--muted)"], booked: ["есть бронь", "var(--gold)"], came: ["пришёл", "var(--emerald)"], expired: ["истекло", "var(--red)"], cancelled: ["заменён новым", "var(--muted)"] };
    const KIND = { company: "компания", solo: "один", sleep: "давно не был" };
    const d = x => new Date(x).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    h += g.length ? g.map(x => '<div class="log"><div><b>' + esc(x.who) + "</b><small>" + esc(x.gift) + " · " + (KIND[x.kind] || x.kind) + "</small><small>отправлено " + d(x.sent_on) + ", действует до " + d(x.until_on) + "</small></div>" +
      '<span style="font-size:13px;font-weight:700;color:' + (ST[x.st] || ST.wait)[1] + '">' + (ST[x.st] || [x.st])[0] + "</span></div>").join("")
      : '<p class="hint">Пока никому не отправляли комплимент. Он появится здесь после отправки напоминания с заполненным комплиментом.</p>';
  } else if (k === "@log"){
    h = head("Журнал правок", "Последние 50. «Вернуть» ставит значение, которое было до правки.");
    h += D.log.length ? D.log.map(l => '<div class="log"><div><b>' + esc(TITLE(l.key)) + "</b><small>" + when(l.at) + " · " + esc(l.who) + "</small><small>было: " + esc(short(l.old)) + "</small></div>" +
      '<button type="button" class="btn" data-undo="' + l.id + '">Вернуть</button></div>').join("") : '<p class="hint">Пока правок не было.</p>';
  } else if (SETS[k]){
    h = head(SETS[k].title);
    for (const [c, t, l] of SETS[k].f){
      if (t === "n") h += '<div class="num"><label>' + l + "</label>" + inp(c, v[c] == null ? "" : v[c], "number") + "</div>";
      else if (t === "b") h += '<div class="sw"><span>' + l + "</span>" + tog(c, v[c]) + "</div>";
      else if (t === "x") h += '<div class="f"><label>' + l + "</label>" + inp(c, v[c] || "") + "</div>";
      else h += '<div class="f"><label>' + l + '</label><textarea data-p="' + c + '">' + esc(v[c] || "") + "</textarea></div>";
    }
    if (k === "s.back") h += '<p class="hint">В текстах: {имя}, {друзья}, {место}, {комплимент}, {срок} («до 13 ноября»), {избранное}. Пустой комплимент - фраза с ним в сообщение не попадёт.</p>';
  } else if (k === "levels"){
    h = head("Уровни", "Уровень даётся по числу визитов. Бонус гость видит в «Мой SPLETNI» и в сообщении бота.");
    h += "<table><tr><th>Название</th><th style=\"width:70px\">Визитов</th><th></th></tr>" + v.map((l, i) =>
      "<tr><td>" + inp(i + ".name", l.name) + '</td><td>' + inp(i + ".visits", l.visits, "number") + '</td><td><button type="button" class="x" data-del="' + i + '" aria-label="Убрать">×</button></td></tr>' +
      '<tr><td colspan="3" style="padding-bottom:12px">' + inp(i + ".perk", l.perk).replace("<input", '<input placeholder="Бонус уровня"') + "</td></tr>").join("") + "</table>" +
      '<button type="button" class="btn" data-add style="margin-top:8px">Добавить уровень</button>';
  } else if (k === "achievements"){
    h = head("Достижения", "Название и порог можно менять. Выключенное гость не видит. Условие считает база.");
    let g0 = "";
    v.forEach((a, i) => {
      if (a.grp !== g0){ g0 = a.grp; h += '<div class="grp">' + esc(g0) + "</div>"; }
      h += '<div class="ach"><div>' + inp(i + ".name", a.name) + "<small>" + COND[a.cond] + "</small></div>" + inp(i + ".n", a.n, "number") + tog(i + ".on", a.on) + "</div>";
    });
  } else if (k === "collections"){
    h = head("Коллекции", "Гость собирает коллекцию, спев песни из списка. Одна строка - одна песня: «Исполнитель - Название» или номер AST.");
    h += v.length ? "" : '<p class="hint">Коллекций пока нет. Можно начать с подборок звукооператора.</p>';
    v.forEach((c, i) => {
      h += '<div class="f"><label>Название</label><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px">' + inp(i + ".name", c.name) +
        '<button type="button" class="x" data-del="' + i + '" aria-label="Убрать">×</button></div><label>Песни (' + (c.songs || []).length + ')</label><textarea data-lines="' + i + '.songs" style="min-height:120px">' +
        esc((c.songs || []).join("\n")) + "</textarea>" + '<div class="sw" style="border:0;padding:0"><span>Показывать гостям</span>' + tog(i + ".on", c.on !== false) + "</div></div>";
    });
    h += '<button type="button" class="btn" data-add style="margin-top:10px">Добавить коллекцию</button>';
  } else if (k === "bot_texts" || k === "compliments"){
    h = head(TITLE(k), k === "bot_texts" ? "В текстах: {имя}, {песня}, {лайки}, {месяц}, {подарок}, {уровень}, {бонус}." : "Что получает гость. Подставляется в тексты бота вместо {подарок}.");
    for (const kk in v) h += '<div class="f"><label>' + (LBL[k][kk] || kk) + "</label>" + (k === "bot_texts" ? '<textarea data-p="' + kk + '">' + esc(v[kk]) + "</textarea>" : inp(kk, v[kk])) + "</div>";
  } else {
    h = head(TITLE(k));
    for (const kk in v) h += '<div class="num"><label>' + (LBL[k] && LBL[k][kk] || kk) + "</label>" + inp(kk, v[kk], "number") + "</div>";
  }
  $("#app").innerHTML = h; dirty();
}
const COND = { lang: "разных языков", lang_en: "песен на английском", lang_uz: "песен на узбекском", songs: "песен всего", songs_year: "песен за год",
  artists: "разных исполнителей", same_song: "раз одну песню", voice_evening: "раз «Голос вечера»", voice_month: "раз «Голос месяца»", likes: "лайков всего",
  opener: "раз первой песней вечера", score: "баллов в кабинке", duet: "дуэтов", visits: "визитов", months_row: "месяцев подряд", seasons: "сезонов",
  after3: "песен после 3:00", weekday: "визитов пн-ср", birthday: "ДР в SPLETNI" };
const short = v => { if (Array.isArray(v) && v.length && v[0] && v[0].name != null) v = v.map(x => x.name + (x.n != null ? " " + x.n : x.visits != null ? " (" + x.visits + ")" : "")).join(", ");
  else if (v && typeof v === "object" && !Array.isArray(v)) v = Object.values(v).join(" · ");
  const s = typeof v === "string" ? v : JSON.stringify(v); return s && s.length > 90 ? s.slice(0, 90) + "…" : (s == null ? "пусто" : s); };

/* ---------- правка черновика ---------- */
function setPath(obj, path, val){ const p = path.split("."); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }
function getPath(obj, path){ return path.split(".").reduce((o, k) => o == null ? o : o[k], obj); }
function orig(){ return SETS[VIEW] ? Object.fromEntries(SETS[VIEW].f.map(f => [f[0], D.settings[f[0]]])) : cfg(VIEW).val; }
function dirty(){ const b = $("#save"); if (b) b.disabled = !DRAFT || JSON.stringify(DRAFT) === JSON.stringify(orig()); }
document.addEventListener("input", e => {
  const t = e.target; if (!DRAFT) return;
  if (t.dataset.p != null){ const num = t.type === "number"; setPath(DRAFT, t.dataset.p, num ? (t.value === "" ? null : Number(t.value)) : t.value); }
  if (t.dataset.lines != null) setPath(DRAFT, t.dataset.lines, t.value.split("\n").map(s => s.trim()).filter(Boolean));
  dirty();
});
async function save(){
  if (busy || !DRAFT) return;
  if (VIEW === "levels") DRAFT.sort((a, b) => (a.visits || 0) - (b.visits || 0));
  busy = true; $("#save").disabled = true;
  let d;
  if (SETS[VIEW]){
    const o = orig();
    for (const c in DRAFT){ if (JSON.stringify(DRAFT[c]) === JSON.stringify(o[c])) continue;
      d = await api("adm_set", { key: "s." + c, val: DRAFT[c] }); if (d.error) break; }
  } else d = await api("adm_set", { key: VIEW, val: DRAFT });
  busy = false;
  if (!d || d.error){ toast(errText(d && d.error)); dirty(); return; }
  D = d; toast("Сохранено"); home();
}
document.addEventListener("click", async e => {
  const t = e.target;
  const o = t.closest("[data-open]"); if (o){ open(o.dataset.open); return; }
  if (t.closest("[data-home]") || t.closest("#cancel")){
    if (DRAFT && !$("#save").disabled && !confirm("Выйти без сохранения?")) return; home(); return; }
  if (t.closest("#save")){ save(); return; }
  const g = t.closest("[data-t]"); if (g){ const p = g.dataset.t; setPath(DRAFT, p, !getPath(DRAFT, p)); draw(); return; }
  const x = t.closest("[data-del]"); if (x){ DRAFT.splice(Number(x.dataset.del), 1); draw(); return; }
  if (t.closest("[data-add]")){
    DRAFT.push(VIEW === "levels" ? { name: "", visits: ((DRAFT[DRAFT.length - 1] || {}).visits || 0) + 5, perk: "" } : { name: "", songs: [], on: true }); draw(); return; }
  const u = t.closest("[data-undo]"); if (u){
    const l = D.log.find(z => String(z.id) === u.dataset.undo);
    if (!confirm("Вернуть «" + TITLE(l.key) + "» как было до " + when(l.at) + "?")) return;
    const d = await api("adm_undo", { id: Number(u.dataset.undo) });
    if (d.error){ toast(errText(d.error)); return; }
    D = d; toast("Вернули"); VIEW = "@log"; draw();
  }
});
(async function start(){
  try{ const tg = window.Telegram && window.Telegram.WebApp; if (tg){ tg.ready(); tg.expand(); } }catch(_){}
  if (!(await login())) return;
  const d = await api("adm_get");
  if (d.error){ $("#auth").textContent = errText(d.error); return; }
  D = d; $("#auth").hidden = true; $("#app").hidden = false; home();
})();
</script>
